  const [fantasyCheatSheets, setFantasyCheatSheets] = usePersistentState(STORAGE_KEYS.fantasyCheatSheets, DEFAULT_FANTASY_CHEAT_SHEETS);
  const [fantasyCustomRankings, setFantasyCustomRankings] = usePersistentState(STORAGE_KEYS.fantasyCustomRankings, DEFAULT_FANTASY_CUSTOM_RANKINGS);
  const [fantasyWatchlist, setFantasyWatchlist] = usePersistentState(STORAGE_KEYS.fantasyWatchlist, DEFAULT_FANTASY_WATCHLIST);
  const [fantasySleeper, setFantasySleeper] = usePersistentState(STORAGE_KEYS.fantasySleeper, DEFAULT_FANTASY_SLEEPER);
  const [fantasyYahoo, setFantasyYahoo] = usePersistentState(STORAGE_KEYS.fantasyYahoo, DEFAULT_FANTASY_YAHOO);
  const [moLinks, setMoLinks] = usePersistentState(STORAGE_KEYS.moLinks, DEFAULT_MO_LINKS);
  const [pkiReport, setPkiReport] = usePersistentState(STORAGE_KEYS.pkiReport, {});
  const [moSnapshots, setMoSnapshots] = usePersistentState(STORAGE_KEYS.moSnapshots, []);
  const [moPolicies, setMoPolicies] = usePersistentState(STORAGE_KEYS.moPolicies, moDefaultPolicies());
  const [deck, setDeck] = usePersistentState(STORAGE_KEYS.deck, null);
  const [moTool, setMoTool] = useState(null); // "vuln-s1" | "vuln-iru" | "pki" | "policy" | "deck" | null
  const [trackers, setTrackers] = usePersistentState(STORAGE_KEYS.trackers, DEFAULT_TRACKERS);
  const [financial, setFinancial] = usePersistentState(STORAGE_KEYS.financial, DEFAULT_FINANCIAL);
  const [events, setEvents] = usePersistentState(STORAGE_KEYS.upcoming, DEFAULT_UPCOMING_EVENTS);
  const [history, setHistory] = usePersistentState(STORAGE_KEYS.history, DEFAULT_HISTORY);
  function recordWeight(value) {
    setHistory((h) => ({ ...h, fitness: pushHistoryPoint(h.fitness, value) }));
  }
  function recordHandicap(value) {
    setHistory((h) => ({ ...h, golf: pushHistoryPoint(h.golf, value) }));
  }
  function recordTracker(id, value) {
    setHistory((h) => ({ ...h, trackers: { ...h.trackers, [id]: pushHistoryPoint(h.trackers[id] || [], value) } }));
  }
  const [profile, setProfile] = usePersistentState(STORAGE_KEYS.profile, DEFAULT_PROFILE);
  const [integrations, setIntegrations] = usePersistentState(STORAGE_KEYS.integrations, DEFAULT_INTEGRATIONS);
  const [watchlist, setWatchlist] = usePersistentState(STORAGE_KEYS.watchlist, DEFAULT_WATCHLIST);
  const [journal, setJournal] = usePersistentState(STORAGE_KEYS.journal, DEFAULT_JOURNAL);
  const [goals, setGoals] = usePersistentState(STORAGE_KEYS.goals, DEFAULT_GOALS);
  const [transactions, setTransactions] = usePersistentState(STORAGE_KEYS.transactions, DEFAULT_TRANSACTIONS);
  const [youtube, setYoutube] = usePersistentState(STORAGE_KEYS.youtube, DEFAULT_YOUTUBE);
  const [youtubeVideos, setYoutubeVideos] = useState([]);
  const newYoutubeCount = useMemo(
    () => (youtube.lastSeenAt ? youtubeVideos.filter((v) => new Date(v.publishedAt).getTime() > youtube.lastSeenAt).length : 0),
    [youtubeVideos, youtube.lastSeenAt]
  );

  const [googleAccounts, setGoogleAccounts] = useState([]);
  function addGoogleAccount(account) {
    setGoogleAccounts((prev) => [...prev, account]);
  }
  function removeGoogleAccount(id) {
    setGoogleAccounts((prev) => prev.filter((a) => a.id !== id));
  }
  const [microsoftEvents, setMicrosoftEvents] = useState([]);
  const allConnectedEvents = useMemo(
    () => [...googleAccounts.flatMap((a) => a.events), ...microsoftEvents],
    [googleAccounts, microsoftEvents]
  );

  const [weather, setWeather] = usePersistentState(STORAGE_KEYS.weather, DEFAULT_WEATHER);
  const [weatherStatus, setWeatherStatus] = useState(null);

  async function loadWeather(lat, lon) {
    try {
      const days = await fetchWeatherDays(lat, lon);
      setWeather({ lat, lon, fetchedAt: Date.now(), days });
      setWeatherStatus(null);
    } catch (err) {
      setWeatherStatus({ type: "error", message: "Couldn't load weather right now." });
    }
  }

  function enableWeather() {
    if (!navigator.geolocation) {
      setWeatherStatus({ type: "error", message: "Location isn't available in this browser." });
      return;
    }
    setWeatherStatus({ type: "loading", message: "Getting your location…" });
    navigator.geolocation.getCurrentPosition(
      (pos) => loadWeather(pos.coords.latitude, pos.coords.longitude),
      () => setWeatherStatus({ type: "error", message: "Location permission denied." })
    );
  }

  useEffect(() => {
    const staleAfter = 3 * 60 * 60 * 1000;
    if (weather.lat != null && (!weather.fetchedAt || Date.now() - weather.fetchedAt > staleAfter)) {
      loadWeather(weather.lat, weather.lon);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const allEvents = useMemo(() => [...events, ...allConnectedEvents], [events, allConnectedEvents]);
  const weekAgendaCount = useMemo(() => {
    const isoSet = new Set();
    for (let i = 0; i < 7; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      isoSet.add(d.toISOString().slice(0, 10));
    }
    return allEvents.filter((e) => isoSet.has(e.date)).length;
  }, [allEvents]);
  const suggestions = useMemo(
    () => generateSuggestions({ fitness, golf, trackers, profile, events: allEvents, history, weather, watchlist, newYoutubeCount }),
    [fitness, golf, trackers, profile, allEvents, history, weather, watchlist, newYoutubeCount]
  );

  const [briefingOpen, setBriefingOpen] = useState(() => {
    try {
      const today = new Date().toISOString().slice(0, 10);
      return localStorage.getItem(STORAGE_KEYS.briefingLastShown) !== today;
    } catch (e) {
      return false;
    }
  });

  function dismissBriefing() {
    try {
      localStorage.setItem(STORAGE_KEYS.briefingLastShown, new Date().toISOString().slice(0, 10));
    } catch (e) {
      /* localStorage unavailable — just close in-memory */
    }
    setBriefingOpen(false);
  }

  const doneGoals = goals.filter((g) => g.status === "done").length;
  const pageStats = {
    fitness: { value: fitness.currentWeight, detail: `target ${fitness.targetWeight} lbs` },
    golf: { value: golf.handicap, detail: `${golf.roundsYtd} rounds YTD` },
    financial: {
      value: financial.targetDownPayment
        ? `${Math.min(100, Math.round(((financial.currentSavings || 0) / financial.targetDownPayment) * 100))}%`
        : "—",
      detail: "toward down payment",
    },
    transactions: { value: transactions.length || 0, detail: "logged" },
    upcoming: { value: allEvents.length || 0, detail: "events" },
    agenda: { value: weekAgendaCount || 0, detail: "this week" },
    youtube: { value: newYoutubeCount || youtubeVideos.length || 0, detail: newYoutubeCount ? "new" : "checked" },
    profile: { value: profile.interests.length || 0, detail: "interests" },
    watchlist: { value: watchlist.length || 0, detail: "queued" },
    trackers: { value: trackers.length || 0, detail: "trackers" },
    goals: { value: goals.length ? `${doneGoals}/${goals.length}` : 0, detail: "done" },
    videos: { value: null, detail: "library" },
    journal: { value: journal.length || 0, detail: "entries" },
    fantasy: { value: fantasyWatchlist.length || 0, detail: "watchlist" },
  };

  return (
    <div
      style={{
        minHeight: "100vh",
        background: theme.pageBgGradient !== "none" ? theme.pageBgGradient : theme.pageBg,
        color: theme.text,
        transition: "background 0.25s ease, color 0.25s ease",
      }}
    >
      <Sidebar
        theme={theme}
        themeKey={themeKey}
        fitness={fitness}
        golf={golf}
        trackers={trackers}
        profile={profile}
        integrations={integrations}
        googleAccounts={googleAccounts}
        onAddGoogleAccount={addGoogleAccount}
        onRemoveGoogleAccount={removeGoogleAccount}
        microsoftEvents={microsoftEvents}
        onMicrosoftEvents={setMicrosoftEvents}
        financial={financial}
        events={events}
        history={history}
        suggestionsCount={suggestions.length}
        upcomingCount={allEvents.length}
        weekAgendaCount={weekAgendaCount}
        watchlist={watchlist}
        journal={journal}
        goals={goals}
        transactions={transactions}
        newYoutubeCount={newYoutubeCount}
        youtube={youtube}
        golfSimRounds={golfSimRounds}
        golfOutdoorRounds={golfOutdoorRounds}
        fantasyCheatSheets={fantasyCheatSheets}
        fantasyCustomRankings={fantasyCustomRankings}
        fantasyWatchlist={fantasyWatchlist}
        fantasySleeper={fantasySleeper}
        fantasyYahoo={fantasyYahoo}
        moLinks={moLinks}
        setMoLinks={setMoLinks}
        onOpenMoTool={setMoTool}
        page={page}
        onNavigate={navigate}
        setThemeKey={setThemeKey}
        setFitness={setFitness}
        setGolf={setGolf}
        setTrackers={setTrackers}
        setProfile={setProfile}
        setIntegrations={setIntegrations}
        setFinancial={setFinancial}
        setEvents={setEvents}
        setHistory={setHistory}
        setWatchlist={setWatchlist}
        setJournal={setJournal}
        setGoals={setGoals}
        setTransactions={setTransactions}
        setYoutube={setYoutube}
        setGolfSimRounds={setGolfSimRounds}
        setGolfOutdoorRounds={setGolfOutdoorRounds}
        setFantasyCheatSheets={setFantasyCheatSheets}
        setFantasyCustomRankings={setFantasyCustomRankings}
        setFantasyWatchlist={setFantasyWatchlist}
        setFantasySleeper={setFantasySleeper}
        setFantasyYahoo={setFantasyYahoo}
      />

      <div className="v-main">
        <div
          style={
            page === "securityx"
              ? { maxWidth: "none", margin: 0, padding: 0 }
              : {
                  maxWidth: page === "home" ? "1200px" : page === "fantasy" ? "1320px" : "760px",
                  margin: "0 auto",
                  padding: "32px 20px 64px",
                }
          }
        >
          {page === "home" && (
            <HomeOverview
              theme={theme}
              suggestions={suggestions}
              weather={weather}
              weatherStatus={weatherStatus}
              onEnableWeather={enableWeather}
              onOpenBriefing={() => setBriefingOpen(true)}
              pageStats={pageStats}
              onNavigate={navigate}
            />
          )}
          {page === "fitness" && (
            <FitnessSection theme={theme} data={fitness} setData={setFitness} history={history.fitness} onRecordWeight={recordWeight} />
          )}
          {page === "golf" && (
            <div style={{ display: "flex", flexDirection: "column", gap: "20px" }}>
              <GolfSection theme={theme} data={golf} setData={setGolf} history={history.golf} onRecordHandicap={recordHandicap} />
              <GolfRoundLog theme={theme} title="Simulator Rounds" rounds={golfSimRounds} setRounds={setGolfSimRounds} delay={0} />
              <GolfRoundLog theme={theme} title="Outdoor Rounds" rounds={golfOutdoorRounds} setRounds={setGolfOutdoorRounds} delay={0} />
            </div>
          )}
          {page === "fantasy" && (
            <FFPage
              theme={theme}
              cheatSheets={fantasyCheatSheets}
              setCheatSheets={setFantasyCheatSheets}
              customRankings={fantasyCustomRankings}
              setCustomRankings={setFantasyCustomRankings}
              watchlist={fantasyWatchlist}
              setWatchlist={setFantasyWatchlist}
              sleeper={fantasySleeper}
              setSleeper={setFantasySleeper}
              yahoo={fantasyYahoo}
              setYahoo={setFantasyYahoo}
            />
          )}
          {page === "financial" && <FinancialSection theme={theme} data={financial} setData={setFinancial} />}
          {page === "transactions" && (
            <TransactionsSection theme={theme} transactions={transactions} setTransactions={setTransactions} categoryOptions={[]} delay={0} />
          )}
          {page === "upcoming" && (
            <UpcomingSection theme={theme} events={events} setEvents={setEvents} connectedEvents={allConnectedEvents} />
          )}
          {page === "agenda" && <AgendaStripSection theme={theme} events={allEvents} delay={0} />}
          {page === "youtube" && (
            <YouTubeSection
              theme={theme}
              integrations={integrations}
              setIntegrations={setIntegrations}
              videos={youtubeVideos}
              onVideos={setYoutubeVideos}
              youtubeState={youtube}
              setYoutubeState={setYoutube}
              delay={0}
            />
          )}
          {page === "profile" && <ProfileSection theme={theme} profile={profile} setProfile={setProfile} />}
          {page === "watchlist" && (
            <WatchQueueSection theme={theme} watchlist={watchlist} setWatchlist={setWatchlist} genres={profile.genres} delay={0} />
          )}
          {page === "trackers" && (
            <CustomTrackersSection
              theme={theme}
              trackers={trackers}
              setTrackers={setTrackers}
              trackerHistory={history.trackers}
              onRecordTracker={recordTracker}
            />
          )}
          {page === "goals" && <GoalsBoardSection theme={theme} data={goals} setData={setGoals} delay={0} />}
          {page === "videos" && <VideoLibrarySection theme={theme} integrations={integrations} setIntegrations={setIntegrations} />}
          {page === "journal" && <JournalSection theme={theme} data={journal} setData={setJournal} delay={0} />}
          {page === "securityx" && <SecurityXSection theme={theme} />}
        </div>
      </div>

      {briefingOpen && suggestions.length > 0 && (
        <BriefingModal theme={theme} suggestions={suggestions} weather={weather} onClose={dismissBriefing} />
      )}

      {(moTool === "vuln-s1" || moTool === "vuln-iru") && (
        <VulnerabilityAnalyzerModal
          theme={theme}
          initialSource={moTool === "vuln-iru" ? "iru" : "s1"}
          snapshots={moSnapshots}
          setSnapshots={setMoSnapshots}
          onClose={() => setMoTool(null)}
        />
      )}
      {moTool === "pki" && (
        <PkiReportModal theme={theme} values={pkiReport} setValues={setPkiReport} onClose={() => setMoTool(null)} />
      )}
      {moTool === "policy" && (
        <PolicyTrackerModal theme={theme} policies={moPolicies} setPolicies={setMoPolicies} onClose={() => setMoTool(null)} />
      )}
      {moTool === "deck" && (
        <DeckBuilderModal theme={theme} deck={deck} setDeck={setDeck} onClose={() => setMoTool(null)} />
      )}
    </div>
  );
}

/* ----------------------------------------------------------------------
   FANTASY TAB — ported from "The War Room" (a separate fantasy-football
   dashboard app: react-router + react-query + Netlify Functions/Blobs).
   Its own design system (FF_CSS below) is pasted in near-verbatim and
   rendered inside a real Shadow DOM subtree (FFShadowRoot) so its ~300
   classes never have to be reconciled with Vantage's theme system — style
   isolation works in both directions for free. Only two seams change from
   the original file: ":root" -> ":host" (a shadow tree has no document
   root), and --accent reads from --ff-accent, which FFShadowRoot sets from
   Vantage's active theme.accent — the one deliberate "both of the above"
   hook between the two design systems the user asked for. The outer page
   header/sub-nav around it is plain Vantage theme-driven JSX, same as every
   other page.
---------------------------------------------------------------------- */

const FF_CSS = `
:host {
  /* Surfaces */
  --bg: #0a0d12;
  --surface: #131820;
  --surface-2: #1a2029;
  --surface-3: #222a36;
  --border: #262e3a;
  --border-strong: #37414f;

  /* Text */
  --text: #eef1f5;
  --text-secondary: #b9c1cd;
  --muted: #7c8798;

  /* Brand / accent */
  --accent: var(--ff-accent, #2f7dff);
  --accent-strong: #1f63e6;
  --accent-soft: rgba(47, 125, 255, 0.16);
  --teal: #17d9c4;
  --accent-gradient: linear-gradient(135deg, var(--accent), var(--teal));

  /* Functional */
  --success: #22c55e;
  --success-soft: rgba(34, 197, 94, 0.14);
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.14);
  --warning: #f59e0b;
  --warning-soft: rgba(245, 158, 11, 0.14);

  /* Tiers */
  --gold: #ffd166;
  --silver: #cbd5e1;
  --bronze: #d99a5b;

  /* Positions */
  --pos-qb: #ef5158;
  --pos-rb: #2fbf71;
  --pos-wr: #3b82f6;
  --pos-te: #f0973b;
  --pos-k: #a78bfa;
  --pos-def: #6b7684;
  --pos-pick: #d4a017;

  /* Platforms */
  --sleeper: #4c6ef5;
  --yahoo: #6b21d8;

  /* Shape */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-pill: 999px;

  /* Shadow */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5), 0 1px 1px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.4);
  --shadow-glow: 0 0 0 1px var(--accent-soft), 0 8px 22px rgba(47, 125, 255, 0.28);

  /* Base — ported from index.css's body{} rule; there's no <body> inside a
     shadow tree, so these live on :host and inherit down instead. */
  display: block;
  background: var(--bg);
  color: var(--text);
  font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Reset ---------- */

* {
  box-sizing: border-box;
}

a {
  color: var(--accent);
}

h1,
h2,
h3 {
  margin: 0 0 0.5rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
}

h1 {
  font-size: 1.9rem;
}

h2 {
  font-size: 1.25rem;
  margin-top: 0;
}

h3 {
  font-size: 1rem;
}

p {
  margin: 0 0 0.75rem;
  color: var(--text-secondary);
}

::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--radius-pill);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--accent);
}

/* ---------- Buttons, inputs, selects ---------- */

button,
.button-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  background: var(--accent-gradient);
  color: #051220;
  border: none;
  border-radius: var(--radius-md);
  padding: 0.55rem 1.1rem;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  box-shadow: var(--shadow-sm);
  transition: filter 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
}

button:hover,
.button-link:hover {
  filter: brightness(1.08);
  box-shadow: var(--shadow-glow);
}

button:active,
.button-link:active {
  transform: translateY(1px);
}

button:disabled {
  background: var(--surface-3);
  color: var(--muted);
  cursor: not-allowed;
  box-shadow: none;
  filter: none;
}

input[type="text"],
input[type="number"],
select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 0.55rem 0.75rem;
  font-size: 0.9rem;
  font-family: inherit;
}

input[type="text"]:focus,
input[type="number"]:focus,
select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) center, calc(100% - 13px) center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 2rem;
  cursor: pointer;
}

input[type="checkbox"] {
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
}

/* ---------- Layout ---------- */

.page {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0.5rem 0 3.5rem;
  width: 100%;
  flex: 1;
}

.page--wide {
  max-width: 1360px;
}

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  gap: 1rem;
  flex-wrap: wrap;
}

.page-header h1 {
  font-size: 1.5rem;
}

section {
  margin-bottom: 2rem;
}

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-bottom: 1rem;
  align-items: center;
}

.filter-bar input[type="text"] {
  flex: 1 1 220px;
}

.filter-bar--secondary {
  margin-top: -0.25rem;
}

.filter-toggle {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  padding: 0.5rem 0.8rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}

.filter-toggle:has(input:checked) {
  color: var(--text);
  border-color: var(--accent);
  background: var(--accent-soft);
}

.empty-state {
  color: var(--muted);
}

.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin-top: 1.5rem;
}

.pagination__status {
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 600;
}

.pagination button {
  background: var(--surface-2);
  color: var(--text);
  box-shadow: none;
}

.pagination button:hover:not(:disabled) {
  filter: none;
  background: var(--surface-3);
  box-shadow: none;
}

.pagination button:disabled {
  opacity: 0.5;
}

.error-text {
  color: var(--danger);
}

.success-text {
  color: var(--success);
}

.data-source-note {
  color: var(--muted);
  font-size: 0.78rem;
  margin: -0.4rem 0 1rem;
}

.warning-banner {
  background: var(--warning-soft);
  border: 1px solid color-mix(in srgb, var(--warning) 45%, transparent);
  border-radius: var(--radius-md);
  padding: 0.75rem 1rem;
  margin-bottom: 1rem;
  color: #ffd08a;
}

.back-link {
  background: none;
  border: none;
  box-shadow: none;
  padding: 0;
  color: var(--muted);
  text-decoration: none;
  display: inline-block;
  margin-bottom: 1rem;
  font-weight: 600;
  font-size: 0.9rem;
}

.back-link:hover {
  color: var(--text);
  filter: none;
  transform: none;
  box-shadow: none;
}

/* ---------- Dashboard widget grid ---------- */

.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 1.25rem;
  align-items: start;
}

.dashboard-widget {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  box-shadow: var(--shadow-sm);
}

.dashboard-widget--wide {
  grid-column: 1 / -1;
}

.dashboard-widget__header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}

.dashboard-widget__header h2 {
  margin: 0;
}

.dashboard-widget__stack {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

/* ---------- Tables ---------- */

.data-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  font-variant-numeric: tabular-nums;
}

.data-table th,
.data-table td {
  text-align: left;
  padding: 0.6rem 0.85rem;
  border-bottom: 1px solid var(--border);
}

.data-table th {
  color: var(--muted);
  font-weight: 800;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: var(--surface-2);
}

.data-table tbody tr {
  transition: background-color 0.1s ease;
}

.data-table tbody tr:nth-child(even) {
  background: rgba(255, 255, 255, 0.015);
}

.data-table tbody tr:hover {
  background: var(--surface-3);
}

.data-table tbody tr:last-child td {
  border-bottom: none;
}

.data-table-scroll {
  overflow-x: auto;
  border-radius: var(--radius-lg);
}

.game-log-points {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.game-log-points__track {
  width: 60px;
  height: 6px;
  border-radius: var(--radius-pill);
  background: var(--surface-3);
  overflow: hidden;
  flex-shrink: 0;
}

.game-log-points__bar {
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--accent-gradient);
}

.data-table-scroll--frozen-first .data-table th:first-child,
.data-table-scroll--frozen-first .data-table td:first-child {
  position: sticky;
  left: 0;
  z-index: 1;
  background: rgba(26, 32, 41, 0.75);
}

.data-table-scroll--frozen-first .data-table tbody td:first-child {
  background: rgba(19, 24, 32, 0.75);
}

.data-table-scroll--frozen-first .data-table tbody tr:nth-child(even) td:first-child {
  background: rgba(23, 29, 38, 0.75);
}

.table-player-cell {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.table-player-link {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--text);
  text-decoration: none;
  font-weight: 700;
}

.table-player-link:hover {
  color: var(--accent);
}

.players-table__number {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 500;
}

.trending-count {
  color: var(--accent);
  font-weight: 800;
}

.injury-badge {
  color: var(--warning);
  font-size: 0.82rem;
  font-weight: 700;
}

.checklist {
  list-style: none;
  padding: 0;
  margin: 1rem 0;
}

.checklist li {
  padding: 0.35rem 0;
}

.checklist label {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--text-secondary);
  font-weight: 600;
}

/* ---------- Badges ---------- */

.position-badge {
  display: inline-block;
  padding: 0.18rem 0.55rem;
  border-radius: var(--radius-sm);
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: #071019;
}

.position-badge--QB {
  background: var(--pos-qb);
  color: white;
}

.position-badge--RB {
  background: var(--pos-rb);
}

.position-badge--WR {
  background: var(--pos-wr);
  color: white;
}

.position-badge--TE {
  background: var(--pos-te);
}

.position-badge--K {
  background: var(--pos-k);
  color: white;
}

.position-badge--DEF {
  background: var(--pos-def);
  color: white;
}

.position-badge--PICK {
  background: var(--pos-pick);
}

.position-badge--UNK {
  background: var(--border-strong);
  color: var(--muted);
}

.platform-badge {
  display: inline-block;
  padding: 0.2rem 0.6rem;
  border-radius: var(--radius-sm);
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: white;
  vertical-align: middle;
}

.platform-badge--sleeper {
  background: var(--sleeper);
}

.platform-badge--yahoo {
  background: var(--yahoo);
}

.team-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-weight: 700;
  color: var(--text-secondary);
}

.team-tag__dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  flex-shrink: 0;
}

.rank-medal {
  font-weight: 800;
}

span.rank-medal--gold {
  color: var(--gold);
}

span.rank-medal--silver {
  color: var(--silver);
}

span.rank-medal--bronze {
  color: var(--bronze);
}

/* ---------- Avatars ---------- */

.player-avatar {
  border-radius: 999px;
  object-fit: cover;
  background: var(--surface-3);
  border: 1px solid var(--border);
  flex-shrink: 0;
}

.player-avatar--sm {
  width: 30px;
  height: 30px;
}

.player-avatar--md {
  width: 52px;
  height: 52px;
}

.player-avatar--lg {
  width: 120px;
  height: 120px;
  border-width: 3px;
  border-color: var(--accent);
  box-shadow: var(--shadow-glow);
}

.player-avatar--logo {
  object-fit: contain;
  background: var(--surface);
  padding: 4px;
}

.player-avatar--fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-weight: 800;
  font-size: 0.8rem;
}

.player-avatar--lg.player-avatar--fallback {
  font-size: 2.2rem;
}

/* ---------- Watchlist ---------- */

.watchlist-button {
  background: none;
  border: none;
  box-shadow: none;
  padding: 0.1rem 0.2rem;
  color: var(--muted);
  font-size: 1.1rem;
  line-height: 1;
  flex-shrink: 0;
}

.watchlist-button:hover {
  color: var(--gold);
  filter: none;
  transform: none;
}

.watchlist-button--active {
  color: var(--gold);
}

h1 .watchlist-button {
  font-size: 1.25rem;
  vertical-align: middle;
  margin-left: 0.4rem;
}

/* ---------- Top players list (Dashboard) ---------- */

.top-players-list {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.top-player-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.5rem 0.75rem;
  text-decoration: none;
  color: var(--text);
  transition: border-color 0.12s ease, background-color 0.12s ease;
}

.top-player-row:hover {
  border-color: var(--accent);
  background: var(--surface-3);
}

.top-player-row__rank {
  color: var(--accent);
  font-weight: 800;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  width: 2rem;
  flex-shrink: 0;
}

.top-player-row__name {
  font-weight: 700;
  font-size: 0.9rem;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.top-player-row__value {
  color: var(--text-secondary);
  font-weight: 700;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  margin-left: auto;
}

/* ---------- League cards / matchup ---------- */

.league-grid {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.league-card {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.75rem 0.9rem;
  text-decoration: none;
  color: var(--text);
  transition: border-color 0.12s ease, background-color 0.12s ease;
}

.league-card:hover {
  border-color: var(--accent);
  background: var(--surface-3);
}

.league-card__body {
  flex: 1;
  min-width: 0;
}

.league-card__body h3 {
  margin: 0;
  font-size: 0.95rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.league-card__team {
  color: var(--text-secondary);
  margin: 0.1rem 0 0;
  font-size: 0.82rem;
}

.league-card__record {
  color: var(--muted);
  font-size: 0.85rem;
  font-weight: 700;
  margin: 0;
  text-align: right;
  white-space: nowrap;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.1rem;
}

.league-card__season {
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 500;
}

.matchup-card {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
}

.matchup-card__team {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.35rem;
  flex: 1;
  padding: 0.75rem;
  border-radius: var(--radius-md);
}

.matchup-card__team--leading {
  background: var(--success-soft);
}

.matchup-card__name {
  font-weight: 700;
}

.matchup-card__score {
  font-size: 1.75rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
}

.matchup-card__team--leading .matchup-card__score {
  color: var(--success);
}

.matchup-card__vs {
  color: var(--muted);
  font-weight: 800;
  font-size: 0.85rem;
}

.league-settings__positions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.3rem;
}

.transactions-feed {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.transactions-feed__row {
  display: flex;
  align-items: center;
  gap: 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.75rem 1rem;
}

.transactions-feed__type {
  flex-shrink: 0;
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--accent);
  min-width: 6.5rem;
}

.transactions-feed__body {
  flex: 1;
  color: var(--text-secondary);
  font-size: 0.88rem;
}

.transactions-feed__body p {
  margin: 0.15rem 0;
}

.transactions-feed__date {
  flex-shrink: 0;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 600;
}

/* ---------- Player profile ---------- */

.player-profile__banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.75rem;
}

.player-profile__identity {
  display: flex;
  align-items: center;
  gap: 1.1rem;
}

.player-profile__identity h1 {
  font-size: 1.55rem;
  margin-bottom: 0.35rem;
}

.player-profile__number {
  color: var(--muted);
  font-size: 0.9rem;
  margin-left: 0.5rem;
  font-weight: 500;
}

.player-profile__meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  color: var(--muted);
  font-weight: 600;
}

.player-profile__stats {
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
}

.player-profile__stats > div {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.player-profile__bio-label {
  color: var(--muted);
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 700;
}

.player-profile__stats span:last-child {
  font-size: 0.95rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.ranking-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1rem;
}

.ranking-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.1rem 1rem;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.ranking-card__label {
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 700;
}

.ranking-card__rank {
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.ranking-card__value {
  color: var(--text);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.ranking-card__unranked {
  color: var(--muted);
  font-weight: 600;
  padding: 0.5rem 0;
}

/* ---------- Trade analyzer ---------- */

.trade-grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
}

.trade-vs {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border-radius: 999px;
  background: var(--accent-gradient);
  color: #051220;
  font-weight: 800;
  font-size: 0.8rem;
  letter-spacing: 0.03em;
  box-shadow: var(--shadow-sm);
  justify-self: center;
}

@media (max-width: 700px) {
  .trade-grid {
    grid-template-columns: 1fr;
  }
  .trade-vs {
    margin: -0.25rem auto;
  }
}

.trade-side {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.15rem;
  box-shadow: var(--shadow-sm);
}

.trade-side h3 {
  margin: 0 0 0.75rem;
  font-size: 1.02rem;
}

.trade-side input[type="text"] {
  width: 100%;
  margin-right: 0;
  margin-bottom: 0.5rem;
  box-sizing: border-box;
}

.trade-side__matches {
  list-style: none;
  padding: 0;
  margin: 0 0 0.75rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.trade-side__matches button {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--text);
  border-radius: 0;
  padding: 0.55rem 0.85rem;
  font-weight: 500;
  box-shadow: none;
}

.trade-side__matches button:hover {
  background: var(--surface-2);
  filter: none;
  transform: none;
}

.trade-side__selected {
  list-style: none;
  padding: 0;
  margin: 0;
}

.trade-side__selected li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
}

.trade-side__value {
  color: var(--accent);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.trade-side__remove {
  background: none;
  border: none;
  box-shadow: none;
  padding: 0 0.3rem;
  color: var(--muted);
  font-size: 1.1rem;
  line-height: 1;
}

.trade-side__remove:hover {
  color: var(--danger);
  filter: none;
  transform: none;
}

.trade-side__total {
  margin: 0.75rem 0 0;
  font-weight: 700;
}

.trade-verdict {
  border-radius: var(--radius-lg);
  padding: 1rem;
  font-weight: 700;
  text-align: center;
  border: 1px solid var(--border);
}

.trade-verdict--neutral {
  background: var(--surface);
  color: var(--muted);
}

.trade-verdict--even {
  background: var(--success-soft);
  border-color: color-mix(in srgb, var(--success) 45%, transparent);
  color: #86efac;
}

.trade-verdict--lopsided {
  background: var(--warning-soft);
  border-color: color-mix(in srgb, var(--warning) 45%, transparent);
  color: #fcd34d;
}

.trade-review-trigger {
  display: flex;
  justify-content: center;
  margin-top: 1rem;
}

/* ---------- Comparison table ---------- */

.comparison-scroll {
  overflow-x: auto;
  margin-top: 1rem;
  border-radius: var(--radius-lg);
}

.comparison-table {
  min-width: 100%;
}

.comparison-table th,
.comparison-table td {
  white-space: nowrap;
}

.comparison-table__label {
  color: var(--muted);
  font-weight: 800;
  position: sticky;
  left: 0;
  background: var(--surface);
}

.comparison-table th:first-child {
  position: sticky;
  left: 0;
  background: var(--surface-2);
  z-index: 1;
}

.comparison-table__player {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.comparison-table__player a {
  color: var(--text);
  text-decoration: none;
  font-weight: 700;
}

.comparison-table__player a:hover {
  color: var(--accent);
}

.comparison-table__winner {
  color: var(--success);
  font-weight: 800;
}

/* ---------- Modal ---------- */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 10, 0.78);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 4vh 1.5rem;
  z-index: 100;
  overflow-y: auto;
}

.modal-panel {
  width: 100%;
  max-width: 640px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  max-height: 92vh;
  display: flex;
  flex-direction: column;
}

.modal-panel__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.15rem 1.4rem;
  border-bottom: 1px solid var(--border);
}

.modal-panel__header h2 {
  margin: 0;
  font-size: 1.1rem;
}

.modal-panel__close {
  background: none;
  border: none;
  box-shadow: none;
  padding: 0.2rem 0.5rem;
  color: var(--muted);
  font-size: 1.4rem;
  line-height: 1;
}

.modal-panel__close:hover {
  color: var(--text);
  filter: none;
  transform: none;
}

.modal-panel__body {
  padding: 1.4rem;
  overflow-y: auto;
}

.comparison-modal__stack {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.player-detail-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1rem;
}

.player-detail-card__label {
  display: inline-block;
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 800;
  margin-bottom: 0.5rem;
}

.player-detail-card__header {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 0.9rem;
}

.player-detail-card__name {
  color: var(--text);
  text-decoration: none;
  font-weight: 800;
  font-size: 1rem;
}

.player-detail-card__name:hover {
  color: var(--accent);
}

.player-detail-card__meta {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-top: 0.35rem;
  color: var(--muted);
  font-weight: 600;
  font-size: 0.85rem;
}

.player-detail-card__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
  gap: 0.8rem;
}

.player-detail-card__grid > div {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.player-detail-card__stat-label {
  color: var(--muted);
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 700;
}

.trade-review-modal__verdict {
  text-align: center;
  font-weight: 700;
  margin: 0 0 1.15rem;
}

.trade-review-modal__columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.15rem;
}

.trade-review-modal__columns h3 {
  margin: 0 0 0.75rem;
  font-size: 0.95rem;
}

@media (max-width: 600px) {
  .trade-review-modal__columns {
    grid-template-columns: 1fr;
  }
}

/* ---------- Onboarding ---------- */

.onboarding-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.4rem;
  box-shadow: var(--shadow-sm);
}

.onboarding-section--sleeper {
  border-left-color: var(--sleeper);
}

.onboarding-section--yahoo {
  border-left-color: var(--yahoo);
}

/* ---------- Import rankings ---------- */

.import-rankings__form,
.import-rankings__review,
.import-rankings__saved {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.4rem;
  box-shadow: var(--shadow-sm);
  margin-bottom: 1.4rem;
  display: flex;
  flex-direction: column;

// Renders children inside a real Shadow DOM subtree carrying FF_CSS — style
// isolation works in both directions, so ~2,400 lines of a completely
// different app's CSS (classes, bare h1/a/button selectors, the works) can
// be pasted in near-verbatim without any risk of colliding with Vantage's
// own styles, and without Vantage's styles leaking in either.
function FFShadowRoot({ accent, children }) {
  const hostRef = useRef(null);
  const [shadowRoot, setShadowRoot] = useState(null);
  useEffect(() => {
    const host = hostRef.current;
    if (!host) return;
    setShadowRoot(host.shadowRoot || host.attachShadow({ mode: "open" }));
  }, []);
  return (
    <div ref={hostRef} style={{ "--ff-accent": accent, display: "block" }}>
      {shadowRoot &&
        ReactDOM.createPortal(
          <>
            <style>{FF_CSS}</style>
            {children}
          </>,
          shadowRoot
        )}
    </div>
  );
}

// Ordered severity buckets + fixed colors that read on any Vantage theme.
const MO_SEVERITY_ORDER = ["Critical", "High", "Medium", "Low", "Info", "Unrated"];
const MO_SEVERITY_COLORS = {
  Critical: "#c0392b",
  High: "#e07a20",
  Medium: "#c9a227",
  Low: "#2f8f4e",
  Info: "#5b7a99",
  Unrated: "#9a9a94",
};

function moNormalizeSeverity(raw) {
  const s = String(raw == null ? "" : raw).toLowerCase().trim();
  if (!s) return "Unrated";
  if (s.includes("crit")) return "Critical";
  if (s.includes("high")) return "High";
  if (s.includes("med") || s.includes("mod")) return "Medium";
  if (s.includes("low")) return "Low";
  if (s.includes("info") || s.includes("none") || s.includes("negli")) return "Info";
  // Fall back to a CVSS-style numeric score if present.
  const n = parseFloat(s);
  if (!isNaN(n)) {
    if (n >= 9) return "Critical";
    if (n >= 7) return "High";
    if (n >= 4) return "Medium";
    if (n > 0) return "Low";
    return "Info";
  }
  return "Unrated";
}

// Minimal RFC-4180-ish CSV parser (handles quoted fields, embedded commas,
// escaped quotes, and CRLF). Returns an array of string rows.
function moParseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field); field = "";
    } else if (c === "\n") {
      row.push(field); rows.push(row); row = []; field = "";
    } else if (c !== "\r") {
      field += c;
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

// First non-empty row becomes headers; the rest become {header: value} records.
function moRowsToRecords(rows) {
  const clean = rows.filter((r) => r.some((c) => String(c).trim() !== ""));
  if (clean.length === 0) return { headers: [], records: [] };
  const headers = clean[0].map((h, i) => String(h).trim() || `Column ${i + 1}`);
  const records = clean.slice(1).map((r) => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = r[i] == null ? "" : String(r[i]); });
    return obj;
  });
  return { headers, records };
}

// Best-guess column match: first header whose lowercased name contains any
// of the candidate substrings.
function moDetectColumn(headers, candidates) {
  const lower = headers.map((h) => h.toLowerCase());
  for (const cand of candidates) {
    const idx = lower.findIndex((h) => h.includes(cand));
    if (idx !== -1) return headers[idx];
  }
  return "";
}

// Lazily pull SheetJS from its CDN only when an .xlsx/.xls file is dropped —
// CSV never needs it, and this keeps the initial page weightless.
function moLoadSheetJS() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (window.__moXlsxPromise) return window.__moXlsxPromise;
  window.__moXlsxPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
    s.onload = () => (window.XLSX ? resolve(window.XLSX) : reject(new Error("Spreadsheet library failed to initialize.")));
    s.onerror = () => { window.__moXlsxPromise = null; reject(new Error("Couldn't load the spreadsheet library (are you offline?). Export as CSV and try again.")); };
    document.head.appendChild(s);
  });
  return window.__moXlsxPromise;
}

async function moParseSpreadsheet(file) {
  const name = (file.name || "").toLowerCase();
  const isCsv = name.endsWith(".csv") || file.type === "text/csv" || name.endsWith(".txt");
  if (isCsv) {
    const text = await file.text();
    return moRowsToRecords(moParseCSV(text));
  }
  const XLSX = await moLoadSheetJS();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const arr = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: "" });
  return moRowsToRecords(arr.map((r) => r.map((c) => (c == null ? "" : String(c)))));
}

function moDownload(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function moCsvCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function moFormatTs(ts) {
  try {
    return new Date(ts).toLocaleString(undefined, {
      month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit",
    });
  } catch (e) {
    return ts;
  }
}

// Uploaded policy documents live in IndexedDB (like the video library) so real
// PDFs/DOCX don't blow the localStorage quota. Metadata stays on the record.
const POLICY_DB_NAME = "vantage-policydocs";
const POLICY_STORE = "docs";
function openPolicyDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("This browser doesn't support local document storage.")); return; }
    const req = indexedDB.open(POLICY_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(POLICY_STORE)) db.createObjectStore(POLICY_STORE, { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbPutPolicyDoc(record) {
  const db = await openPolicyDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(POLICY_STORE, "readwrite");
    tx.objectStore(POLICY_STORE).put(record);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGetPolicyDoc(id) {
  const db = await openPolicyDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(POLICY_STORE, "readonly");
    const req = tx.objectStore(POLICY_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function dbDeletePolicyDoc(id) {

    tx.objectStore(POLICY_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ---- PowerPoint (.pptx) template filler ----
   A .pptx is a zip of XML. We find {{token}} placeholders in the slide XML,
   collect them into a form, then swap the typed values back in and re-zip a
   fresh deck — layout/fonts/branding untouched. All in-browser via fflate.
   The template blob is reused from the policy IndexedDB store under a
   reserved id; the token list + typed values persist in localStorage. */
const DECK_TEMPLATE_ID = "__deck_template__";
// Which parts of the package we scan/fill (slide + speaker-note text).
const DECK_XML_RE = /^ppt\/(slides|notesSlides)\/[^/]+\.xml$/;

function xmlEscape(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&apos;")
    .replace(/\r?\n/g, " ");
}

// PowerPoint often splits a typed token across runs (…{{bloc</a:t>…<a:t>ked}}).
// Stripping the tags that fall *inside* a {{…}} span re-joins it into one run
// so token matching is reliable.
function deckDesplitTokens(xml) {
  return xml.replace(/\{\{[\s\S]*?\}\}/g, (m) => m.replace(/<[^>]*>/g, ""));
}

function deckFindTokens(xml) {
  const clean = deckDesplitTokens(xml);
  const out = [];
  const re = /\{\{\s*([^}]+?)\s*\}\}/g;
  let m;
  while ((m = re.exec(clean)) !== null) out.push(m[1].trim());
  return out;
}

function deckFillXml(xml, values) {
  const clean = deckDesplitTokens(xml);
  return clean.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (full, name) => {
    const key = name.trim();
    return Object.prototype.hasOwnProperty.call(values, key) ? xmlEscape(values[key]) : full;
  });
}

// Read a .pptx File → { tokens: [unique, in first-seen order], fileCount }.
async function deckScanTemplate(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const files = window.fflate.unzipSync(buf);
  const dec = new TextDecoder();
  const seen = new Set();
  const tokens = [];
  Object.keys(files).forEach((path) => {
    if (!DECK_XML_RE.test(path)) return;
    deckFindTokens(dec.decode(files[path])).forEach((t) => {
      if (!seen.has(t)) { seen.add(t); tokens.push(t); }
    });
  });
  return { tokens };
}

// Read the stored template blob, fill every slide, and return a new .pptx Blob.
async function deckGenerate(values) {
  const rec = await dbGetPolicyDoc(DECK_TEMPLATE_ID);
  if (!rec || !rec.blob) throw new Error("No template stored — upload your deck first.");
  const buf = new Uint8Array(await rec.blob.arrayBuffer());
  const files = window.fflate.unzipSync(buf);
  const dec = new TextDecoder();
  const enc = new TextEncoder();
  Object.keys(files).forEach((path) => {
    if (!DECK_XML_RE.test(path)) return;
    const filled = deckFillXml(dec.decode(files[path]), values);
    files[path] = enc.encode(filled);
  });
  const out = window.fflate.zipSync(files);
  return new Blob([out], { type: "application/vnd.openxmlformats-officedocument.presentationml.presentation" });
}

/* ---- Vulnerability Analyzer ---- */
function VulnerabilityAnalyzerModal({ theme, initialSource, snapshots, setSnapshots, onClose }) {
  const [source, setSource] = useState(initialSource === "iru" ? "iru" : "s1");
  // Each source keeps its OWN dataset + column mapping so S1 and IRU never
  // bleed into one another — switching the toggle just swaps which one shows.
  const [bySource, setBySource] = useState({
    s1: { data: null, fileName: "", severityCol: "", assetCol: "", nameCol: "" },
    iru: { data: null, fileName: "", severityCol: "", assetCol: "", nameCol: "" },
  });
  const [status, setStatus] = useState(null); // {type, message} — per active source
  const [activeFilter, setActiveFilter] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const [savedNote, setSavedNote] = useState(false);
  const fileRef = useRef(null);

  const cur = bySource[source];
  const { data, fileName, severityCol, assetCol, nameCol } = cur;

  function patchSource(src, patch) {
    setBySource((prev) => ({ ...prev, [src]: { ...prev[src], ...patch } }));
  }
  const setSeverityCol = (v) => patchSource(source, { severityCol: v });
  const setAssetCol = (v) => patchSource(source, { assetCol: v });
  const setNameCol = (v) => patchSource(source, { nameCol: v });

  // Follow the source the popover opened us with (S1 vs IRU) without wiping
  // the other source's already-loaded data.
  useEffect(() => {
    setSource(initialSource === "iru" ? "iru" : "s1");
    setActiveFilter(null);
    setStatus(null);
  }, [initialSource]);

  function switchSource(src) {
    if (src === source) return;
    setSource(src);
    setActiveFilter(null);
    setStatus(null);
  }

  function autodetect(headers, src) {
    const h = MO_SOURCE_HINTS[src];
    return {
      severityCol: moDetectColumn(headers, h.severity),
      assetCol: moDetectColumn(headers, h.asset),
      nameCol: moDetectColumn(headers, h.name),
    };
  }

  async function ingest(file) {
    if (!file) return;
    const src = source;
    setStatus({ type: "loading", message: `Reading ${file.name}…` });
    try {
      const parsed = await moParseSpreadsheet(file);
      if (parsed.records.length === 0) {
        setStatus({ type: "error", message: "No data rows found in that file." });
        return;
      }
      patchSource(src, { data: parsed, fileName: file.name, ...autodetect(parsed.headers, src) });
      setActiveFilter(null);
      setStatus({ type: "success", message: `Loaded ${parsed.records.length} rows into ${MO_SOURCE_HINTS[src].label}.` });
    } catch (err) {
      setStatus({ type: "error", message: err.message || "Couldn't read that file." });
    }
  }

  function reset() {
    patchSource(source, { data: null, fileName: "", severityCol: "", assetCol: "", nameCol: "" });
    setStatus(null);
    setActiveFilter(null);
  }

  const analysis = useMemo(() => {
    if (!data) return null;
    const counts = {}; MO_SEVERITY_ORDER.forEach((s) => (counts[s] = 0));
    const rows = data.records.map((r) => ({
      severity: moNormalizeSeverity(severityCol ? r[severityCol] : ""),
      asset: assetCol ? r[assetCol] : "",
      name: nameCol ? r[nameCol] : "",
      raw: r,
    }));
    rows.forEach((r) => { counts[r.severity] = (counts[r.severity] || 0) + 1; });
    const uniqueAssets = new Set(rows.map((r) => (r.asset || "").trim()).filter(Boolean)).size;
    return { rows, counts, total: rows.length, uniqueAssets };
  }, [data, severityCol, assetCol, nameCol]);

  const visibleRows = useMemo(() => {
    if (!analysis) return [];
    const rows = activeFilter ? analysis.rows.filter((r) => r.severity === activeFilter) : analysis.rows;
    const rank = (s) => MO_SEVERITY_ORDER.indexOf(s);
    return [...rows].sort((a, b) => rank(a.severity) - rank(b.severity));
  }, [analysis, activeFilter]);

  // Snapshots (daily log) for the currently-active source, newest first.
  const sourceSnapshots = useMemo(
    () => (snapshots || []).filter((s) => s.source === source),
    [snapshots, source]
  );

  function exportSummary() {
    if (!analysis) return;
    const lines = [];
    lines.push(`Vulnerability Summary — ${MO_SOURCE_HINTS[source].label}`);
    lines.push(`Source file: ${fileName}`);
    lines.push(`Total findings: ${analysis.total}`);
    lines.push(`Affected assets: ${analysis.uniqueAssets}`);
    lines.push("");
    lines.push("Severity,Count");
    MO_SEVERITY_ORDER.forEach((s) => { if (analysis.counts[s]) lines.push(`${s},${analysis.counts[s]}`); });
    lines.push("");
    lines.push(["Severity", "Asset", "Vulnerability"].map(moCsvCell).join(","));
    visibleRows.forEach((r) => lines.push([r.severity, r.asset, r.name].map(moCsvCell).join(",")));
    moDownload(`vuln-summary-${source}.csv`, lines.join("\n"), "text/csv;charset=utf-8");
  }

  // Save the current breakdown as a dated snapshot for the daily log.
  function saveSnapshot() {
    if (!analysis) return;
    const now = new Date();
    const snap = {
      id: "snap" + now.getTime() + "-" + Math.round(Math.random() * 100000),
      ts: now.toISOString(),
      source,
      fileName,
      total: analysis.total,
      uniqueAssets: analysis.uniqueAssets,
      counts: { ...analysis.counts },
    };
    setSnapshots((prev) => [snap, ...(prev || [])]);
    setSavedNote(true);
    setTimeout(() => setSavedNote(false), 1600);
  }

  function deleteSnapshot(id) {
    setSnapshots((prev) => (prev || []).filter((s) => s.id !== id));
  }

          <div style={{ fontSize: "14px", fontWeight: 600, color: theme.text }}>Drop a spreadsheet here, or click to browse</div>
          <div style={{ fontSize: "12px", color: theme.textFaint, marginTop: "6px" }}>.csv, .xlsx, or .xls</div>
          <input

                    <td style={{ padding: "8px 12px", whiteSpace: "nowrap" }}>

      {/* Daily log — dated snapshots for this source, persisted across sessions */}
      <div style={{ marginTop: "24px", borderTop: `1px solid ${theme.divider}`, paddingTop: "18px" }}>

/* ---- PKI Report Info Generator ---- */
function PkiReportModal({ theme, values, setValues, onClose }) {
  const [copied, setCopied] = useState(false);

  function update(id, val) { setValues((prev) => ({ ...prev, [id]: val })); }

  const report = useMemo(() => {
    const lines = [];
    const title = (values.title || "").trim() || "PKI Certificate Report";
    lines.push(title);
    lines.push("=".repeat(title.length));
    lines.push("");
    PKI_REPORT_FIELDS.forEach((f) => {
      if (f.id === "title") return;
      const v = (values[f.id] || "").trim();
      if (!v) return;
      if (f.multiline) {
        lines.push(`${f.label}:`);
        v.split("\n").forEach((l) => lines.push(`  ${l}`));
        lines.push("");
      } else {
        lines.push(`${f.label}: ${v}`);
      }
    });
    return lines.join("\n");
  }, [values]);

  function copyReport() {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(report).then(done).catch(done);
    } else {
      done();
    }
  }

  function clearAll() {
    const blank = {};
    PKI_REPORT_FIELDS.forEach((f) => (blank[f.id] = ""));
    setValues(blank);
  }

  return (
    <MoModal
      theme={theme}
      icon={<IconCertificate size={20} />}
      title="PKI Report Info Generator"
      subtitle="Fill in the certificate details and generate a formatted report you can copy or download. (Fields are placeholders — easy to adjust later.)"
      onClose={onClose}
      footer={
        <div style={{ display: "flex", gap: "10px", flexWrap: "wrap" }}>
          <MoButton theme={theme} variant="primary" onClick={copyReport}>{copied ? "Copied!" : "Copy report"}</MoButton>
          <MoButton theme={theme} onClick={() => moDownload(`pki-report-${new Date().toISOString().slice(0, 10)}.txt`, report)}><IconUpload size={13} /> Download .txt</MoButton>
          <MoButton theme={theme} onClick={clearAll} style={{ marginLeft: "auto", color: theme.danger, background: theme.dangerSoft, borderColor: "transparent" }}>Clear all</MoButton>
        </div>
      }
    >
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: "14px" }}>
        {PKI_REPORT_FIELDS.map((f) => (
          <div key={f.id} style={{ gridColumn: f.multiline ? "1 / -1" : "auto" }}>
            <label style={{ display: "block", fontSize: "11px", fontWeight: 700, letterSpacing: "0.04em", textTransform: "uppercase", color: theme.textMuted, marginBottom: "5px" }}>{f.label}</label>
            {f.multiline ? (
              <textarea
                value={values[f.id] || ""}
                onChange={(e) => update(f.id, e.target.value)}
                placeholder={f.placeholder}
                rows={3}
                className="v-input v-scroll"
                style={{ width: "100%", resize: "vertical", padding: "9px 11px", borderRadius: "9px", fontSize: "13px", background: theme.inputBg, color: theme.inputText, border: `1px solid ${theme.inputBorder}`, "--focus-ring": theme.accentSoft, "--focus-border": theme.accent, "--scroll-thumb": theme.divider }}
              />
            ) : (
              <input
                value={values[f.id] || ""}
                onChange={(e) => update(f.id, e.target.value)}
                placeholder={f.placeholder}
                className="v-input"
                style={{ width: "100%", padding: "9px 11px", borderRadius: "9px", fontSize: "13px", background: theme.inputBg, color: theme.inputText, border: `1px solid ${theme.inputBorder}`, "--focus-ring": theme.accentSoft, "--focus-border": theme.accent }}
              />
            )}
          </div>
        ))}
      </div>

      <div style={{ marginTop: "22px" }}>
        <div style={{ fontSize: "11px", fontWeight: 700, letterSpacing: "0.04em", textTransform: "uppercase", color: theme.sectionLabelColor, marginBottom: "8px" }}>Preview</div>
        <pre
          className="v-scroll"
          style={{
            margin: 0, whiteSpace: "pre-wrap", wordBreak: "break-word", fontSize: "12.5px", lineHeight: 1.55,
            fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace", color: theme.text,
            background: theme.inputBg, border: `1px solid ${theme.inputBorder}`, borderRadius: "12px",
            padding: "16px", maxHeight: "260px", overflow: "auto", "--scroll-thumb": theme.divider,
          }}
        >
          {report}
        </pre>
      </div>
    </MoModal>
  );
}

function PolicyTrackerModal({ theme, policies, setPolicies, onClose }) {
  const [filter, setFilter] = useState("all");
  const [newName, setNewName] = useState("");
  const [msg, setMsg] = useState(null);

  function note(m) { setMsg(m); setTimeout(() => setMsg(null), 2200); }
  function patch(id, changes) {
    setPolicies((prev) => prev.map((p) => (p.id === id ? { ...p, ...changes, updatedAt: Date.now() } : p)));
  }

  function addPolicy() {
    const name = newName.trim();
    if (!name) return;
    setPolicies((prev) => [
      ...prev,
      { id: "pol-custom-" + Date.now(), name, category: "Custom", status: "todo", owner: "", notes: "", hasFile: false, fileName: "", fileType: "", fileSize: 0, updatedAt: Date.now() },
    ]);
    setNewName("");
  }

  async function deletePolicy(id) {
    setPolicies((prev) => prev.filter((p) => p.id !== id));
    try { await dbDeletePolicyDoc(id); } catch (e) { /* nothing stored */ }
  }

  async function uploadDoc(id, file) {
    if (!file) return;
    try {
      await dbPutPolicyDoc({ id, blob: file, name: file.name, type: file.type, size: file.size });
      patch(id, { hasFile: true, fileName: file.name, fileType: file.type, fileSize: file.size });
      note({ type: "success", message: `Stored “${file.name}”.` });
    } catch (e) {
      note({ type: "error", message: e.message || "Couldn't store that file." });
    }
  }

  async function downloadDoc(p) {
    try {
      const rec = await dbGetPolicyDoc(p.id);
      if (!rec || !rec.blob) { note({ type: "error", message: "File isn't in local storage anymore." }); return; }
      const url = URL.createObjectURL(rec.blob);
      const a = document.createElement("a");
      a.href = url; a.download = p.fileName || rec.name || "policy";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) {
      note({ type: "error", message: "Couldn't open the file." });
    }
  }

  async function removeDoc(id) {
    try { await dbDeletePolicyDoc(id); } catch (e) { /* ignore */ }
    patch(id, { hasFile: false, fileName: "", fileType: "", fileSize: 0 });
  }

  function addStarterSet() {
    setPolicies((prev) => {
      const have = new Set(prev.map((p) => p.name.toLowerCase()));
      const missing = moDefaultPolicies().filter((d) => !have.has(d.name.toLowerCase()));
      if (missing.length === 0) { note({ type: "success", message: "Starter list already present." }); return prev; }
      note({ type: "success", message: `Added ${missing.length} starter ${missing.length === 1 ? "policy" : "policies"}.` });
      return [...prev, ...missing];
    });
  }

  function exportCSV() {
    const header = ["Policy / Procedure", "Category", "Status", "Document", "Last updated"];
    const lines = [header.map(moCsvCell).join(",")];
    policies.forEach((p) => lines.push([
      p.name, p.category, POLICY_STATUS_LABEL[p.status] || p.status, p.hasFile ? p.fileName : "", p.updatedAt ? moFormatTs(p.updatedAt) : "",
    ].map(moCsvCell).join(",")));
    moDownload("policy-tracker.csv", lines.join("\n"), "text/csv;charset=utf-8");
  }

  const counts = useMemo(() => {
    const c = { total: policies.length };
    POLICY_STATUSES.forEach((s) => (c[s.id] = 0));
    policies.forEach((p) => { c[p.status] = (c[p.status] || 0) + 1; });
    return c;
  }, [policies]);
  const pct = counts.total ? Math.round(((counts.done || 0) / counts.total) * 100) : 0;

  const visible = useMemo(
    () => (filter === "all" ? policies : policies.filter((p) => p.status === filter)),
    [policies, filter]
  );
  const grouped = useMemo(() => {
    const order = ["Governance", "Access & Identity", "Data Protection", "Operations", "Resilience", "Infrastructure", "Custom"];
    const map = {};
    visible.forEach((p) => { (map[p.category] = map[p.category] || []).push(p); });
    return Object.keys(map)
      .sort((a, b) => {
        const ia = order.indexOf(a), ib = order.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
      })
      .map((c) => ({ category: c, items: map[c] }));
  }, [visible]);

  return (
    <MoModal
      theme={theme}
      icon={<IconClipboard size={20} />}
      title="Policy & Procedure Writeup"
      subtitle="Track which security policies and procedures are written, in progress, or still to do — and upload the finished documents to keep them in one place."
      onClose={onClose}
    >
      {/* Progress summary */}
      <div style={{ marginBottom: "16px" }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: "10px", marginBottom: "8px", flexWrap: "wrap" }}>
          <span className="v-tabular" style={{ fontSize: "24px", fontWeight: 800, color: theme.text }}>{counts.done || 0}<span style={{ fontSize: "15px", color: theme.textMuted }}> / {counts.total} complete</span></span>
          <span style={{ fontSize: "13px", fontWeight: 700, color: theme.accent, marginLeft: "auto" }}>{pct}%</span>
        </div>
        <div style={{ height: "8px", borderRadius: "999px", background: theme.progressTrack, overflow: "hidden" }}>
          <div style={{ width: `${pct}%`, height: "100%", background: theme.progressFill, transition: "width 0.3s ease" }} />
        </div>
      </div>

      {/* Status filter chips */}
      <div style={{ display: "flex", gap: "7px", flexWrap: "wrap", marginBottom: "14px" }}>
        {[{ id: "all", label: `All (${counts.total})` }].concat(POLICY_STATUSES.map((s) => ({ id: s.id, label: `${s.label} (${counts[s.id] || 0})`, color: s.color }))).map((f) => {
          const active = filter === f.id;
          return (
            <button
              key={f.id}
              onClick={() => setFilter(f.id)}
              className="v-btn"
              style={{
                display: "inline-flex", alignItems: "center", gap: "6px", padding: "6px 12px", borderRadius: "999px",
                fontSize: "12px", fontWeight: 700,
                border: `1px solid ${active ? theme.accent : theme.cardBorder}`,
                background: active ? theme.accent : "transparent",
                color: active ? theme.accentText : theme.textMuted,
              }}
            >
              {f.color && <span style={{ width: "8px", height: "8px", borderRadius: "50%", background: f.color }} />}
              {f.label}
            </button>
          );
        })}
      </div>

      {/* Add + export toolbar */}

          {msg.message}
        </div>

      {/* Grouped list */}
      {policies.length === 0 ? (
        <div style={{ textAlign: "center", padding: "28px 16px", color: theme.textFaint, fontSize: "13px" }}>

                    <label className="v-btn" style={{ display: "inline-flex", alignItems: "center", gap: "6px", cursor: "pointer", fontSize: "12px", fontWeight: 700, color: theme.text, background: theme.accentSoft, border: `1px solid ${theme.cardBorder}`, borderRadius: "8px", padding: "6px 10px" }}>
                      <IconUpload size={13} /> Upload
                      <input type="file" accept=".pdf,.doc,.docx,.txt,.md,.rtf,.odt,.pages" style={{ display: "none" }} onChange={(e) => { uploadDoc(p.id, e.target.files[0]); e.target.value = ""; }} />

        ))
