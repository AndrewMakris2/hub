function App() {
  const [themeKey, setThemeKey] = usePersistentState(STORAGE_KEYS.theme, "minimal");
  const theme = THEMES[themeKey] || THEMES.minimal;
  const [page, navigate] = useHashRoute("home", PAGE_META.map((p) => p.id));
  useEffect(() => {
    window.scrollTo(0, 0);
  }, [page]);

  const [fitness, setFitness] = usePersistentState(STORAGE_KEYS.fitness, DEFAULT_FITNESS);
  const [golf, setGolf] = usePersistentState(STORAGE_KEYS.golf, DEFAULT_GOLF);
  const [golfSimRounds, setGolfSimRounds] = usePersistentState(STORAGE_KEYS.golfSimRounds, DEFAULT_GOLF_ROUNDS);
  const [golfOutdoorRounds, setGolfOutdoorRounds] = usePersistentState(STORAGE_KEYS.golfOutdoorRounds, DEFAULT_GOLF_ROUNDS);
  const [fantasyCheatSheets, setFantasyCheatSheets] = usePersistentState(STORAGE_KEYS.fantasyCheatSheets, DEFAULT_FANTASY_CHEAT_SHEETS);
  const [fantasyCustomRankings, setFantasyCustomRankings] = usePersistentState(STORAGE_KEYS.fantasyCustomRankings, DEFAULT_FANTASY_CUSTOM_RANKINGS);
  const [fantasyWatchlist, setFantasyWatchlist] = usePersistentState(STORAGE_KEYS.fantasyWatchlist, DEFAULT_FANTASY_WATCHLIST);
  const [fantasySleeper, setFantasySleeper] = usePersistentState(STORAGE_KEYS.fantasySleeper, DEFAULT_FANTASY_SLEEPER);
  const [fantasyYahoo, setFantasyYahoo] = usePersistentState(STORAGE_KEYS.fantasyYahoo, DEFAULT_FANTASY_YAHOO);
  const [trackers, setTrackers] = usePersistentState(STORAGE_KEYS.trackers, DEFAULT_TRACKERS);
  const [financial, setFinancial] = usePersistentState(STORAGE_KEYS.financial, DEFAULT_FINANCIAL);
  const [events, setEvents] = usePersistentState(STORAGE_KEYS.upcoming, DEFAULT_UPCOMING_EVENTS);
  const [history, setHistory] = usePersistentState(STORAGE_KEYS.history, DEFAULT_HISTORY);
  function recordWeight(value) {
    setHistory((h) => ({ ...h, fitness: pushHistoryPoint(h.fitness, value) }));
  }
  function recordHandicap(value) {
    setHistory((h) => ({ ...h, golf: pushHistoryPoint(h.golf, value) }));
  }
  function recordTracker(id, value) {
    setHistory((h) => ({ ...h, trackers: { ...h.trackers, [id]: pushHistoryPoint(h.trackers[id] || [], value) } }));
  }
  const [profile, setProfile] = usePersistentState(STORAGE_KEYS.profile, DEFAULT_PROFILE);
  const [integrations, setIntegrations] = usePersistentState(STORAGE_KEYS.integrations, DEFAULT_INTEGRATIONS);
  const [watchlist, setWatchlist] = usePersistentState(STORAGE_KEYS.watchlist, DEFAULT_WATCHLIST);
  const [journal, setJournal] = usePersistentState(STORAGE_KEYS.journal, DEFAULT_JOURNAL);
  const [goals, setGoals] = usePersistentState(STORAGE_KEYS.goals, DEFAULT_GOALS);
  const [transactions, setTransactions] = usePersistentState(STORAGE_KEYS.transactions, DEFAULT_TRANSACTIONS);
  const [youtube, setYoutube] = usePersistentState(STORAGE_KEYS.youtube, DEFAULT_YOUTUBE);
  const [youtubeVideos, setYoutubeVideos] = useState([]);
  const newYoutubeCount = useMemo(
    () => (youtube.lastSeenAt ? youtubeVideos.filter((v) => new Date(v.publishedAt).getTime() > youtube.lastSeenAt).length : 0),
    [youtubeVideos, youtube.lastSeenAt]
  );

  const [googleAccounts, setGoogleAccounts] = useState([]);
  function addGoogleAccount(account) {
    setGoogleAccounts((prev) => [...prev, account]);
  }
  function removeGoogleAccount(id) {
    setGoogleAccounts((prev) => prev.filter((a) => a.id !== id));
  }
  const [microsoftEvents, setMicrosoftEvents] = useState([]);
  const allConnectedEvents = useMemo(
    () => [...googleAccounts.flatMap((a) => a.events), ...microsoftEvents],
    [googleAccounts, microsoftEvents]
  );

  const [weather, setWeather] = usePersistentState(STORAGE_KEYS.weather, DEFAULT_WEATHER);
  const [weatherStatus, setWeatherStatus] = useState(null);

  async function loadWeather(lat, lon) {
    try {
      const days = await fetchWeatherDays(lat, lon);
      setWeather({ lat, lon, fetchedAt: Date.now(), days });
      setWeatherStatus(null);
    } catch (err) {
      setWeatherStatus({ type: "error", message: "Couldn't load weather right now." });
    }
  }

  function enableWeather() {
    if (!navigator.geolocation) {
      setWeatherStatus({ type: "error", message: "Location isn't available in this browser." });
      return;
    }
    setWeatherStatus({ type: "loading", message: "Getting your location…" });
    navigator.geolocation.getCurrentPosition(
      (pos) => loadWeather(pos.coords.latitude, pos.coords.longitude),
      () => setWeatherStatus({ type: "error", message: "Location permission denied." })
    );
  }

  useEffect(() => {
    const staleAfter = 3 * 60 * 60 * 1000;
    if (weather.lat != null && (!weather.fetchedAt || Date.now() - weather.fetchedAt > staleAfter)) {
      loadWeather(weather.lat, weather.lon);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const allEvents = useMemo(() => [...events, ...allConnectedEvents], [events, allConnectedEvents]);
  const weekAgendaCount = useMemo(() => {
    const isoSet = new Set();
    for (let i = 0; i < 7; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      isoSet.add(d.toISOString().slice(0, 10));
    }
    return allEvents.filter((e) => isoSet.has(e.date)).length;
  }, [allEvents]);
  const suggestions = useMemo(
    () => generateSuggestions({ fitness, golf, trackers, profile, events: allEvents, history, weather, watchlist, newYoutubeCount }),
    [fitness, golf, trackers, profile, allEvents, history, weather, watchlist, newYoutubeCount]
  );

  const [briefingOpen, setBriefingOpen] = useState(() => {
    try {
      const today = new Date().toISOString().slice(0, 10);
      return localStorage.getItem(STORAGE_KEYS.briefingLastShown) !== today;
    } catch (e) {
      return false;
    }
  });

  function dismissBriefing() {
    try {
      localStorage.setItem(STORAGE_KEYS.briefingLastShown, new Date().toISOString().slice(0, 10));
    } catch (e) {
      /* localStorage unavailable — just close in-memory */
    }
    setBriefingOpen(false);
  }

  const doneGoals = goals.filter((g) => g.status === "done").length;
  const pageStats = {
    fitness: { value: fitness.currentWeight, detail: `target ${fitness.targetWeight} lbs` },
    golf: { value: golf.handicap, detail: `${golf.roundsYtd} rounds YTD` },
    financial: {
      value: financial.targetDownPayment
        ? `${Math.min(100, Math.round(((financial.currentSavings || 0) / financial.targetDownPayment) * 100))}%`
        : "—",
      detail: "toward down payment",
    },
    transactions: { value: transactions.length || 0, detail: "logged" },
    upcoming: { value: allEvents.length || 0, detail: "events" },
    agenda: { value: weekAgendaCount || 0, detail: "this week" },
    youtube: { value: newYoutubeCount || youtubeVideos.length || 0, detail: newYoutubeCount ? "new" : "checked" },
    profile: { value: profile.interests.length || 0, detail: "interests" },
    watchlist: { value: watchlist.length || 0, detail: "queued" },
    trackers: { value: trackers.length || 0, detail: "trackers" },
    goals: { value: goals.length ? `${doneGoals}/${goals.length}` : 0, detail: "done" },
    videos: { value: null, detail: "library" },
    journal: { value: journal.length || 0, detail: "entries" },
    fantasy: { value: fantasyWatchlist.length || 0, detail: "watchlist" },
  };

  return (
    <div
      style={{
        minHeight: "100vh",
        background: theme.pageBgGradient !== "none" ? theme.pageBgGradient : theme.pageBg,
        color: theme.text,
        transition: "background 0.25s ease, color 0.25s ease",
      }}
    >
      <Sidebar
        theme={theme}
        themeKey={themeKey}
        fitness={fitness}
        golf={golf}
        trackers={trackers}
        profile={profile}
        integrations={integrations}
        googleAccounts={googleAccounts}
        onAddGoogleAccount={addGoogleAccount}
        onRemoveGoogleAccount={removeGoogleAccount}
        microsoftEvents={microsoftEvents}
        onMicrosoftEvents={setMicrosoftEvents}
        financial={financial}
        events={events}
        history={history}
        suggestionsCount={suggestions.length}
        upcomingCount={allEvents.length}
        weekAgendaCount={weekAgendaCount}
        watchlist={watchlist}
        journal={journal}
        goals={goals}
        transactions={transactions}
        newYoutubeCount={newYoutubeCount}
        youtube={youtube}
        golfSimRounds={golfSimRounds}
        golfOutdoorRounds={golfOutdoorRounds}
        fantasyWatchlist={fantasyWatchlist}
        page={page}
        onNavigate={navigate}
        setThemeKey={setThemeKey}
        setFitness={setFitness}
        setGolf={setGolf}
        setTrackers={setTrackers}
        setProfile={setProfile}
        setIntegrations={setIntegrations}
        setFinancial={setFinancial}
        setEvents={setEvents}
        setHistory={setHistory}
        setWatchlist={setWatchlist}
        setJournal={setJournal}
        setGoals={setGoals}
        setTransactions={setTransactions}
        setYoutube={setYoutube}
        setGolfSimRounds={setGolfSimRounds}
        setGolfOutdoorRounds={setGolfOutdoorRounds}
      />

      <div className="v-main">
        <div
          style={{
            maxWidth: page === "home" ? "1200px" : page === "fantasy" ? "1320px" : "760px",
            margin: "0 auto",
            padding: "32px 20px 64px",
          }}
        >
          {page === "home" && (
            <HomeOverview
              theme={theme}
              suggestions={suggestions}
              weather={weather}
              weatherStatus={weatherStatus}
              onEnableWeather={enableWeather}
              onOpenBriefing={() => setBriefingOpen(true)}
              pageStats={pageStats}
              onNavigate={navigate}
            />
          )}
          {page === "fitness" && (
            <FitnessSection theme={theme} data={fitness} setData={setFitness} history={history.fitness} onRecordWeight={recordWeight} />
          )}
          {page === "golf" && (
            <div style={{ display: "flex", flexDirection: "column", gap: "20px" }}>
              <GolfSection theme={theme} data={golf} setData={setGolf} history={history.golf} onRecordHandicap={recordHandicap} />
              <GolfRoundLog theme={theme} title="Simulator Rounds" rounds={golfSimRounds} setRounds={setGolfSimRounds} delay={0} />
              <GolfRoundLog theme={theme} title="Outdoor Rounds" rounds={golfOutdoorRounds} setRounds={setGolfOutdoorRounds} delay={0} />
            </div>
          )}
          {page === "fantasy" && (
            <FFPage
              theme={theme}
              cheatSheets={fantasyCheatSheets}
              setCheatSheets={setFantasyCheatSheets}
              customRankings={fantasyCustomRankings}
              setCustomRankings={setFantasyCustomRankings}
              watchlist={fantasyWatchlist}
              setWatchlist={setFantasyWatchlist}
              sleeper={fantasySleeper}
              setSleeper={setFantasySleeper}
              yahoo={fantasyYahoo}
              setYahoo={setFantasyYahoo}
            />
          )}
          {page === "financial" && <FinancialSection theme={theme} data={financial} setData={setFinancial} />}
          {page === "transactions" && (
            <TransactionsSection theme={theme} transactions={transactions} setTransactions={setTransactions} categoryOptions={[]} delay={0} />
          )}
          {page === "upcoming" && (
            <UpcomingSection theme={theme} events={events} setEvents={setEvents} connectedEvents={allConnectedEvents} />
          )}
          {page === "agenda" && <AgendaStripSection theme={theme} events={allEvents} delay={0} />}
          {page === "youtube" && (
            <YouTubeSection
              theme={theme}
              integrations={integrations}
              setIntegrations={setIntegrations}
              videos={youtubeVideos}
              onVideos={setYoutubeVideos}
              youtubeState={youtube}
              setYoutubeState={setYoutube}
              delay={0}
            />
          )}
          {page === "profile" && <ProfileSection theme={theme} profile={profile} setProfile={setProfile} />}
          {page === "watchlist" && (
            <WatchQueueSection theme={theme} watchlist={watchlist} setWatchlist={setWatchlist} genres={profile.genres} delay={0} />
          )}
          {page === "trackers" && (
            <CustomTrackersSection
              theme={theme}
              trackers={trackers}
              setTrackers={setTrackers}
              trackerHistory={history.trackers}
              onRecordTracker={recordTracker}
            />
          )}
          {page === "goals" && <GoalsBoardSection theme={theme} data={goals} setData={setGoals} delay={0} />}
          {page === "videos" && <VideoLibrarySection theme={theme} integrations={integrations} setIntegrations={setIntegrations} />}
          {page === "journal" && <JournalSection theme={theme} data={journal} setData={setJournal} delay={0} />}
        </div>
      </div>

      {briefingOpen && suggestions.length > 0 && (
        <BriefingModal theme={theme} suggestions={suggestions} weather={weather} onClose={dismissBriefing} />
      )}
    </div>
  );
}

/* ----------------------------------------------------------------------
   FANTASY TAB — ported from "The War Room" (a separate fantasy-football
   dashboard app: react-router + react-query + Netlify Functions/Blobs).
   Its own design system (FF_CSS below) is pasted in near-verbatim and
   rendered inside a real Shadow DOM subtree (FFShadowRoot) so its ~300
   classes never have to be reconciled with Vantage's theme system — style
   isolation works in both directions for free. Only two seams change from
   the original file: ":root" -> ":host" (a shadow tree has no document
   root), and --accent reads from --ff-accent, which FFShadowRoot sets from
   Vantage's active theme.accent — the one deliberate "both of the above"
   hook between the two design systems the user asked for. The outer page
   header/sub-nav around it is plain Vantage theme-driven JSX, same as every
   other page.
---------------------------------------------------------------------- */

const FF_CSS = `
:host {
  /* Surfaces */
  --bg: #0a0d12;
  --surface: #131820;
  --surface-2: #1a2029;
  --surface-3: #222a36;
  --border: #262e3a;
  --border-strong: #37414f;

  /* Text */
  --text: #eef1f5;
  --text-secondary: #b9c1cd;
  --muted: #7c8798;

  /* Brand / accent */
  --accent: var(--ff-accent, #2f7dff);
  --accent-strong: #1f63e6;
  --accent-soft: rgba(47, 125, 255, 0.16);
  --teal: #17d9c4;
  --accent-gradient: linear-gradient(135deg, var(--accent), var(--teal));

  /* Functional */
  --success: #22c55e;
  --success-soft: rgba(34, 197, 94, 0.14);
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.14);
  --warning: #f59e0b;
  --warning-soft: rgba(245, 158, 11, 0.14);

  /* Tiers */
  --gold: #ffd166;
  --silver: #cbd5e1;
  --bronze: #d99a5b;

  /* Positions */
  --pos-qb: #ef5158;
  --pos-rb: #2fbf71;
  --pos-wr: #3b82f6;
  --pos-te: #f0973b;
  --pos-k: #a78bfa;
  --pos-def: #6b7684;
  --pos-pick: #d4a017;

  /* Platforms */
  --sleeper: #4c6ef5;
  --yahoo: #6b21d8;

  /* Shape */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-pill: 999px;

  /* Shadow */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5), 0 1px 1px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.4);
  --shadow-glow: 0 0 0 1px var(--accent-soft), 0 8px 22px rgba(47, 125, 255, 0.28);

  /* Base — ported from index.css's body{} rule; there's no <body> inside a
     shadow tree, so these live on :host and inherit down instead. */
  display: block;
  background: var(--bg);
  color: var(--text);
  font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Reset ---------- */

* {
  box-sizing: border-box;
}

a {
  color: var(--accent);
}

h1,
h2,
h3 {
  margin: 0 0 0.5rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
}

h1 {
  font-size: 1.9rem;
}

h2 {
  font-size: 1.25rem;
  margin-top: 0;
}

h3 {
  font-size: 1rem;
}

p {
  margin: 0 0 0.75rem;
  color: var(--text-secondary);
}

::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--radius-pill);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--accent);
}

/* ---------- Buttons, inputs, selects ---------- */

button,
.button-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  background: var(--accent-gradient);
  color: #051220;
  border: none;
  border-radius: var(--radius-md);
  padding: 0.55rem 1.1rem;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  box-shadow: var(--shadow-sm);
  transition: filter 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
}

button:hover,
.button-link:hover {
  filter: brightness(1.08);
  box-shadow: var(--shadow-glow);
}

button:active,
.button-link:active {
  transform: translateY(1px);
}

button:disabled {
  background: var(--surface-3);
  color: var(--muted);
  cursor: not-allowed;
  box-shadow: none;
  filter: none;
}

input[type="text"],
input[type="number"],
select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 0.55rem 0.75rem;
  font-size: 0.9rem;
  font-family: inherit;
}

input[type="text"]:focus,
input[type="number"]:focus,
select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) center, calc(100% - 13px) center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 2rem;
  cursor: pointer;
}

input[type="checkbox"] {
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
}

/* ---------- Layout ---------- */

.page {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0.5rem 0 3.5rem;
  width: 100%;
  flex: 1;
}

.page--wide {
  max-width: 1360px;
}

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  gap: 1rem;
  flex-wrap: wrap;
}

.page-header h1 {
  font-size: 1.5rem;
}

section {
  margin-bottom: 2rem;
}

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-bottom: 1rem;
  align-items: center;
}

.filter-bar input[type="text"] {
  flex: 1 1 220px;
}

.filter-bar--secondary {
  margin-top: -0.25rem;
}

.filter-toggle {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  padding: 0.5rem 0.8rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}

.filter-toggle:has(input:checked) {
  color: var(--text);
  border-color: var(--accent);
  background: var(--accent-soft);
}

.empty-state {
  color: var(--muted);
}

.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin-top: 1.5rem;
}

.pagination__status {
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 600;
}

.pagination button {
  background: var(--surface-2);
  color: var(--text);
  box-shadow: none;
}

.pagination button:hover:not(:disabled) {
  filter: none;
  background: var(--surface-3);
  box-shadow: none;
}

.pagination button:disabled {
  opacity: 0.5;
}

.error-text {
  color: var(--danger);
}

.success-text {
  color: var(--success);
}

.data-source-note {
  color: var(--muted);
  font-size: 0.78rem;
  margin: -0.4rem 0 1rem;
}

.warning-banner {
  background: var(--warning-soft);
  border: 1px solid color-mix(in srgb, var(--warning) 45%, transparent);
  border-radius: var(--radius-md);
  padding: 0.75rem 1rem;
  margin-bottom: 1rem;
  color: #ffd08a;
}

.back-link {
  background: none;
  border: none;
  box-shadow: none;
  padding: 0;
  color: var(--muted);
  text-decoration: none;
  display: inline-block;
  margin-bottom: 1rem;
  font-weight: 600;
  font-size: 0.9rem;
}

.back-link:hover {
  color: var(--text);
  filter: none;
  transform: none;
  box-shadow: none;
}

/* ---------- Dashboard widget grid ---------- */

.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 1.25rem;
  align-items: start;
}

.dashboard-widget {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  box-shadow: var(--shadow-sm);
}

.dashboard-widget--wide {
  grid-column: 1 / -1;
}

.dashboard-widget__header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}

.dashboard-widget__header h2 {
  margin: 0;
}

.dashboard-widget__stack {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

/* ---------- Tables ---------- */

.data-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  font-variant-numeric: tabular-nums;
}

.data-table th,
.data-table td {
  text-align: left;
  padding: 0.6rem 0.85rem;
  border-bottom: 1px solid var(--border);
}

.data-table th {
  color: var(--muted);
  font-weight: 800;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: var(--surface-2);
}

.data-table tbody tr {
  transition: background-color 0.1s ease;
}

.data-table tbody tr:nth-child(even) {
  background: rgba(255, 255, 255, 0.015);
}

.data-table tbody tr:hover {
  background: var(--surface-3);
}

.data-table tbody tr:last-child td {
  border-bottom: none;
}

.data-table-scroll {
  overflow-x: auto;
  border-radius: var(--radius-lg);
}

.game-log-points {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.game-log-points__track {
  width: 60px;
  height: 6px;
  border-radius: var(--radius-pill);
  background: var(--surface-3);
  overflow: hidden;
  flex-shrink: 0;
}

.game-log-points__bar {
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--accent-gradient);
}

.data-table-scroll--frozen-first .data-table th:first-child,
.data-table-scroll--frozen-first .data-table td:first-child {
  position: sticky;
  left: 0;
  z-index: 1;
  background: rgba(26, 32, 41, 0.75);
}

.data-table-scroll--frozen-first .data-table tbody td:first-child {
  background: rgba(19, 24, 32, 0.75);
}

.data-table-scroll--frozen-first .data-table tbody tr:nth-child(even) td:first-child {
  background: rgba(23, 29, 38, 0.75);
}

.table-player-cell {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.table-player-link {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--text);
  text-decoration: none;
  font-weight: 700;
}

.table-player-link:hover {
  color: var(--accent);
}

.players-table__number {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 500;
}

.trending-count {
  color: var(--accent);
  font-weight: 800;
}

.injury-badge {
  color: var(--warning);
  font-size: 0.82rem;
  font-weight: 700;
}

.checklist {
  list-style: none;
  padding: 0;
  margin: 1rem 0;
}

.checklist li {
  padding: 0.35rem 0;
}

.checklist label {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--text-secondary);
  font-weight: 600;
}

/* ---------- Badges ---------- */

.position-badge {
  display: inline-block;
  padding: 0.18rem 0.55rem;
  border-radius: var(--radius-sm);
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: #071019;
}

.position-badge--QB {
  background: var(--pos-qb);
  color: white;
}

.position-badge--RB {
  background: var(--pos-rb);
}

.position-badge--WR {
  background: var(--pos-wr);
  color: white;
}

.position-badge--TE {
  background: var(--pos-te);
}

.position-badge--K {
  background: var(--pos-k);
  color: white;
}

.position-badge--DEF {
  background: var(--pos-def);
  color: white;
}

.position-badge--PICK {
  background: var(--pos-pick);
}

.position-badge--UNK {
  background: var(--border-strong);
  color: var(--muted);
}

.platform-badge {
  display: inline-block;
  padding: 0.2rem 0.6rem;
  border-radius: var(--radius-sm);
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: white;
  vertical-align: middle;
}

.platform-badge--sleeper {
  background: var(--sleeper);
}

.platform-badge--yahoo {
  background: var(--yahoo);
}

.team-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-weight: 700;
  color: var(--text-secondary);
}

.team-tag__dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  flex-shrink: 0;
}

.rank-medal {
  font-weight: 800;
}

span.rank-medal--gold {
  color: var(--gold);
}

span.rank-medal--silver {
  color: var(--silver);
}

span.rank-medal--bronze {
  color: var(--bronze);
}

/* ---------- Avatars ---------- */

.player-avatar {
  border-radius: 999px;
  object-fit: cover;
  background: var(--surface-3);
  border: 1px solid var(--border);
  flex-shrink: 0;
}

.player-avatar--sm {
  width: 30px;
  height: 30px;
}

.player-avatar--md {
  width: 52px;
  height: 52px;
}

.player-avatar--lg {
  width: 120px;
  height: 120px;
  border-width: 3px;
  border-color: var(--accent);
  box-shadow: var(--shadow-glow);
}

.player-avatar--logo {
  object-fit: contain;
  background: var(--surface);
  padding: 4px;
}

.player-avatar--fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-weight: 800;
  font-size: 0.8rem;
}

.player-avatar--lg.player-avatar--fallback {
  font-size: 2.2rem;
}

/* ---------- Watchlist ---------- */

.watchlist-button {
  background: none;
  border: none;
  box-shadow: none;
  padding: 0.1rem 0.2rem;
  color: var(--muted);
  font-size: 1.1rem;
  line-height: 1;
  flex-shrink: 0;
}

.watchlist-button:hover {
  color: var(--gold);
  filter: none;
  transform: none;
}

.watchlist-button--active {
  color: var(--gold);
}

h1 .watchlist-button {
  font-size: 1.25rem;
  vertical-align: middle;
  margin-left: 0.4rem;
}

/* ---------- Top players list (Dashboard) ---------- */

.top-players-list {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.top-player-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.5rem 0.75rem;
  text-decoration: none;
  color: var(--text);
  transition: border-color 0.12s ease, background-color 0.12s ease;
}

.top-player-row:hover {
  border-color: var(--accent);
  background: var(--surface-3);
}

.top-player-row__rank {
  color: var(--accent);
  font-weight: 800;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  width: 2rem;
  flex-shrink: 0;
}

.top-player-row__name {
  font-weight: 700;
  font-size: 0.9rem;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.top-player-row__value {
  color: var(--text-secondary);
  font-weight: 700;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  margin-left: auto;
}

/* ---------- League cards / matchup ---------- */

.league-grid {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.league-card {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.75rem 0.9rem;
  text-decoration: none;
  color: var(--text);
  transition: border-color 0.12s ease, background-color 0.12s ease;
}

.league-card:hover {
  border-color: var(--accent);
  background: var(--surface-3);
}

.league-card__body {
  flex: 1;
  min-width: 0;
}

.league-card__body h3 {
  margin: 0;
  font-size: 0.95rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.league-card__team {
  color: var(--text-secondary);
  margin: 0.1rem 0 0;
  font-size: 0.82rem;
}

.league-card__record {
  color: var(--muted);
  font-size: 0.85rem;
  font-weight: 700;
  margin: 0;
  text-align: right;
  white-space: nowrap;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.1rem;
}

.league-card__season {
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 500;
}

.matchup-card {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
}

.matchup-card__team {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.35rem;
  flex: 1;
  padding: 0.75rem;
  border-radius: var(--radius-md);
}

.matchup-card__team--leading {
  background: var(--success-soft);
}

.matchup-card__name {
  font-weight: 700;
}

.matchup-card__score {
  font-size: 1.75rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
}

.matchup-card__team--leading .matchup-card__score {
  color: var(--success);
}

.matchup-card__vs {
  color: var(--muted);
  font-weight: 800;
  font-size: 0.85rem;
}

.league-settings__positions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.3rem;
}

.transactions-feed {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.transactions-feed__row {
  display: flex;
  align-items: center;
  gap: 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.75rem 1rem;
}

.transactions-feed__type {
  flex-shrink: 0;
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--accent);
  min-width: 6.5rem;
}

.transactions-feed__body {
  flex: 1;
  color: var(--text-secondary);
  font-size: 0.88rem;
}

.transactions-feed__body p {
  margin: 0.15rem 0;
}

.transactions-feed__date {
  flex-shrink: 0;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 600;
}

/* ---------- Player profile ---------- */

.player-profile__banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.75rem;
}

.player-profile__identity {
  display: flex;
  align-items: center;
  gap: 1.1rem;
}

.player-profile__identity h1 {
  font-size: 1.55rem;
  margin-bottom: 0.35rem;
}

.player-profile__number {
  color: var(--muted);
  font-size: 0.9rem;
  margin-left: 0.5rem;
  font-weight: 500;
}

.player-profile__meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  color: var(--muted);
  font-weight: 600;
}

.player-profile__stats {
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
}

.player-profile__stats > div {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.player-profile__bio-label {
  color: var(--muted);
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 700;
}

.player-profile__stats span:last-child {
  font-size: 0.95rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.ranking-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1rem;
}

.ranking-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.1rem 1rem;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.ranking-card__label {
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 700;
}

.ranking-card__rank {
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.ranking-card__value {
  color: var(--text);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.ranking-card__unranked {
  color: var(--muted);
  font-weight: 600;
  padding: 0.5rem 0;
}

/* ---------- Trade analyzer ---------- */

.trade-grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
}

.trade-vs {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border-radius: 999px;
  background: var(--accent-gradient);
  color: #051220;
  font-weight: 800;
  font-size: 0.8rem;
  letter-spacing: 0.03em;
  box-shadow: var(--shadow-sm);
  justify-self: center;
}

@media (max-width: 700px) {
  .trade-grid {
    grid-template-columns: 1fr;
  }
  .trade-vs {
    margin: -0.25rem auto;
  }
}

.trade-side {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.15rem;
  box-shadow: var(--shadow-sm);
}

.trade-side h3 {
  margin: 0 0 0.75rem;
  font-size: 1.02rem;
}

.trade-side input[type="text"] {
  width: 100%;
  margin-right: 0;
  margin-bottom: 0.5rem;
  box-sizing: border-box;
}

.trade-side__matches {
  list-style: none;
  padding: 0;
  margin: 0 0 0.75rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.trade-side__matches button {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--text);
  border-radius: 0;
  padding: 0.55rem 0.85rem;
  font-weight: 500;
  box-shadow: none;
}

.trade-side__matches button:hover {
  background: var(--surface-2);
  filter: none;
  transform: none;
}

.trade-side__selected {
  list-style: none;
  padding: 0;
  margin: 0;
}

.trade-side__selected li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
}

.trade-side__value {
  color: var(--accent);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.trade-side__remove {
  background: none;
  border: none;
  box-shadow: none;
  padding: 0 0.3rem;
  color: var(--muted);
  font-size: 1.1rem;
  line-height: 1;
}

.trade-side__remove:hover {
  color: var(--danger);
  filter: none;
  transform: none;
}

.trade-side__total {
  margin: 0.75rem 0 0;
  font-weight: 700;
}

.trade-verdict {
  border-radius: var(--radius-lg);
  padding: 1rem;
  font-weight: 700;
  text-align: center;
  border: 1px solid var(--border);
}

.trade-verdict--neutral {
  background: var(--surface);
  color: var(--muted);
}

.trade-verdict--even {
  background: var(--success-soft);
  border-color: color-mix(in srgb, var(--success) 45%, transparent);
  color: #86efac;
}

.trade-verdict--lopsided {
  background: var(--warning-soft);
  border-color: color-mix(in srgb, var(--warning) 45%, transparent);
  color: #fcd34d;
}

.trade-review-trigger {
  display: flex;
  justify-content: center;
  margin-top: 1rem;
}

/* ---------- Comparison table ---------- */

.comparison-scroll {
  overflow-x: auto;
  margin-top: 1rem;
  border-radius: var(--radius-lg);
}

.comparison-table {
  min-width: 100%;
}

.comparison-table th,
.comparison-table td {
  white-space: nowrap;
}

.comparison-table__label {
  color: var(--muted);
  font-weight: 800;
  position: sticky;
  left: 0;
  background: var(--surface);
}

.comparison-table th:first-child {
  position: sticky;
  left: 0;
  background: var(--surface-2);
  z-index: 1;
}

.comparison-table__player {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.comparison-table__player a {
  color: var(--text);
  text-decoration: none;
  font-weight: 700;
}

.comparison-table__player a:hover {
  color: var(--accent);
}

.comparison-table__winner {
  color: var(--success);
  font-weight: 800;
}

/* ---------- Modal ---------- */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 10, 0.78);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 4vh 1.5rem;
  z-index: 100;
  overflow-y: auto;
}

.modal-panel {
  width: 100%;
  max-width: 640px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  max-height: 92vh;
  display: flex;
  flex-direction: column;
}

.modal-panel__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.15rem 1.4rem;
  border-bottom: 1px solid var(--border);
}

.modal-panel__header h2 {
  margin: 0;
  font-size: 1.1rem;
}

.modal-panel__close {
  background: none;
  border: none;
  box-shadow: none;
  padding: 0.2rem 0.5rem;
  color: var(--muted);
  font-size: 1.4rem;
  line-height: 1;
}

.modal-panel__close:hover {
  color: var(--text);
  filter: none;
  transform: none;
}

.modal-panel__body {
  padding: 1.4rem;
  overflow-y: auto;
}

.comparison-modal__stack {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.player-detail-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1rem;
}

.player-detail-card__label {
  display: inline-block;
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 800;
  margin-bottom: 0.5rem;
}

.player-detail-card__header {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 0.9rem;
}

.player-detail-card__name {
  color: var(--text);
  text-decoration: none;
  font-weight: 800;
  font-size: 1rem;
}

.player-detail-card__name:hover {
  color: var(--accent);
}

.player-detail-card__meta {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-top: 0.35rem;
  color: var(--muted);
  font-weight: 600;
  font-size: 0.85rem;
}

.player-detail-card__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
  gap: 0.8rem;
}

.player-detail-card__grid > div {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.player-detail-card__stat-label {
  color: var(--muted);
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 700;
}

.trade-review-modal__verdict {
  text-align: center;
  font-weight: 700;
  margin: 0 0 1.15rem;
}

.trade-review-modal__columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.15rem;
}

.trade-review-modal__columns h3 {
  margin: 0 0 0.75rem;
  font-size: 0.95rem;
}

@media (max-width: 600px) {
  .trade-review-modal__columns {
    grid-template-columns: 1fr;
  }
}

/* ---------- Onboarding ---------- */

.onboarding-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.4rem;
  box-shadow: var(--shadow-sm);
}

.onboarding-section--sleeper {
  border-left-color: var(--sleeper);
}

.onboarding-section--yahoo {
  border-left-color: var(--yahoo);
}

/* ---------- Import rankings ---------- */

.import-rankings__form,
.import-rankings__review,
.import-rankings__saved {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.4rem;
  box-shadow: var(--shadow-sm);
  margin-bottom: 1.4rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.import-rankings__form label {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 700;
}

.import-rankings__step {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.3rem;
  height: 1.3rem;
  border-radius: var(--radius-pill);
  background: var(--accent-gradient);
  color: #051220;
  font-size: 0.72rem;
  font-weight: 800;
  margin-right: 0.3rem;
}

.import-rankings__form input[type="text"],
.import-rankings__form textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.6rem 0.75rem;
  color: var(--text);
  font-size: 0.92rem;
  font-family: inherit;
}

.import-rankings__section {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.import-rankings__line {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  padding: 0.6rem 0.75rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}

.import-rankings__line-text {
  flex: 1 1 240px;
  color: var(--text);
}

.import-rankings__search {
  position: relative;
  flex: 1 1 220px;
}

.ranking-set-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 0.8rem;
}

.ranking-set-card {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  text-align: left;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.85rem 1rem;
  cursor: pointer;
  transition: border-color 0.12s ease, background-color 0.12s ease;
}

.ranking-set-card:hover {
  border-color: var(--accent);
  background: var(--surface-3);
}

.ranking-set-card--active {
  border-color: var(--accent);
  box-shadow: var(--shadow-glow);
}

.ranking-set-card__name {
  font-weight: 800;
  font-size: 0.92rem;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ranking-set-card__count {
  font-size: 0.78rem;
  color: var(--muted);
}

.ranking-set-card__bar {
  display: flex;
  height: 6px;
  border-radius: var(--radius-pill);
  overflow: hidden;
  background: var(--surface-3);
}

.ranking-set-card__bar-segment {
  height: 100%;
}

.ranking-set-card__bar-segment--QB {
  background: var(--pos-qb);
}

.ranking-set-card__bar-segment--RB {
  background: var(--pos-rb);
}

.ranking-set-card__bar-segment--WR {
  background: var(--pos-wr);
}

.ranking-set-card__bar-segment--TE {
  background: var(--pos-te);
}

.ranking-set-card__bar-segment--K {
  background: var(--pos-k);
}

.ranking-set-card__bar-segment--DEF {
  background: var(--pos-def);
}

.ranking-set-viewer {
  margin-top: 1.2rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--border);
}

.ranking-set-viewer__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.ranking-set-viewer__header h3 {
  margin: 0;
}

.ranking-set-viewer__actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.ranking-set-viewer__filters {
  display: flex;
  gap: 0.35rem;
}

.ranking-set-filter-chip {
  background: var(--surface-2);
  border: 1px solid var(--border);
  box-shadow: none;
  color: var(--text-secondary);
  padding: 0.3rem 0.7rem;
  font-size: 0.78rem;
  font-weight: 700;
  border-radius: var(--radius-pill);
}

.ranking-set-filter-chip:hover {
  filter: none;
  border-color: var(--accent);
  color: var(--text);
}

.ranking-set-filter-chip--active {
  background: var(--accent-gradient);
  border-color: transparent;
  color: #051220;
}

.ranking-set-viewer__delete {
  background: none;
  border: 1px solid var(--border);
  box-shadow: none;
  padding: 0.3rem 0.7rem;
  font-size: 0.78rem;
  color: var(--muted);
  border-radius: var(--radius-sm);
}

.ranking-set-viewer__delete:hover {
  color: var(--danger);
  border-color: var(--danger);
  filter: none;
  transform: none;
}

.ranking-set-list {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  max-height: 640px;
  overflow-y: auto;
}

.ranking-set-row {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.5rem 0.75rem;
  text-decoration: none;
  color: var(--text);
  transition: border-color 0.12s ease, background-color 0.12s ease;
}

.ranking-set-row:hover {
  border-color: var(--accent);
  background: var(--surface-3);
}

.ranking-set-row__rank {
  width: 2.5rem;
  flex-shrink: 0;
  font-weight: 800;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}

.ranking-set-row__name {
  flex: 1;
  min-width: 0;
  font-weight: 700;
  font-size: 0.9rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ranking-set-row__pos-rank {
  color: var(--muted);
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  margin-left: auto;
}

/* ---------- Mock draft ---------- */

.draft-settings {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  box-shadow: var(--shadow-sm);
}

.draft-settings__row {
  display: flex;
  gap: 1.25rem;
  flex-wrap: wrap;
  margin-bottom: 1.1rem;
}

.draft-settings__row label,
.draft-settings__slot {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  color: var(--text-secondary);
  font-size: 0.82rem;
  font-weight: 700;
}

.draft-settings__row input,
.draft-settings__row select,
.draft-settings__slot input {
  color: var(--text);
  font-size: 0.95rem;
}

.draft-settings__slots {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.draft-settings input[type="number"] {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.5rem 0.65rem;
  width: 100%;
}

.draft-clock {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 0.7rem 1.1rem;
  margin-bottom: 1rem;
  font-weight: 700;
  text-align: center;
}

.draft-clock strong {
  color: var(--accent);
}

.draft-clock--user {
  border-color: var(--accent);
  box-shadow: var(--shadow-glow);
}

.draft-layout {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) minmax(340px, 1.5fr);
  gap: 1.25rem;
  align-items: start;
}

@media (max-width: 900px) {
  .draft-layout {
    grid-template-columns: 1fr;
  }
}

.draft-pick-controls {
  margin-top: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.draft-roster-panel {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.draft-roster-panel__group {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.6rem 0.85rem;
}

.draft-roster-panel__slot-label {
  display: block;
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 800;
  margin-bottom: 0.4rem;
}

.draft-roster-panel__row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.3rem 0;
  font-weight: 600;
}

.draft-board-scroll {
  overflow-x: auto;
  margin-bottom: 1.1rem;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
}

.draft-board {
  border-collapse: collapse;
  width: 100%;
  background: var(--surface);
  font-size: 0.88rem;
}

.draft-board th,
.draft-board td {
  border: 1px solid var(--border);
  padding: 0.4rem 0.55rem;
  text-align: left;
  white-space: nowrap;
}

.draft-board th {
  background: var(--surface-2);
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  position: sticky;
  top: 0;
}

.draft-board__corner {
  position: sticky;
  left: 0;
  z-index: 2;
}

.draft-board__round {
  position: sticky;
  left: 0;
  background: var(--surface-2);
  color: var(--muted);
  font-weight: 800;
  z-index: 1;
}

.draft-board__cell {
  min-width: 112px;
  vertical-align: top;
}

.draft-board__cell--current {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 2px var(--accent);
}

.draft-board__player-name {
  display: block;
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 0.2rem;
}

.draft-board__on-clock {
  color: var(--accent);
  font-weight: 800;
  font-size: 0.78rem;
}

.draft-board__empty {
  color: var(--border-strong);
}

.available-players__tabs {
  display: flex;
  gap: 0.35rem;
  margin-bottom: 0.6rem;
  flex-wrap: wrap;
}

.available-players__tab {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: var(--radius-sm);
  padding: 0.35rem 0.8rem;
  font-size: 0.82rem;
  font-weight: 800;
  box-shadow: none;
}

.available-players__tab:hover {
  color: var(--text);
  transform: none;
  box-shadow: none;
}

.available-players__tab--active {
  background: var(--accent-gradient);
  color: #051220;
  border-color: transparent;
}

.available-players input[type="text"] {
  width: 100%;
  margin: 0.75rem 0;
  box-sizing: border-box;
}

.available-players__scroll {
  max-height: 520px;
  overflow-y: auto;
  border-radius: var(--radius-lg);
}

.available-players__scroll thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--surface-2);
}

.available-players button {
  padding: 0.35rem 0.85rem;
  font-size: 0.8rem;
}

.draft-summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1rem;
}

.draft-summary-team h2 {
  font-size: 1.02rem;
  margin-bottom: 0.6rem;
}

/* ---------- Draft grades ---------- */

.draft-grades-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 0.9rem;
  margin-bottom: 2rem;
}

.draft-grade-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.9rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.draft-grade-card--you {
  border-color: var(--accent);
  box-shadow: var(--shadow-glow);
}

.draft-grade-card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.2rem;
}

.draft-grade-card__team {
  font-weight: 800;
  font-size: 0.92rem;
}

.draft-grade-card__letter {
  font-size: 1.6rem;
  font-weight: 800;
  line-height: 1;
}

.draft-grade-card--A .draft-grade-card__letter {
  color: var(--success);
}

.draft-grade-card--B .draft-grade-card__letter {
  color: var(--accent);
}

.draft-grade-card--C .draft-grade-card__letter {
  color: var(--warning);
}

.draft-grade-card--D .draft-grade-card__letter {
  color: var(--bronze);
}

.draft-grade-card--F .draft-grade-card__letter {
  color: var(--danger);
}

.draft-grade-card__surplus {
  margin: 0;
  font-size: 0.78rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.draft-grade-card__line {
  margin: 0;
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.draft-grade-card__line strong {
  color: var(--text);
}

.draft-grade-card__notes {
  margin: 0.2rem 0 0;
  padding-left: 1.1rem;
  font-size: 0.76rem;
  color: var(--muted);
}

/* ---------- Cheat sheets ---------- */

.cheat-sheet-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 0.9rem;
}

.cheat-sheet-card {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.9rem 1rem;
  transition: border-color 0.12s ease, background-color 0.12s ease;
}

.cheat-sheet-card:hover {
  border-color: var(--accent);
  background: var(--surface-3);
}

.cheat-sheet-card__body {
  flex: 1;
  min-width: 0;
  text-decoration: none;
  color: var(--text);
}

.cheat-sheet-card__body h3 {
  margin: 0 0 0.2rem;
  font-size: 1rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cheat-sheet-card__meta {
  margin: 0;
  font-size: 0.8rem;
  color: var(--muted);
}

.cheat-sheet-card__delete {
  background: none;
  border: 1px solid var(--border);
  box-shadow: none;
  padding: 0.35rem 0.7rem;
  font-size: 0.78rem;
  color: var(--muted);
  border-radius: var(--radius-sm);
}

.cheat-sheet-card__delete:hover {
  color: var(--danger);
  border-color: var(--danger);
  filter: none;
  transform: none;
  box-shadow: none;
}

.cheat-sheet-editor__name {
  width: 100%;
  max-width: 480px;
  font-size: 1.3rem;
  font-weight: 800;
  background: none;
  border: none;
  border-bottom: 1px solid var(--border);
  border-radius: 0;
  padding: 0.2rem 0;
  color: var(--text);
}

.cheat-sheet-editor__name:focus {
  outline: none;
  border-bottom-color: var(--accent);
  box-shadow: none;
}

.cheat-sheet-editor__teams-field {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--text-secondary);
  font-size: 0.85rem;
}

.cheat-sheet-editor__teams-field input {
  width: 4.5rem;
}

.cheat-sheet-editor__notes {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text);
  padding: 0.7rem 0.9rem;
  font-family: inherit;
  font-size: 0.9rem;
  resize: vertical;
  margin-bottom: 1.5rem;
}

.cheat-sheet-list {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.cheat-sheet-row {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);

// Renders children inside a real Shadow DOM subtree carrying FF_CSS — style
// isolation works in both directions, so ~2,400 lines of a completely
// different app's CSS (classes, bare h1/a/button selectors, the works) can
// be pasted in near-verbatim without any risk of colliding with Vantage's
// own styles, and without Vantage's styles leaking in either.
function FFShadowRoot({ accent, children }) {
  const hostRef = useRef(null);
  const [shadowRoot, setShadowRoot] = useState(null);
  useEffect(() => {
    const host = hostRef.current;
    if (!host) return;
    setShadowRoot(host.shadowRoot || host.attachShadow({ mode: "open" }));
  }, []);
  return (
    <div ref={hostRef} style={{ "--ff-accent": accent, display: "block" }}>
      {shadowRoot &&
        ReactDOM.createPortal(
          <>
            <style>{FF_CSS}</style>
            {children}
          </>,
          shadowRoot
        )}
    </div>
  );
}

// Top-level sub-pages the original app exposed in its sidebar nav (player
// profile/comparison/league-detail are reached via links from these, same
// as the original — not top-level tabs there either).
/* ----------------------------------------------------------------------
   FANTASY TAB — client-side data layer
   Ported from FantasyFootballTool's server/src/services/{sleeperClient,
   tradeValueClient}.ts. Both source APIs send permissive CORS headers
   (verified via curl), so these run as plain browser fetch() calls instead
   of going through a backend — the Netlify Blobs TTL cache those files used
   server-side is replaced by the IndexedDB cache (dbGetFreshCache/dbSetCache,
   defined earlier) here instead.
---------------------------------------------------------------------- */

const FF_SLEEPER_BASE = "https://api.sleeper.app/v1";
const FF_FANTASY_POSITIONS = new Set(["QB", "RB", "WR", "TE", "K", "DEF"]);
const FF_PLAYERS_CACHE_ID = "sleeper-players-v2";
const FF_PLAYERS_CACHE_MAX_AGE_MS = 24 * 60 * 60 * 1000;
const FF_TRADEVALUE_CACHE_MAX_AGE_MS = 12 * 60 * 60 * 1000;

async function ffSleeperGet(pathname) {
  const res = await fetch(`${FF_SLEEPER_BASE}${pathname}`);
  if (!res.ok) throw new Error(`Sleeper API error ${res.status} for ${pathname}`);
  return res.json();
}

async function ffFindUserByUsername(username) {
  return ffSleeperGet(`/user/${encodeURIComponent(username)}`);
}

// Sleeper's idea of "the current season" only rolls over ~March/April, not
// on the calendar year, so ask it directly rather than using new Date().
async function ffGetCurrentSeason() {
  const state = await ffSleeperGet("/state/nfl");
  return state.season;
}

async function ffGetLeaguesForUser(userId, season) {
  const resolvedSeason = season || (await ffGetCurrentSeason());
  return ffSleeperGet(`/user/${userId}/leagues/nfl/${resolvedSeason}`);
}

// The full ~14MB Sleeper player directory (every player, active or not) —
// cached in IndexedDB rather than re-fetched on every visit. Callers that
// only want fantasy-relevant players should go through
// ffGetFantasyRelevantPlayers instead of calling this directly.
async function ffGetPlayersMap() {
  const cached = await dbGetFreshCache(FF_PLAYERS_CACHE_ID, FF_PLAYERS_CACHE_MAX_AGE_MS);
  if (cached) return cached;
  const players = await ffSleeperGet("/players/nfl");
  await dbSetCache(FF_PLAYERS_CACHE_ID, players);
  return players;
}

function ffPlayerDisplayName(playerId, meta) {
  return (meta && meta.full_name) || `${(meta && meta.first_name) || ""} ${(meta && meta.last_name) || ""}`.trim() || playerId;
}

function ffToPlayer(playerId, meta) {
  return {
    playerId,
    name: ffPlayerDisplayName(playerId, meta),
    position: (meta && meta.position) || "UNK",
    team: (meta && meta.team) || null,
    injuryStatus: (meta && meta.injury_status) || null,
  };
}

function ffToNumber(value) {
  if (value === null || value === undefined) return null;
  const num = typeof value === "number" ? value : Number(value);
  return Number.isFinite(num) ? num : null;
}

function ffToPlayerProfile(playerId, meta) {
  return {
    playerId,
    name: ffPlayerDisplayName(playerId, meta),
    position: meta.position || "UNK",
    team: meta.team || "FA",
    age: ffToNumber(meta.age),
    heightInches: ffToNumber(meta.height),
    weightLbs: ffToNumber(meta.weight),
    college: meta.college || null,
    yearsExp: ffToNumber(meta.years_exp),
    jerseyNumber: ffToNumber(meta.number),
    status: meta.status || null,
    injuryStatus: meta.injury_status || null,
    depthChartPosition: meta.depth_chart_position || null,
    depthChartOrder: ffToNumber(meta.depth_chart_order),
  };
}

// Same "is this a real, current NFL roster player" check the original app
// used everywhere it surfaced a player list, so Players/Waiver Wire stay
// consistent instead of one filtering inactive players and the other not.
function ffIsFantasyRelevant(meta) {
  const isActive = meta.position === "DEF" ? meta.active === true : meta.status === "Active";
  if (!isActive) return false;
  if (!meta.team) return false;
  if (!meta.position || !FF_FANTASY_POSITIONS.has(meta.position)) return false;
  return true;
}

async function ffGetFantasyRelevantPlayers() {
  const playersMap = await ffGetPlayersMap();
  const profiles = [];
  for (const [playerId, meta] of Object.entries(playersMap)) {
    if (!ffIsFantasyRelevant(meta)) continue;
    profiles.push(ffToPlayerProfile(playerId, meta));
  }
  return profiles;
}

async function ffGetTrendingPlayers(type, limit = 25) {
  // Sleeper's trending endpoint includes inactive/free-agent players, so
  // over-fetch and filter+trim to `limit` after.
  const [trending, playersMap] = await Promise.all([
    ffSleeperGet(`/players/nfl/trending/${type}?lookback_hours=24&limit=${limit * 4}`),
    ffGetPlayersMap(),
  ]);
  const results = [];
  for (const entry of trending) {
    const meta = playersMap[entry.player_id];
    if (!meta || !ffIsFantasyRelevant(meta)) continue;
    results.push({ ...ffToPlayerProfile(entry.player_id, meta), trendCount: entry.count });
    if (results.length >= limit) break;
  }
  return results;
}

// Sleeper's scoring_settings is a flat map of stat -> point value; "rec"
// (points per reception) is what actually distinguishes PPR leagues.
function ffScoringTypeFor(scoringSettings) {
  const rec = (scoringSettings && scoringSettings.rec) || 0;
  if (rec >= 1) return "Full PPR";
  if (rec >= 0.5) return "Half PPR";
  return "Standard";
}

async function ffGetLeagueDetail(leagueId, userId) {
  const [leagueMeta, rosters, users, playersMap] = await Promise.all([
    ffSleeperGet(`/league/${leagueId}`),
    ffSleeperGet(`/league/${leagueId}/rosters`),
    ffSleeperGet(`/league/${leagueId}/users`),
    ffGetPlayersMap(),
  ]);

  const userNameByOwnerId = new Map(users.map((u) => [u.user_id, u.display_name]));
  const myRoster = rosters.find((r) => r.owner_id === userId);
  if (!myRoster) throw new Error(`No roster found for user ${userId} in league ${leagueId}`);

  const standings = [...rosters]
    .sort((a, b) => (b.settings.wins || 0) - (a.settings.wins || 0) || (b.settings.fpts || 0) - (a.settings.fpts || 0))
    .map((r, index) => ({
      teamId: String(r.roster_id),
      teamName: userNameByOwnerId.get(r.owner_id) || `Team ${r.roster_id}`,
      record: { wins: r.settings.wins || 0, losses: r.settings.losses || 0, ties: r.settings.ties || 0 },
      pointsFor: r.settings.fpts || 0,
      pointsAgainst: r.settings.fpts_against || 0,
      rank: index + 1,
    }));

  const teams = rosters.map((r) => ({
    teamId: String(r.roster_id),
    teamName: userNameByOwnerId.get(r.owner_id) || `Team ${r.roster_id}`,
    roster: (r.players || []).map((playerId) => ffToPlayer(playerId, playersMap[playerId])),
  }));

  let currentMatchup = null;
  try {
    const state = await ffSleeperGet("/state/nfl");
    const matchups = await ffSleeperGet(`/league/${leagueId}/matchups/${state.week}`);
    const mine = matchups.find((m) => m.roster_id === myRoster.roster_id);
    const opponent = mine ? matchups.find((m) => m.matchup_id === mine.matchup_id && m.roster_id !== myRoster.roster_id) : undefined;
    if (mine && opponent) {
      const opponentRoster = rosters.find((r) => r.roster_id === opponent.roster_id);
      currentMatchup = {
        week: state.week,
        myScore: mine.points,
        opponentScore: opponent.points,
        opponentTeamName: opponentRoster ? userNameByOwnerId.get(opponentRoster.owner_id) || `Team ${opponent.roster_id}` : "Unknown",
      };
    }
  } catch (e) {
    currentMatchup = null;
  }

  return {
    platform: "sleeper",
    leagueId,
    name: leagueMeta.name,
    season: leagueMeta.season,
    myTeam: {
      teamId: String(myRoster.roster_id),
      teamName: userNameByOwnerId.get(userId) || "My Team",
      record: { wins: myRoster.settings.wins || 0, losses: myRoster.settings.losses || 0, ties: myRoster.settings.ties || 0 },
      roster: (myRoster.players || []).map((playerId) => ffToPlayer(playerId, playersMap[playerId])),
    },
    teams,
    standings,
    currentMatchup,
    settings: {
      scoringType: ffScoringTypeFor(leagueMeta.scoring_settings),
      rosterPositions: leagueMeta.roster_positions || [],
      playoffTeams: (leagueMeta.settings && leagueMeta.settings.playoff_teams) || null,
      totalRosters: leagueMeta.total_rosters || rosters.length,
    },
  };
}

async function ffGetRosterTeamNames(leagueId) {
  const [rosters, users] = await Promise.all([ffSleeperGet(`/league/${leagueId}/rosters`), ffSleeperGet(`/league/${leagueId}/users`)]);
  const userNameByOwnerId = new Map(users.map((u) => [u.user_id, u.display_name]));
  return new Map(rosters.map((r) => [r.roster_id, userNameByOwnerId.get(r.owner_id) || `Team ${r.roster_id}`]));
}

// Sleeper's transactions endpoint is keyed by week, not a flat feed — pull
// the current week plus the two before it and merge, rather than fetching
// all 18 weeks for a list that only shows the last 15 anyway.
async function ffGetLeagueTransactions(leagueId, limit = 15) {
  const state = await ffSleeperGet("/state/nfl");
  const currentWeek = Math.max(1, state.week || 1);
  const weeks = [currentWeek, currentWeek - 1, currentWeek - 2].filter((w) => w >= 1);

  const [weeklyResults, playersMap, rosterNames] = await Promise.all([
    Promise.all(weeks.map((week) => ffSleeperGet(`/league/${leagueId}/transactions/${week}`).catch(() => []))),
    ffGetPlayersMap(),
    ffGetRosterTeamNames(leagueId),
  ]);

  const all = weeklyResults.flat().filter((t) => t.status === "complete");
  all.sort((a, b) => b.created - a.created);

  function toRefs(entries) {
    if (!entries) return [];
    return Object.entries(entries).map(([playerId, rosterId]) => ({
      playerId,
      playerName: ffPlayerDisplayName(playerId, playersMap[playerId]),
      teamName: rosterNames.get(rosterId) || `Team ${rosterId}`,
    }));
  }

  return all.slice(0, limit).map((t) => ({
    id: t.transaction_id,
    type: t.type,
    createdAt: t.created,
    adds: toRefs(t.adds),
    drops: toRefs(t.drops),
  }));
}

function ffDraftStatusFrom(status) {
  if (status === "complete") return "complete";
  if (status === "drafting" || status === "paused") return "in_progress";
  return "not_started";
}

async function ffGetLeagueDraft(leagueId) {
  const drafts = await ffSleeperGet(`/league/${leagueId}/drafts`);
  const draft = drafts[0];
  if (!draft) return { status: "not_started", numTeams: 0, rounds: 0, picks: [] };

  const [picks, playersMap, rosterNames] = await Promise.all([
    ffSleeperGet(`/draft/${draft.draft_id}/picks`),
    ffGetPlayersMap(),
    ffGetRosterTeamNames(leagueId),
  ]);

  const draftPicks = picks.map((p) => {
    const meta = playersMap[p.player_id];
    return {
      round: p.round,
      pickNo: p.pick_no,
      teamIndex: p.draft_slot - 1,
      teamName: rosterNames.get(p.roster_id) || `Team ${p.roster_id}`,
      playerId: p.player_id,
      playerName: ffPlayerDisplayName(p.player_id, meta),
      playerPosition: (meta && meta.position) || "UNK",
    };
  });

  return {
    status: ffDraftStatusFrom(draft.status),
    numTeams: (draft.settings && draft.settings.teams) || rosterNames.size,
    rounds: (draft.settings && draft.settings.rounds) || Math.max(0, ...draftPicks.map((p) => p.round)),
    picks: draftPicks,
  };
}

// ---------- FantasyCalc trade values ----------

async function ffFetchFantasyCalcValues(isDynasty, ppr) {
  const params = new URLSearchParams({ isDynasty: String(isDynasty), numQbs: "1", numTeams: "12", ppr: String(ppr) });
  const res = await fetch(`https://api.fantasycalc.com/values/current?${params.toString()}`);
  if (!res.ok) throw new Error(`FantasyCalc API error ${res.status}`);
  return res.json();
}

async function ffGetTradeValues(isDynasty, ppr = 1) {
  const cacheId = `fantasycalc-${isDynasty ? "dynasty" : "redraft"}-ppr${ppr}-v2`;
  const cached = await dbGetCache(cacheId);
  if (cached && Date.now() - cached.fetchedAt < FF_TRADEVALUE_CACHE_MAX_AGE_MS) {
    return cached.data;
  }
  try {
    const entries = await ffFetchFantasyCalcValues(isDynasty, ppr);
    const values = {};
    for (const entry of entries) {
      if (!entry.player || !entry.player.sleeperId) continue;
      values[entry.player.sleeperId] = {
        sleeperId: entry.player.sleeperId,
        value: entry.value,
        overallRank: entry.overallRank,
        positionRank: entry.positionRank,
        trend30Day: entry.trend30Day,
      };
    }
    await dbSetCache(cacheId, values);
    return values;
  } catch (err) {
    // FantasyCalc can have transient outages — serving stale-but-present
    // data beats throwing, same reasoning as the server-side original.
    if (cached) return cached.data;
    throw err;
  }
}

/* ----------------------------------------------------------------------
   FANTASY TAB — small shared helpers/components
   Ported from FantasyFootballTool's lib/*.ts and components/*.tsx. react-
   query's useQuery is replaced by ffUseQuery, a small hook backed by a
   module-level cache map — same "fetch once, share across pages" behavior
   for the session, without pulling in the library. react-router's <Link>
   is replaced by plain <a href="#fantasy/..."> since the hash IS the real
   URL here, which gets standard link behavior (cmd/ctrl-click, etc.) free.
---------------------------------------------------------------------- */

const ffQueryCache = new Map();

function ffUseQuery(key, queryFn, deps) {
  const depsKey = JSON.stringify(deps === undefined ? [key] : deps);
  const [state, setState] = useState(() => {
    const cached = ffQueryCache.get(key);
    return cached ? { data: cached, isLoading: false, isError: false, error: null } : { data: undefined, isLoading: true, isError: false, error: null };
  });
  useEffect(() => {
    let cancelled = false;
    const cached = ffQueryCache.get(key);
    if (cached) {
      setState({ data: cached, isLoading: false, isError: false, error: null });
      return;
    }
    setState({ data: undefined, isLoading: true, isError: false, error: null });
    queryFn()
      .then((data) => {
        ffQueryCache.set(key, data);
        if (!cancelled) setState({ data, isLoading: false, isError: false, error: null });
      })
      .catch((err) => {
        if (!cancelled) setState({ data: undefined, isLoading: false, isError: true, error: err });
      });
    return () => {
      cancelled = true;
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [key, depsKey]);
  return state;
}

function ffMedalClass(rank) {
  if (rank === 1) return "rank-medal rank-medal--gold";
  if (rank === 2) return "rank-medal rank-medal--silver";

  return "";
}

function ffFormatHeight(inches) {
  if (inches === null || inches === undefined) return "—";
  const feet = Math.floor(inches / 12);
  const remainder = inches % 12;
  return `${feet}'${remainder}"`;
}

  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();

function FFPlayerAvatar({ playerId, name, position, team, size = "md", ringColor }) {
  const [errored, setErrored] = useState(false);
  const ringStyle = ringColor ? { borderColor: ringColor, boxShadow: `0 0 24px ${ringColor}66` } : undefined;

  if (position === "PICK") {
    return (
      <div className={`player-avatar player-avatar--${size} player-avatar--fallback`} style={ringStyle}>
        PK
      </div>
    );
  }

  const src =
    position === "DEF" && team
      ? `https://sleepercdn.com/images/team_logos/nfl/${team.toLowerCase()}.png`
      : `https://sleepercdn.com/content/nfl/players/thumb/${playerId}.jpg`;

  if (errored) {
    return (
      <div className={`player-avatar player-avatar--${size} player-avatar--fallback`} style={ringStyle}>
        {ffInitials(name)}
      </div>
    );
  }

  return (
    <img
      className={`player-avatar player-avatar--${size} ${position === "DEF" ? "player-avatar--logo" : ""}`}
      style={ringStyle}
      src={src}
      alt={name}
      loading="lazy"
      onError={() => setErrored(true)}
    />
  );
}

function FFTeamTag({ team }) {

function FFComparisonTable({ players, values, onRemove }) {
  if (players.length === 0) {
    return <p className="empty-state">Add at least two players to compare them.</p>;
  }
  const maxValue = Math.max(...players.map((p) => (values[p.playerId] ? values[p.playerId].value : -Infinity)));
  const byeCounts = new Map();
  for (const p of players) {
    const bye = ffByeWeekFor(p.team);
    if (bye !== null) byeCounts.set(bye, (byeCounts.get(bye) || 0) + 1);
  }

  const rows = [
    ["Rank", (p) => (values[p.playerId] ? <span className={ffMedalClass(values[p.playerId].overallRank)}>#{values[p.playerId].overallRank}</span> : "—")],
    [
      "Value",
      (p) => {
        const entry = values[p.playerId];
        if (!entry) return "Unranked";
        const isWinner = players.length > 1 && entry.value === maxValue;
        return <span className={isWinner ? "comparison-table__winner" : undefined}>{entry.value.toLocaleString()}</span>;
      },
    ],
    ["Position Rank", (p) => (values[p.playerId] ? `${p.position}${values[p.playerId].positionRank}` : "—")],
    [
      "30-Day Trend",
      (p) => {
        const entry = values[p.playerId];
        if (!entry) return "—";
        if (entry.trend30Day === 0) return <span className="empty-state">Flat</span>;
        const up = entry.trend30Day > 0;
        return (
          <span className={up ? "comparison-table__winner" : "error-text"}>
            {up ? "▲" : "▼"} {Math.abs(entry.trend30Day).toLocaleString()}
          </span>
        );
      },
    ],
    ["Position", (p) => <FFPositionBadge position={p.position} />],
    ["Team", (p) => <FFTeamTag team={p.team} />],
    [
      "Bye Week",
      (p) => {
        const bye = ffByeWeekFor(p.team);
        if (bye === null) return "—";
        const stacked = (byeCounts.get(bye) || 0) > 1;
        return (
          <span className={stacked ? "error-text" : undefined}>
            {bye}
            {stacked ? " (stacked)" : ""}
          </span>
        );
      },
    ],
    ["Depth Chart", (p) => (p.depthChartPosition ? `${p.depthChartPosition}${p.depthChartOrder ?? ""}` : "—")],
    ["Age", (p) => p.age ?? "—"],
    ["Height/Weight", (p) => `${ffFormatHeight(p.heightInches)}${p.weightLbs !== null ? ` / ${p.weightLbs} lb` : ""}`],
    ["College", (p) => p.college ?? "—"],
    ["Experience", (p) => (p.yearsExp !== null ? `${p.yearsExp} yrs` : "—")],
    ["Status", (p) => (p.injuryStatus ? <span className="injury-badge">{p.injuryStatus}</span> : "Healthy")],
  ];

  return (
    <div className="comparison-scroll">
      <table className="data-table comparison-table">
        <thead>
          <tr>
            <th>Attribute</th>
            {players.map((p) => (
              <th key={p.playerId}>
                <div className="comparison-table__player">
                  <FFPlayerAvatar playerId={p.playerId} name={p.name} position={p.position} team={p.team} size="sm" />
                  <a href={`#fantasy/players/${p.playerId}`}>{p.name}</a>
                  <button type="button" className="trade-side__remove" onClick={() => onRemove(p.playerId)}>
                    &times;
                  </button>
                </div>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map(([label, render]) => (
            <tr key={label}>
              <td className="comparison-table__label">{label}</td>
              {players.map((p) => (
                <td key={p.playerId}>{render(p)}</td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// Merges Sleeper (client-fetched) + Yahoo (fetched via the backend, since
// only it holds the access token) into one "leagues" list for the Dashboard.
async function ffGetLinkedLeagueSummaries(sleeper, yahoo) {
  const sleeperIds = (sleeper && sleeper.linkedLeagueIds) || [];
  const yahooKeys = (yahoo && yahoo.linkedLeagueKeys) || [];
  const leagues = [];
  const errors = [];

  const sleeperResults = await Promise.allSettled(sleeperIds.map((id) => ffGetLeagueDetail(id, sleeper.userId)));
  sleeperResults.forEach((r, i) => {
    if (r.status === "fulfilled") {
      const d = r.value;
      leagues.push({ platform: "sleeper", leagueId: sleeperIds[i], name: d.name, season: d.season, teamName: d.myTeam.teamName, record: d.myTeam.record });
    } else {
      errors.push(`Couldn't load a Sleeper league: ${r.reason && r.reason.message}`);
    }
  });

  const yahooResults = await Promise.allSettled(yahooKeys.map((key) => ffGetYahooLeagueDetail(key)));
  yahooResults.forEach((r, i) => {
    if (r.status === "fulfilled") {
      const d = r.value;
      leagues.push({ platform: "yahoo", leagueId: yahooKeys[i], name: d.name, season: d.season, teamName: d.myTeam.teamName, record: d.myTeam.record });
    } else {
      errors.push(`Couldn't load a Yahoo league: ${r.reason && r.reason.message}`);
    }
  });

  return { leagues, errors };
}

const FF_POSITIONS_LIST = ["QB", "RB", "WR", "TE", "K", "DEF"];
const FF_PAGE_SIZE = 15;

function FFPlayersPage({ watchlist, setWatchlist }) {
  const playersQuery = ffUseQuery("ff-players", ffGetFantasyRelevantPlayers);
  const [search, setSearch] = useState("");
  const [position, setPosition] = useState("ALL");
  const [team, setTeam] = useState("ALL");
  const [format, setFormat] = useState("full");
  const [health, setHealth] = useState("ALL");
  const [rookiesOnly, setRookiesOnly] = useState(false);
  const [rankedOnly, setRankedOnly] = useState(false);
  const [page, setPage] = useState(1);

  const { dynasty, ppr } = FF_FORMAT_PARAMS[format];
  const tradeValuesQuery = ffUseQuery(`ff-trade-values-${dynasty}-${ppr}`, () => ffGetTradeValues(dynasty, ppr), [dynasty, ppr]);
  const values = tradeValuesQuery.data || {};
  const data = playersQuery.data;

  const teams = useMemo(() => (data ? [...new Set(data.map((p) => p.team))].sort() : []), [data]);

  const filtered = useMemo(() => {
    if (!data) return [];
    const query = search.trim().toLowerCase();
    return data
      .filter((p) => (position === "ALL" ? true : p.position === position))
      .filter((p) => (team === "ALL" ? true : p.team === team))
      .filter((p) => (query === "" ? true : p.name.toLowerCase().includes(query)))
      .filter((p) => {
        if (health === "ALL") return true;
        if (health === "HEALTHY") return !p.injuryStatus;
        return Boolean(p.injuryStatus);
      })
      .filter((p) => (rookiesOnly ? p.yearsExp === 0 : true))
      .filter((p) => (rankedOnly ? Boolean(values[p.playerId]) : true))
      .sort((a, b) => {
        const rankA = values[a.playerId] ? values[a.playerId].overallRank : Infinity;
        const rankB = values[b.playerId] ? values[b.playerId].overallRank : Infinity;
        if (rankA !== rankB) return rankA - rankB;
        return a.name.localeCompare(b.name);
      });
  }, [data, search, position, team, health, rookiesOnly, rankedOnly, values]);

  const totalPages = Math.max(1, Math.ceil(filtered.length / FF_PAGE_SIZE));
  const currentPage = Math.min(page, totalPages);
  const paged = filtered.slice((currentPage - 1) * FF_PAGE_SIZE, currentPage * FF_PAGE_SIZE);
  const rangeStart = filtered.length === 0 ? 0 : (currentPage - 1) * FF_PAGE_SIZE + 1;
  const rangeEnd = Math.min(currentPage * FF_PAGE_SIZE, filtered.length);

  return (
