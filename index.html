function BackupMenu({
  theme,
  themeKey,
  fitness,
  golf,
  trackers,
  profile,
  financial,
  events,
  history,
  setThemeKey,
  setFitness,
  setGolf,
  setTrackers,
  setProfile,
  setFinancial,
  setEvents,
  setHistory,
}) {
  const [open, setOpen] = useState(false);
  const [status, setStatus] = useState(null);
  const wrapRef = useRef(null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    function handleOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setOpen(false);
      }
    }
    document.addEventListener("mousedown", handleOutside);
    return () => document.removeEventListener("mousedown", handleOutside);
  }, []);

  function handleExport() {
    const payload = {
      app: "personal-dashboard",
      version: 1,
      exportedAt: new Date().toISOString(),
      theme: themeKey,
      fitness,
      golf,
      trackers,
      profile,
      financial,
      events,
      history,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `dashboard-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus({ type: "success", message: "Backup downloaded." });
  }

  function handleImportClick() {
    if (fileInputRef.current) fileInputRef.current.click();
  }

  function handleFileChange(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const sanitized = sanitizeBackup(parsed);
        if (Object.keys(sanitized).length === 0) {
          setStatus({ type: "error", message: "No recognizable dashboard data in that file." });
          return;
        }
        if (sanitized.theme) setThemeKey(sanitized.theme);
        if (sanitized.fitness) setFitness(sanitized.fitness);
        if (sanitized.golf) setGolf(sanitized.golf);
        if (sanitized.trackers) setTrackers(sanitized.trackers);
        if (sanitized.profile) setProfile(sanitized.profile);
        if (sanitized.financial) setFinancial(sanitized.financial);
        if (sanitized.events) setEvents(sanitized.events);
        if (sanitized.history) setHistory(sanitized.history);
        setStatus({ type: "success", message: "Backup restored." });
      } catch (err) {
        setStatus({ type: "error", message: "Couldn't parse that file as JSON." });
      }
    };
    reader.readAsText(file);
  }

  return (
    <div ref={wrapRef} style={{ position: "relative" }}>
      <button
        onClick={() => {
          setOpen((o) => !o);
          setStatus(null);
        }}
        title="Backup & restore"
        className="v-btn"
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          width: "34px",
          height: "34px",
          borderRadius: "50%",
          border: `1px solid ${theme.cardBorder}`,
          background: theme.accentSoft,
          color: theme.text,
        }}
      >
        <IconBackup />
      </button>

      {open && (
        <div
          style={{
            position: "fixed",
            top: "64px",
            right: "16px",
            width: "260px",
            maxWidth: "min(92vw, 260px)",
            zIndex: 50,
            padding: "16px",
            ...cardBackgroundStyle(theme),
          }}
        >
          <div
            style={{
              fontSize: "11px",
              fontWeight: 700,
              letterSpacing: "0.1em",
              textTransform: "uppercase",
              color: theme.sectionLabelColor,
              marginBottom: "6px",
            }}
          >
            Backup & Restore
          </div>
          <div style={{ fontSize: "12px", color: theme.textMuted, marginBottom: "14px", lineHeight: 1.4 }}>
            Your data lives only in this browser. Export a copy, or restore from a previous export.
          </div>

          <button
            onClick={handleExport}
            className="v-btn"
            style={{
              width: "100%",
              padding: "9px 12px",
              borderRadius: "8px",
              border: "none",
              background: theme.accent,
              color: theme.accentText,
              fontSize: "13px",
              fontWeight: 700,
              marginBottom: "8px",
            }}
          >
            Export Backup
          </button>
          <button
            onClick={handleImportClick}
            className="v-btn"
            style={{
              width: "100%",
              padding: "9px 12px",
              borderRadius: "8px",
              border: `1px solid ${theme.inputBorder}`,
              background: "transparent",
              color: theme.text,
              fontSize: "13px",
              fontWeight: 700,
            }}
          >
            Import Backup
          </button>
          <input
            ref={fileInputRef}
            type="file"
            accept="application/json"
            onChange={handleFileChange}
            style={{ display: "none" }}
          />

          {status && (
            <div
              style={{
                marginTop: "10px",
                fontSize: "12px",
                fontWeight: 600,
                color: status.type === "error" ? theme.danger : theme.positive,
              }}
            >
              {status.message}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ----------------------------------------------------------------------
   CALENDAR INTEGRATION
   Client-side OAuth against Google Calendar and Microsoft Graph. Needs:
   1. The page served over http/https (OAuth providers reject file://).
   2. Your own OAuth client IDs from Google Cloud Console / Microsoft Entra,
      pasted into the fields below — nothing is hardcoded or sent anywhere
      but Google/Microsoft's own APIs.
---------------------------------------------------------------------- */

function normalizeGoogleEvents(items) {
  return (items || []).map((it) => {
    const start = (it.start && (it.start.dateTime || it.start.date)) || new Date().toISOString();
    return {
      id: `g-${it.id}`,
      title: it.summary || "(untitled event)",
      detail: new Date(start).toLocaleDateString(undefined, { month: "short", day: "numeric" }),
      date: start.slice(0, 10),
      source: "Google",
    };
  });
}

function normalizeMicrosoftEvents(items) {
  return (items || []).map((it) => {
    const start = (it.start && it.start.dateTime) || new Date().toISOString();
    return {
      id: `ms-${it.id}`,
      title: it.subject || "(untitled event)",
      detail: new Date(start).toLocaleDateString(undefined, { month: "short", day: "numeric" }),
      date: start.slice(0, 10),
      source: "Outlook",
    };
  });
}

function CalendarMenu({ theme, integrations, setIntegrations, onEvents, connectedCounts }) {
  const [open, setOpen] = useState(false);
  const [googleStatus, setGoogleStatus] = useState(null);
  const [msStatus, setMsStatus] = useState(null);
  const [googleBusy, setGoogleBusy] = useState(false);
  const [msBusy, setMsBusy] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    function handleOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setOpen(false);
      }
    }
    document.addEventListener("mousedown", handleOutside);
    return () => document.removeEventListener("mousedown", handleOutside);
  }, []);

  function connectGoogle() {
    const clientId = integrations.googleClientId.trim();
    if (!clientId) {
      setGoogleStatus({ type: "error", message: "Add your Google Client ID first." });
      return;
    }
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      setGoogleStatus({ type: "error", message: "Google's sign-in script hasn't loaded yet — try again in a moment." });
      return;
    }
    setGoogleBusy(true);
    setGoogleStatus(null);
    try {
      const tokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: "https://www.googleapis.com/auth/calendar.readonly",
        callback: async (resp) => {
          setGoogleBusy(false);
          if (resp.error) {
            setGoogleStatus({ type: "error", message: `Google sign-in failed: ${resp.error}` });
            return;
          }
          try {
            const now = new Date();
            const in30 = new Date(now.getTime() + 30 * 86400000);
            const url =
              "https://www.googleapis.com/calendar/v3/calendars/primary/events" +
              `?timeMin=${encodeURIComponent(now.toISOString())}` +
              `&timeMax=${encodeURIComponent(in30.toISOString())}` +
              "&singleEvents=true&orderBy=startTime&maxResults=15";
            const r = await fetch(url, { headers: { Authorization: `Bearer ${resp.access_token}` } });
            if (!r.ok) throw new Error(`Google Calendar API returned ${r.status}`);
            const data = await r.json();
            const events = normalizeGoogleEvents(data.items);
            onEvents("google", events);
            setGoogleStatus({ type: "success", message: `Connected — pulled ${events.length} events.` });
          } catch (err) {
            setGoogleStatus({ type: "error", message: err.message || "Failed to fetch Google Calendar events." });
          }
        },
      });
      tokenClient.requestAccessToken();
    } catch (err) {
      setGoogleBusy(false);
      setGoogleStatus({ type: "error", message: err.message || "Couldn't start Google sign-in." });
    }
  }

  function disconnectGoogle() {
    onEvents("google", []);
    setGoogleStatus({ type: "success", message: "Disconnected." });
  }

  async function connectMicrosoft() {
    const clientId = integrations.msClientId.trim();
    if (!clientId) {
      setMsStatus({ type: "error", message: "Add your Microsoft Client ID first." });
      return;
    }
    if (!window.msal) {
      setMsStatus({ type: "error", message: "Microsoft's auth script hasn't loaded yet — try again in a moment." });
      return;
    }
    setMsBusy(true);
    setMsStatus(null);
    try {
      const msalApp = new window.msal.PublicClientApplication({
        auth: { clientId, redirectUri: window.location.origin + window.location.pathname },
      });
      await msalApp.initialize();
      const loginResp = await msalApp.loginPopup({ scopes: ["Calendars.Read"] });
      let tokenResp;
      try {
        tokenResp = await msalApp.acquireTokenSilent({ scopes: ["Calendars.Read"], account: loginResp.account });
      } catch (silentErr) {
        tokenResp = await msalApp.acquireTokenPopup({ scopes: ["Calendars.Read"], account: loginResp.account });
      }
      const now = new Date();
      const in30 = new Date(now.getTime() + 30 * 86400000);
      const url =
        "https://graph.microsoft.com/v1.0/me/calendarview" +
        `?startDateTime=${encodeURIComponent(now.toISOString())}` +
        `&endDateTime=${encodeURIComponent(in30.toISOString())}` +
        "&$orderby=start/dateTime&$top=15";
      const r = await fetch(url, { headers: { Authorization: `Bearer ${tokenResp.accessToken}` } });
      if (!r.ok) throw new Error(`Microsoft Graph API returned ${r.status}`);
      const data = await r.json();
      const events = normalizeMicrosoftEvents(data.value);
      onEvents("microsoft", events);
      setMsStatus({ type: "success", message: `Connected — pulled ${events.length} events.` });
    } catch (err) {
      setMsStatus({ type: "error", message: err.message || "Failed to connect to Outlook." });
    } finally {
      setMsBusy(false);
    }
  }

  function disconnectMicrosoft() {
    onEvents("microsoft", []);
    setMsStatus({ type: "success", message: "Disconnected." });
  }

  const smallInputStyle = {
    width: "100%",
    background: theme.inputBg,
    border: `1px solid ${theme.inputBorder}`,
    borderRadius: "6px",
    color: theme.inputText,
    padding: "7px 9px",
    fontSize: "12px",
    marginBottom: "8px",
    "--focus-ring": theme.accentSoft,
    "--focus-border": theme.accent,
  };

  const connectBtnStyle = {
    width: "100%",
    padding: "8px 12px",
    borderRadius: "8px",
    border: "none",
    background: theme.accent,
    color: theme.accentText,
    fontSize: "12.5px",
    fontWeight: 700,
  };

  const disconnectBtnStyle = {
    width: "100%",
    padding: "8px 12px",
    borderRadius: "8px",
    border: `1px solid ${theme.inputBorder}`,
    background: "transparent",
    color: theme.text,
    fontSize: "12.5px",
    fontWeight: 700,
  };

  return (
    <div ref={wrapRef} style={{ position: "relative" }}>
      <button
        onClick={() => setOpen((o) => !o)}
        title="Connect calendars"
        className="v-btn"
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          width: "34px",
          height: "34px",
          borderRadius: "50%",
          border: `1px solid ${theme.cardBorder}`,
          background: theme.accentSoft,
          color: theme.text,
        }}
      >
        <IconLink />
      </button>

      {open && (
        <div
          className="v-scroll"
          style={{
            position: "fixed",
            top: "64px",
            right: "16px",
            width: "280px",
            maxWidth: "min(92vw, 280px)",
            maxHeight: "80vh",
            overflowY: "auto",
            zIndex: 50,
            padding: "16px",
            "--scroll-thumb": theme.divider,
            ...cardBackgroundStyle(theme),
          }}
        >
          <div
            style={{
              fontSize: "11px",
              fontWeight: 700,
              letterSpacing: "0.1em",
              textTransform: "uppercase",
              color: theme.sectionLabelColor,
              marginBottom: "6px",
            }}
          >
            Connect Calendars
          </div>
          <div style={{ fontSize: "11.5px", color: theme.textMuted, marginBottom: "14px", lineHeight: 1.4 }}>
            Needs an https:// URL and your own OAuth client ID (Google Cloud Console / Microsoft Entra). Ask for
            setup steps if you haven't done this yet.
          </div>

          <div style={{ fontSize: "12px", fontWeight: 700, color: theme.text, marginBottom: "6px" }}>
            Google Calendar {connectedCounts.google > 0 ? `(${connectedCounts.google} events)` : ""}
          </div>
          <input
            placeholder="Google Client ID"
            value={integrations.googleClientId}
            onChange={(e) => setIntegrations({ ...integrations, googleClientId: e.target.value })}
            className="v-input"
            style={smallInputStyle}
          />
          <button
            onClick={connectedCounts.google > 0 ? disconnectGoogle : connectGoogle}
            disabled={googleBusy}
            className="v-btn"
            style={{
              ...(connectedCounts.google > 0 ? disconnectBtnStyle : connectBtnStyle),
              opacity: googleBusy ? 0.6 : 1,
              marginBottom: "6px",
            }}
          >
            {googleBusy ? "Connecting…" : connectedCounts.google > 0 ? "Disconnect Google" : "Connect Google Calendar"}
          </button>
          {googleStatus && (
            <div
              style={{
                fontSize: "11.5px",
                fontWeight: 600,
                color: googleStatus.type === "error" ? theme.danger : theme.positive,
                marginBottom: "10px",
              }}
            >
              {googleStatus.message}
            </div>
          )}

          <div
            style={{
              height: "1px",
              background: theme.divider,
              margin: "12px 0",
            }}
          />

          <div style={{ fontSize: "12px", fontWeight: 700, color: theme.text, marginBottom: "6px" }}>
            Outlook Calendar {connectedCounts.microsoft > 0 ? `(${connectedCounts.microsoft} events)` : ""}
          </div>
          <input
            placeholder="Microsoft Client ID"
            value={integrations.msClientId}
            onChange={(e) => setIntegrations({ ...integrations, msClientId: e.target.value })}
            className="v-input"
            style={smallInputStyle}
          />
          <button
            onClick={connectedCounts.microsoft > 0 ? disconnectMicrosoft : connectMicrosoft}
            disabled={msBusy}
            className="v-btn"
            style={{
              ...(connectedCounts.microsoft > 0 ? disconnectBtnStyle : connectBtnStyle),
              opacity: msBusy ? 0.6 : 1,
            }}
          >
            {msBusy ? "Connecting…" : connectedCounts.microsoft > 0 ? "Disconnect Outlook" : "Connect Outlook"}
          </button>
          {msStatus && (
            <div
              style={{
                fontSize: "11.5px",
                fontWeight: 600,
                color: msStatus.type === "error" ? theme.danger : theme.positive,
                marginTop: "8px",
              }}
            >
              {msStatus.message}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [themeKey, setThemeKey] = usePersistentState(STORAGE_KEYS.theme, "minimal");
  const theme = THEMES[themeKey] || THEMES.minimal;

  const [fitness, setFitness] = usePersistentState(STORAGE_KEYS.fitness, DEFAULT_FITNESS);
  const [golf, setGolf] = usePersistentState(STORAGE_KEYS.golf, DEFAULT_GOLF);
  const [trackers, setTrackers] = usePersistentState(STORAGE_KEYS.trackers, DEFAULT_TRACKERS);
  const [financial, setFinancial] = usePersistentState(STORAGE_KEYS.financial, DEFAULT_FINANCIAL);
  const [events, setEvents] = usePersistentState(STORAGE_KEYS.upcoming, DEFAULT_UPCOMING_EVENTS);
  const [history, setHistory] = usePersistentState(STORAGE_KEYS.history, DEFAULT_HISTORY);
  function recordWeight(value) {
    setHistory((h) => ({ ...h, fitness: pushHistoryPoint(h.fitness, value) }));
  }
  function recordHandicap(value) {
    setHistory((h) => ({ ...h, golf: pushHistoryPoint(h.golf, value) }));
  }
  function recordTracker(id, value) {
    setHistory((h) => ({ ...h, trackers: { ...h.trackers, [id]: pushHistoryPoint(h.trackers[id] || [], value) } }));
  }
  const [profile, setProfile] = usePersistentState(STORAGE_KEYS.profile, DEFAULT_PROFILE);
  const [integrations, setIntegrations] = usePersistentState(STORAGE_KEYS.integrations, DEFAULT_INTEGRATIONS);
  const [watchlist, setWatchlist] = usePersistentState(STORAGE_KEYS.watchlist, DEFAULT_WATCHLIST);
  const [budget, setBudget] = usePersistentState(STORAGE_KEYS.budget, DEFAULT_BUDGET);
  const [journal, setJournal] = usePersistentState(STORAGE_KEYS.journal, DEFAULT_JOURNAL);
  const [goals, setGoals] = usePersistentState(STORAGE_KEYS.goals, DEFAULT_GOALS);

  const [connectedEvents, setConnectedEvents] = useState({ google: [], microsoft: [] });
  function handleCalendarEvents(source, events) {
    setConnectedEvents((prev) => ({ ...prev, [source]: events }));
  }
  const allConnectedEvents = useMemo(
    () => [...connectedEvents.google, ...connectedEvents.microsoft],
    [connectedEvents]
  );
  const connectedCounts = { google: connectedEvents.google.length, microsoft: connectedEvents.microsoft.length };

  const [weather, setWeather] = usePersistentState(STORAGE_KEYS.weather, DEFAULT_WEATHER);
  const [weatherStatus, setWeatherStatus] = useState(null);

  async function loadWeather(lat, lon) {
    try {
      const days = await fetchWeatherDays(lat, lon);
      setWeather({ lat, lon, fetchedAt: Date.now(), days });
      setWeatherStatus(null);
    } catch (err) {
      setWeatherStatus({ type: "error", message: "Couldn't load weather right now." });
    }
  }

  function enableWeather() {
    if (!navigator.geolocation) {
      setWeatherStatus({ type: "error", message: "Location isn't available in this browser." });
      return;
    }
    setWeatherStatus({ type: "loading", message: "Getting your location…" });
    navigator.geolocation.getCurrentPosition(
      (pos) => loadWeather(pos.coords.latitude, pos.coords.longitude),
      () => setWeatherStatus({ type: "error", message: "Location permission denied." })
    );
  }

  useEffect(() => {
    const staleAfter = 3 * 60 * 60 * 1000;
    if (weather.lat != null && (!weather.fetchedAt || Date.now() - weather.fetchedAt > staleAfter)) {
      loadWeather(weather.lat, weather.lon);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const allEvents = useMemo(() => [...events, ...allConnectedEvents], [events, allConnectedEvents]);
  const weekAgendaCount = useMemo(() => {
    const isoSet = new Set();
    for (let i = 0; i < 7; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      isoSet.add(d.toISOString().slice(0, 10));
    }
    return allEvents.filter((e) => isoSet.has(e.date)).length;
  }, [allEvents]);
  const suggestions = useMemo(
    () => generateSuggestions({ fitness, golf, trackers, profile, events: allEvents, history, weather, watchlist }),
    [fitness, golf, trackers, profile, allEvents, history, weather, watchlist]
  );

  const [briefingOpen, setBriefingOpen] = useState(() => {
    try {
      const today = new Date().toISOString().slice(0, 10);
      return localStorage.getItem(STORAGE_KEYS.briefingLastShown) !== today;
    } catch (e) {
      return false;
    }
  });

  function dismissBriefing() {
    try {
      localStorage.setItem(STORAGE_KEYS.briefingLastShown, new Date().toISOString().slice(0, 10));
    } catch (e) {
      /* localStorage unavailable — just close in-memory */
    }
    setBriefingOpen(false);
  }

  return (
    <div
      style={{
        minHeight: "100vh",
        background: theme.pageBgGradient !== "none" ? theme.pageBgGradient : theme.pageBg,
        color: theme.text,
        transition: "background 0.25s ease, color 0.25s ease",
      }}
    >
      <Sidebar
        theme={theme}
        themeKey={themeKey}
        fitness={fitness}
        golf={golf}
        trackers={trackers}
        profile={profile}
        integrations={integrations}
        connectedCounts={connectedCounts}
        financial={financial}
        events={events}
        history={history}
        suggestionsCount={suggestions.length}
        upcomingCount={allEvents.length}
        weekAgendaCount={weekAgendaCount}
        watchlist={watchlist}
        budget={budget}
        journal={journal}
        goals={goals}
        setThemeKey={setThemeKey}
        setFitness={setFitness}
        setGolf={setGolf}
        setTrackers={setTrackers}
        setProfile={setProfile}
        setIntegrations={setIntegrations}
        setFinancial={setFinancial}
        setEvents={setEvents}
        setHistory={setHistory}
        onEvents={handleCalendarEvents}
      />

      <div className="v-main">
        <div
          style={{
            maxWidth: "1200px",
            margin: "0 auto",
            padding: "32px 20px 64px",
            display: "flex",
            flexDirection: "column",
            gap: "20px",
          }}
        >
          <div id="section-suggestions" style={{ scrollMarginTop: "24px" }}>
            <SuggestionsSection
              theme={theme}
              suggestions={suggestions}
              onOpenBriefing={() => setBriefingOpen(true)}
              weather={weather}
              weatherStatus={weatherStatus}
              onEnableWeather={enableWeather}
            />
          </div>

          <div className="v-bento">
            <div id="section-fitness" className="v-bento-fitness" style={{ scrollMarginTop: "24px" }}>
              <FitnessSection
                theme={theme}
                data={fitness}
                setData={setFitness}
                history={history.fitness}
                onRecordWeight={recordWeight}
              />
            </div>
            <div id="section-golf" className="v-bento-golf" style={{ scrollMarginTop: "24px" }}>
              <GolfSection
                theme={theme}
                data={golf}
                setData={setGolf}
                history={history.golf}
                onRecordHandicap={recordHandicap}
              />
            </div>
            <div id="section-financial" className="v-bento-financial" style={{ scrollMarginTop: "24px" }}>
              <FinancialSection theme={theme} data={financial} setData={setFinancial} />
            </div>
            <div id="section-budget" className="v-bento-budget" style={{ scrollMarginTop: "24px" }}>
              <BudgetSnapshotSection theme={theme} data={budget} setData={setBudget} delay={200} />
            </div>
            <div id="section-upcoming" className="v-bento-upcoming" style={{ scrollMarginTop: "24px" }}>
              <UpcomingSection
                theme={theme}
                events={events}
                setEvents={setEvents}
                connectedEvents={allConnectedEvents}
              />
            </div>
            <div id="section-agenda" className="v-bento-agenda" style={{ scrollMarginTop: "24px" }}>
              <AgendaStripSection theme={theme} events={allEvents} delay={220} />
            </div>
            <div id="section-profile" className="v-bento-profile" style={{ scrollMarginTop: "24px" }}>
              <ProfileSection theme={theme} profile={profile} setProfile={setProfile} />
            </div>
            <div id="section-watchlist" className="v-bento-watchlist" style={{ scrollMarginTop: "24px" }}>
              <WatchQueueSection
                theme={theme}
                watchlist={watchlist}
                setWatchlist={setWatchlist}
                genres={profile.genres}
                delay={240}
              />
            </div>
            <div id="section-trackers" className="v-bento-trackers" style={{ scrollMarginTop: "24px" }}>
              <CustomTrackersSection
                theme={theme}
                trackers={trackers}
                setTrackers={setTrackers}
                trackerHistory={history.trackers}
                onRecordTracker={recordTracker}
              />
            </div>
            <div id="section-goals" className="v-bento-goals" style={{ scrollMarginTop: "24px" }}>
              <GoalsBoardSection theme={theme} data={goals} setData={setGoals} delay={260} />
            </div>
            <div id="section-videos" className="v-bento-videos" style={{ scrollMarginTop: "24px" }}>
              <VideoLibrarySection theme={theme} integrations={integrations} setIntegrations={setIntegrations} />
            </div>
            <div id="section-journal" className="v-bento-journal" style={{ scrollMarginTop: "24px" }}>
              <JournalSection theme={theme} data={journal} setData={setJournal} delay={280} />
            </div>
          </div>
        </div>
      </div>

      {briefingOpen && suggestions.length > 0 && (
        <BriefingModal theme={theme} suggestions={suggestions} weather={weather} onClose={dismissBriefing} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        /* offline app-shell caching is a nice-to-have, not required */
      });
    });
  }
</script>
</body>
</html>
