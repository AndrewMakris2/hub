<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vantage</title>
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#0b1f3a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vantage" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<!-- Space Grotesk: only used inside the Fantasy tab's shadow-DOM-scoped stylesheet
     (ported from "The War Room"), but fonts are a document-level resource so the
     <link> has to live in the page's real <head>, not inside the shadow root. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  ::selection { background: rgba(120,120,255,0.3); }
  input, button { font-family: inherit; }
  button { cursor: pointer; }

  @keyframes vFadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .v-card {
    position: relative;
    overflow: hidden;
    transition: transform 0.22s cubic-bezier(.2,.8,.2,1), box-shadow 0.22s ease;
    animation: vFadeInUp 0.5s cubic-bezier(.2,.8,.2,1) both;
  }
  .v-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent-line, transparent);
    opacity: 0.85;
  }
  .v-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.28) !important;
  }

  .v-btn { transition: transform 0.12s ease, filter 0.12s ease; }
  .v-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .v-btn:active { filter: brightness(0.95); transform: translateY(0); }

  .v-input { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  .v-input:focus {
    outline: none;
    box-shadow: 0 0 0 3px var(--focus-ring, rgba(0,0,0,0.12));
    border-color: var(--focus-border, currentColor) !important;
  }

  .v-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .v-scroll::-webkit-scrollbar-track { background: transparent; }
  .v-scroll::-webkit-scrollbar-thumb { background: var(--scroll-thumb, rgba(128,128,128,0.35)); border-radius: 999px; }

  .v-swatch-box { transition: transform 0.15s ease; }
  .v-swatch:hover .v-swatch-box { transform: scale(1.08); }

  .v-tabular { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

  /* ---- Command Rail ---- */
  .v-rail {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 232px;
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    gap: 22px;
    overflow-y: auto;
    z-index: 20;
  }
  /* Background/blur live on a pseudo-element, not .v-rail itself — a
     backdrop-filter on .v-rail would make it the containing block for
     any position:fixed descendant (the popovers below), confining them
     to the rail's narrow width instead of the viewport. */
  .v-rail::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: var(--rail-bg);
    border-right: 1px solid var(--rail-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .v-rail-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .v-rail-utilities { display: flex; flex-direction: column; gap: 8px; }
  .v-main { margin-left: 232px; }

  .v-navitem {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;
    padding: 9px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .v-navitem:hover { background: var(--navitem-hover, rgba(128,128,128,0.1)); }

  @media (max-width: 900px) {
    .v-rail {
      position: sticky;
      top: 0; left: auto; bottom: auto;
      width: 100%;
      height: auto;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      padding: 14px 20px 0;
      gap: 10px 12px;
      overflow: visible;
    }
    .v-rail::before { border-right: none; border-bottom: 1px solid var(--rail-border); }
    .v-rail-brand { order: 1; }
    .v-rail-utilities { order: 2; flex-direction: row; align-items: center; margin-left: auto; }
    .v-rail-nav {
      order: 3;
      flex: none;
      flex-basis: 100%;
      flex-direction: row;
      overflow-x: auto;
      gap: 4px;
      padding-bottom: 12px;
    }
    .v-navitem { width: auto; flex-shrink: 0; }
    .v-main { margin-left: 0; }
  }

  /* ---- Priority Stream ---- */
  .v-stream-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 14px 4px;
    border-bottom: 1px solid var(--stream-divider, rgba(128,128,128,0.14));
  }
  .v-stream-item:last-child { border-bottom: none; }

  /* ---- Home overview tiles ---- */
  .v-hometiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .v-hometile {
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: left;
    border: none;
    cursor: pointer;
    padding: 16px;
    transition: transform 0.15s ease;
  }
  .v-hometile:hover { transform: translateY(-2px); }
</style>

<!-- PDF statement import (Transactions widget): pdf.js runs entirely client-side —
     a statement PDF is parsed in the browser and never leaves the device. Bridged
     onto window since it ships as an ES module but the app itself is a classic script. -->
<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.2.108/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.2.108/pdf.worker.min.mjs";
  window.pdfjsLib = pdfjsLib;
</script>

<!-- Golf scorecard photos: browsers (aside from patchy Safari support) can't
     render .heic/.heif files in an <img> tag at all, and iPhones shoot HEIC
     by default — so HEIC uploads get converted to JPEG client-side before
     they're stored, entirely in the browser. heic-to (not the older/more
     common heic2any) is used because it tracks current libheif releases —
     heic2any's bundled decoder rejected real iPhone HEIC files in testing. -->
<script src="https://unpkg.com/heic-to@1.5.2/dist/iife/heic-to.js"></script>

function isMergeablePlainObject(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    if (parsed == null) return fallback;
    if (isMergeablePlainObject(fallback) && isMergeablePlainObject(parsed)) {
      return { ...fallback, ...parsed };
    }
    return parsed;
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    /* localStorage unavailable or full — silently ignore */
  }
}

function usePersistentState(key, initial) {
  const [state, setState] = useState(() => loadJSON(key, initial));
  useEffect(() => {
    saveJSON(key, state);
  }, [key, state]);
  return [state, setState];
}

// Minimal hash-based router — no library needed for a handful of pages.
// The hash is the source of truth so pages are bookmarkable/shareable and
// the browser's back/forward buttons work; validIds guards against a stale
// hash pointing at a page that no longer exists.
function useHashRoute(defaultRoute, validIds) {
  function resolve() {
    const raw = window.location.hash.replace(/^#/, "");
    // Only the first "/"-segment decides the top-level page, so a page that owns
    // a deeper sub-path (e.g. the Fantasy tab's "fantasy/players/123") still
    // resolves here instead of falling back to defaultRoute.
    const top = raw.split("/")[0];
    return top && validIds.includes(top) ? top : defaultRoute;
  }
  const [route, setRoute] = useState(resolve);
  useEffect(() => {
    function onHashChange() {
      setRoute(resolve());
    }
    window.addEventListener("hashchange", onHashChange);
    return () => window.removeEventListener("hashchange", onHashChange);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  function navigate(next) {
    window.location.hash = next === defaultRoute ? "" : next;
  }
  return [route, navigate];
}

// Nested router for the Fantasy tab's own sub-pages (mirrors the original
// app's react-router routes: /players, /players/:id, /trade-analyzer, ...).
// Reads everything after "fantasy/" in the hash so sub-pages stay bookmarkable
// and back/forward keeps working, same rationale as useHashRoute above.
function useFantasySubRoute() {
  function resolve() {
    const raw = window.location.hash.replace(/^#/, "");
    if (!raw.startsWith("fantasy")) return [];
    const rest = raw.slice("fantasy".length).replace(/^\//, "");
    return rest ? rest.split("/") : [];
  }
  const [segments, setSegments] = useState(resolve);
  useEffect(() => {
    function onHashChange() {
      setSegments(resolve());
    }
    window.addEventListener("hashchange", onHashChange);
    return () => window.removeEventListener("hashchange", onHashChange);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  function navigate(path) {
    window.location.hash = path ? `fantasy/${path}` : "fantasy";
  }
  return [segments, navigate];
}

  if (!target) return null;
  const v = Number(value);

  if (Number.isNaN(v) || Number.isNaN(t) || t === 0) return null;
  return Math.max(0, Math.min(100, Math.round((v / t) * 100)));
}

function pushHistoryPoint(series, value) {
  const numValue = Number(value);
  if (Number.isNaN(numValue)) return series;
  const today = new Date().toISOString().slice(0, 10);
  const idx = series.findIndex((p) => p.date === today);
  let next;
  if (idx !== -1) {
    next = series.slice();
    next[idx] = { date: today, value: numValue };
  } else {
    next = [...series, { date: today, value: numValue }];
  }
  next.sort((a, b) => a.date.localeCompare(b.date));
  return next.slice(-30);
}

function analyzeTrend(series, { flatThreshold = 0.5, minSpanDays = 6 } = {}) {
  if (!series || series.length < 3) return null;
  const first = series[0];
  const last = series[series.length - 1];
  const spanDays = Math.round((new Date(last.date) - new Date(first.date)) / 86400000);
  if (spanDays < minSpanDays) return null;
  const delta = Math.round((last.value - first.value) * 10) / 10;
  const status = Math.abs(delta) <= flatThreshold ? "flat" : delta > 0 ? "up" : "down";
  return { status, delta, spanDays, first: first.value, last: last.value };
}

function guessCategory(description) {

function normalizeStatementDate(raw) {
  if (!raw) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  const m = raw.match(/^(\d{1,4})[\/\-](\d{1,2})[\/\-](\d{1,4})$/);
  if (!m) return null;
  const a = Number(m[1]);
  const b = Number(m[2]);
  const c = Number(m[3]);
  let year, month, day;
  if (a > 31) {
    year = a;
    month = b;
    day = c;
  } else {
    month = a;
    day = b;
    year = c < 100 ? 2000 + c : c;
  }
  if (!year || !month || !day || month > 12 || day > 31) return null;
  return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
}

// Delimiter-agnostic on purpose: pasted CSV/TSV from a bank export and text
// reconstructed from a PDF (space-separated columns, no consistent delimiter)
// both flow through here. Rather than splitting on a delimiter, it finds the
// date and the amount by pattern anywhere in the line and treats whatever's
// left as the description — works regardless of what separates the fields.
function parseStatementLine(line) {
  const amountMatches = [...line.matchAll(/\(?-?\$?\d[\d,]*\.\d{2}\)?/g)];
  if (amountMatches.length === 0) return null;
  // Statement rows are usually "date  description  amount [running balance]" —
  // the last amount-shaped token is the transaction amount far more often than
  // not, but a running-balance column can fool this on some bank formats.
  const amountMatch = amountMatches[amountMatches.length - 1];
  const rawAmount = amountMatch[0].replace(/[\s$,]/g, "").replace(/[()]/g, "").replace(/^-/, "");
  const amount = Math.abs(Number(rawAmount));
  if (!Number.isFinite(amount) || amount === 0) return null;

  const dateMatch = line.match(/\b\d{1,4}[\/\-]\d{1,2}[\/\-]\d{1,4}\b/);
  const date = dateMatch ? normalizeStatementDate(dateMatch[0]) : null;

  const ranges = [[amountMatch.index, amountMatch.index + amountMatch[0].length]];
  if (dateMatch) ranges.push([dateMatch.index, dateMatch.index + dateMatch[0].length]);
  ranges.sort((a, b) => a[0] - b[0]);

  let description = "";
  let cursor = 0;
  ranges.forEach(([start, end]) => {
    description += line.slice(cursor, start);
    cursor = end;
  });
  description += line.slice(cursor);
  description = description
    .replace(/["\t]+/g, " ")
    .replace(/\s+/g, " ")
    .replace(/^[\s,\-–—]+|[\s,\-–—]+$/g, "")
    .trim();

  return {
    date: date || new Date().toISOString().slice(0, 10),
    merchant: description || "Transaction",
    amount,
    category: guessCategory(description),
  };
}

function parseStatementText(text) {
  const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  const results = [];
  lines.forEach((line, lineIdx) => {
    const parsed = parseStatementLine(line);
    if (!parsed) return;
    results.push({ id: "tx" + Date.now() + lineIdx + Math.random().toString(36).slice(2, 6), ...parsed });
  });
  return results;
}

// Reconstructs readable lines from a PDF's raw positioned text fragments by
// bucketing items with near-equal Y coordinates into rows, then ordering each
// row left to right — pdf.js hands back individual glyphs/words with x/y
// positions, not pre-joined lines.
function groupPdfTextItemsIntoLines(items) {
  const sorted = items
    .slice()
    .sort((a, b) => b.transform[5] - a.transform[5] || a.transform[4] - b.transform[4]);
  const rows = [];
  let current = null;
  let currentY = null;
  const TOLERANCE = 2.5;
  sorted.forEach((item) => {
    const y = item.transform[5];
    if (current && Math.abs(y - currentY) <= TOLERANCE) {
      current.push(item);
    } else {
      if (current) rows.push(current);
      current = [item];
      currentY = y;
    }
  });
  if (current) rows.push(current);
  return rows
    .map((row) =>
      row
        .sort((a, b) => a.transform[4] - b.transform[4])
        .map((it) => it.str)
        .join(" ")
        .replace(/\s+/g, " ")
        .trim()
    )
    .filter(Boolean);
}

async function extractPdfText(file) {
  if (!window.pdfjsLib) {
    throw new Error("The PDF reader hasn't finished loading yet — wait a moment and try again.");
  }
  const buffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buffer }).promise;
  const allLines = [];
  for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
    const page = await pdf.getPage(pageNum);
    const content = await page.getTextContent();
    allLines.push(...groupPdfTextItemsIntoLines(content.items));
  }
  return allLines.join("\n");
}

function suggestTitles(genres, queue, count) {
  const n = count || 4;
  const queuedTitles = new Set((queue || []).map((q) => q.title.toLowerCase()));
  const candidates = TITLE_CATALOG.filter((c) => !queuedTitles.has(c.title.toLowerCase()));
  if (genres && genres.length > 0) {
    const scored = candidates
      .map((c) => ({ ...c, score: c.genres.filter((g) => genres.includes(g)).length }))
      .filter((c) => c.score > 0)
      .sort((a, b) => b.score - a.score);
    if (scored.length >= n) return scored.slice(0, n);
    const rest = candidates.filter((c) => !scored.some((s) => s.title === c.title));
    return [...scored, ...rest.filter((c) => c.popular)].slice(0, n);
  }
  const popular = candidates.filter((c) => c.popular);
  return (popular.length >= n ? popular : candidates).slice(0, n);
}

function findFreeWeekendDay(events) {
  const busyDates = new Set(events.map((e) => e.date));
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (let i = 1; i <= 9; i++) {
    const d = new Date(today.getTime() + i * 86400000);
    const day = d.getDay();
    const iso = d.toISOString().slice(0, 10);
    if ((day === 0 || day === 6) && !busyDates.has(iso)) {
      return { date: iso, label: d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }) };
    }
  }
  return null;
}

  if (code >= 1 && code <= 3) return { label: "Partly cloudy", icon: "⛅", outdoor: true };
  if (code === 45 || code === 48) return { label: "Foggy", icon: "🌫️", outdoor: false };
  if (code >= 51 && code <= 67) return { label: "Rain", icon: "🌧️", outdoor: false };
  if (code >= 71 && code <= 77) return { label: "Snow", icon: "❄️", outdoor: false };
  if (code >= 80 && code <= 82) return { label: "Showers", icon: "🌦️", outdoor: false };
  if (code >= 95) return { label: "Storms", icon: "⛈️", outdoor: false };
  return { label: "Mixed", icon: "🌤️", outdoor: true };
}

async function fetchWeatherDays(lat, lon) {
  const url =
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    "&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&temperature_unit=fahrenheit&timezone=auto&forecast_days=10";
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Weather request failed (${res.status})`);
  const data = await res.json();
  return data.daily.time.map((date, i) => ({
    date,
    code: data.daily.weathercode[i],
    tempMax: Math.round(data.daily.temperature_2m_max[i]),
    tempMin: Math.round(data.daily.temperature_2m_min[i]),
    precipProb: data.daily.precipitation_probability_max[i],
  }));
}

function daysUntil(dateStr) {
  const target = new Date(dateStr + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}

function Metric({ theme, label, value, suffix, prefix, formatDisplay, editable, onChange, inputType }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(value);

  useEffect(() => {
    setDraft(value);
  }, [value]);

  function commit() {
    setEditing(false);
    if (draft === "" || draft === value) return;
    onChange(draft);
  }

  return (
    <div style={{ minWidth: 0 }}>
      <div
        style={{
          fontSize: "11px",
          fontWeight: 600,
          letterSpacing: "0.06em",
          textTransform: "uppercase",
          color: theme.textMuted,
          marginBottom: "6px",
          lineHeight: 1.3,
        }}
      >
        {label}
      </div>
      {editable && editing ? (
        <input
          autoFocus
          type={inputType || "text"}
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onBlur={commit}
          onKeyDown={(e) => {
            if (e.key === "Enter") commit();
            if (e.key === "Escape") {
              setDraft(value);
              setEditing(false);
            }
          }}
          className="v-input v-tabular"
          style={{
            width: "100%",
            fontSize: "26px",
            fontWeight: 700,
            color: theme.inputText,
            background: theme.inputBg,
            border: `1px solid ${theme.accent}`,
            borderRadius: "8px",
            padding: "4px 8px",
            "--focus-ring": theme.accentSoft,
            "--focus-border": theme.accent,
          }}
        />
      ) : (
        <div
          onClick={() => editable && setEditing(true)}
          title={editable ? "Click to edit" : undefined}
          className="v-tabular"
          style={{
            fontSize: "26px",
            fontWeight: 700,
            color: theme.text,
            cursor: editable ? "text" : "default",
            lineHeight: 1.15,
            wordBreak: "break-word",
          }}
        >
          {prefix}
          {formatDisplay ? formatDisplay(value) : value}
          {suffix ? (
            <span style={{ fontSize: "15px", fontWeight: 600, color: theme.textMuted, marginLeft: "4px" }}>
              {suffix}
            </span>
          ) : null}
        </div>
      )}
    </div>
  );
}

function Sparkline({ theme, data, label, width = 130, height = 34, goodDirection = "down" }) {
  if (!data || data.length < 2) {
    return (
      <div style={{ marginTop: "16px", fontSize: "11px", color: theme.textFaint }}>
        Trend appears after a couple more updates.
      </div>
    );
  }

  const values = data.map((d) => d.value);
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const stepX = width / (data.length - 1);
  const pad = 4;
  const points = data
    .map((d, i) => {
      const x = i * stepX;
      const y = pad + (1 - (d.value - min) / range) * (height - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    })
    .join(" ");
  const lastX = (data.length - 1) * stepX;
  const lastY = pad + (1 - (values[values.length - 1] - min) / range) * (height - pad * 2);
  const first = values[0];
  const last = values[values.length - 1];
  const delta = Math.round((last - first) * 10) / 10;
  const improved = goodDirection === "down" ? delta < 0 : delta > 0;
  const worsened = goodDirection === "down" ? delta > 0 : delta < 0;
  const deltaColor = delta === 0 ? theme.textMuted : improved ? theme.positive : worsened ? theme.danger : theme.textMuted;

  return (
    <div style={{ marginTop: "16px" }}>
      {label && (
        <div
          style={{
            display: "flex",
            justifyContent: "space-between",
            fontSize: "11px",
            fontWeight: 600,
            color: theme.textMuted,
            marginBottom: "6px",
          }}
        >
          <span>{label}</span>
          <span style={{ color: deltaColor }}>
            {delta > 0 ? "+" : ""}
            {delta}
          </span>
        </div>
      )}
      <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ display: "block" }}>
        <polyline points={points} fill="none" stroke={theme.accent} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
        <circle cx={lastX} cy={lastY} r="2.75" fill={theme.accent} />
      </svg>
    </div>
  );
}

/* ----------------------------------------------------------------------
   VIDEO LIBRARY STORAGE
   Video files are stored in IndexedDB (localStorage caps out around
   5-10MB, nowhere near enough for video). Lives in this browser only —
   not backed up, not synced, and excluded from JSON backup/restore.
---------------------------------------------------------------------- */

const VIDEO_DB_NAME = "vantage-videos";
const VIDEO_STORE = "videos";

function openVideoDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      reject(new Error("This browser doesn't support local video storage."));
      return;
    }
    const req = indexedDB.open(VIDEO_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(VIDEO_STORE)) {
        db.createObjectStore(VIDEO_STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbPutVideo(record) {
  const db = await openVideoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(VIDEO_STORE, "readwrite");
    tx.objectStore(VIDEO_STORE).put(record);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function dbGetAllVideos() {
  const db = await openVideoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(VIDEO_STORE, "readonly");
    const req = tx.objectStore(VIDEO_STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function dbDeleteVideo(id) {
  const db = await openVideoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(VIDEO_STORE, "readwrite");
    tx.objectStore(VIDEO_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// Returns cached data if present and younger than maxAgeMs, else null — callers
// decide what to do on a miss (fetch fresh, then dbSetCache the result).
async function dbGetFreshCache(id, maxAgeMs) {
  const record = await dbGetCache(id);
  if (!record) return null;
  if (Date.now() - record.fetchedAt > maxAgeMs) return null;
  return record.data;
}

// iPhones shoot HEIC by default and browsers (Safari included, inconsistently)
// largely can't render it in an <img> tag, so convert to JPEG before it's
// ever staged or stored. MIME type detection for HEIC is unreliable across
// browsers/OSes, so the file extension is checked too.
function isHeicFile(file) {
  return /image\/hei[cf]/i.test(file.type) || /\.(heic|heif)$/i.test(file.name || "");
}

async function convertHeicIfNeeded(file) {
  if (!isHeicFile(file)) return file;
  if (!window.HeicTo) return file;
  try {
    const blob = await window.HeicTo({ blob: file, type: "image/jpeg", quality: 0.85 });
    return new File([blob], file.name.replace(/\.(heic|heif)$/i, ".jpg"), { type: "image/jpeg" });
  } catch (err) {
    return file;
  }
}

function formatBytes(bytes) {
  if (!bytes) return "0 B";
  const units = ["B", "KB", "MB", "GB"];
  const i = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
  return `${(bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}

function extFromType(type) {
  if (!type) return "mp4";
  const parts = type.split("/");
  return parts[1] ? parts[1].split(";")[0] : "mp4";
}

async function shareVideoFile(video, onStatus) {
  const file = new File([video.blob], `${video.title || "video"}.${extFromType(video.type)}`, { type: video.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: video.title || "Fitness video" });
      onStatus({ type: "success", message: "Shared — finish posting inside TikTok." });
    } catch (err) {
      if (err && err.name !== "AbortError") {
        onStatus({ type: "error", message: "Share was cancelled or failed." });
      }
    }
    return;
  }
  const url = URL.createObjectURL(video.blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  onStatus({ type: "success", message: "Native share isn't available here — downloaded instead. Upload it in TikTok." });
}

/* ----------------------------------------------------------------------
   SUGGESTIONS ENGINE
   Pure, local, rule-based — no external calls or API keys. Reads profile,
   goal progress, and event dates to produce a short list of nudges.
---------------------------------------------------------------------- */

function generateSuggestions({ fitness, golf, trackers, profile, events, history, weather, watchlist, newYoutubeCount }) {
  const suggestions = [];

  if (newYoutubeCount > 0) {
    suggestions.push({
      id: "s-youtube",
      priority: "info",
      text: `${newYoutubeCount} new video${newYoutubeCount === 1 ? "" : "s"} from channels you're subscribed to.`,
    });
  }

  if (profile.topPicks && profile.topPicks.length > 0) {
    const pick = profile.topPicks[0];
    const free = findFreeWeekendDay(events);
    if (free) {
      const dayWeather = weather && weather.days ? weather.days.find((d) => d.date === free.date) : null;
      if (dayWeather) {
        const info = weatherInfo(dayWeather.code);
        if (info.outdoor) {
          suggestions.push({
            id: "s-freeday",
            priority: "info",
            text: `You're free ${free.label} and it's looking ${info.label.toLowerCase()} (${dayWeather.tempMax}°) — good day for ${pick.toLowerCase()}, your top pick from the quiz.`,
          });
        } else {
          suggestions.push({
            id: "s-freeday",
            priority: "info",
            text: `You're free ${free.label}, but ${info.label.toLowerCase()} is expected (${dayWeather.tempMax}°) — might be worth an indoor alternative to ${pick.toLowerCase()}.`,
          });
        }
      } else {
        suggestions.push({
          id: "s-freeday",
          priority: "info",
          text: `You're free ${free.label} — good day for ${pick.toLowerCase()}, your top pick from the quiz.`,
        });
      }
    } else {
      suggestions.push({
        id: "s-toppick",
        priority: "info",
        text: `You ranked ${pick.toLowerCase()} as a top pick in the quiz — worth making time for it this week.`,
      });
    }
  }

  trackers.forEach((t) => {
    const progress = computeGoalProgress(t.value, t.target);
    const trend = analyzeTrend((history.trackers && history.trackers[t.id]) || []);
    if (progress !== null && trend && trend.status === "flat") {
      suggestions.push({
        id: `s-tracker-${t.id}`,
        priority: "attention",
        text: `${t.label} has held at ${trend.last} for ${trend.spanDays} days (goal ${t.target}) — a push this week would help.`,
      });
    } else if (progress !== null && progress < 50) {
      suggestions.push({
        id: `s-tracker-${t.id}`,
        priority: "attention",
        text: `${t.label} is at ${progress}% of your goal (${t.value}/${t.target}) — a push this week would help.`,
      });
    }
  });

  events.forEach((ev) => {
    const days = daysUntil(ev.date);
    if (days >= 0 && days <= 10) {
      suggestions.push({
        id: `s-event-${ev.id}`,
        priority: days <= 3 ? "urgent" : "attention",
        text: `${ev.title} is in ${days} day${days === 1 ? "" : "s"} (${ev.detail}) — good time to start prepping.`,
      });
    }
  });

  const weightTrend = analyzeTrend(history.fitness, { flatThreshold: 1 });
  if (fitness.currentWeight > fitness.targetWeight) {
    const diff = Math.round((fitness.currentWeight - fitness.targetWeight) * 10) / 10;
    if (weightTrend && weightTrend.status === "flat") {
      suggestions.push({
        id: "s-fitness",
        priority: "attention",
        text: `Weight's held steady around ${fitness.currentWeight} lbs for ${weightTrend.spanDays} days — might be worth mixing up your routine.`,
      });
    } else if (weightTrend && weightTrend.status === "down") {
      suggestions.push({
        id: "s-fitness",
        priority: "positive",
        text: `Down ${Math.abs(weightTrend.delta)} lbs over the last ${weightTrend.spanDays} days — keep it up, ${diff} lbs to go.`,
      });
    } else {
      suggestions.push({
        id: "s-fitness",
        priority: "attention",
        text: `You're ${diff} lbs from your target weight — a cardio session this week would help close the gap.`,
      });
    }
  } else {
    suggestions.push({
      id: "s-fitness",
      priority: "positive",
      text: `You've hit your target weight — nice work. Consider setting a new one.`,
    });
  }

  const handicapTrend = analyzeTrend(history.golf, { flatThreshold: 0.3 });
  if (profile.interests.some((i) => i.toLowerCase().includes("golf"))) {
    if (handicapTrend && handicapTrend.status === "flat") {
      suggestions.push({
        id: "s-golf",
        priority: "attention",
        text: `Handicap's been steady at ${golf.handicap} for ${handicapTrend.spanDays} days — a lesson or range session could break the plateau.`,
      });
    } else if (handicapTrend && handicapTrend.status === "down") {
      suggestions.push({
        id: "s-golf",
        priority: "positive",
        text: `Handicap's down ${Math.abs(handicapTrend.delta)} over the last ${handicapTrend.spanDays} days, now at ${golf.handicap} — booking another round would keep the momentum.`,
      });
    } else {
      suggestions.push({
        id: "s-golf",
        priority: "info",
        text: `Handicap is sitting at ${golf.handicap} — booking a round would keep it sharp.`,
      });
    }
  }

  if (profile.genres && profile.genres.length > 0) {
    const top = profile.genres.slice(0, 2).join(" and ");
    const pick = suggestTitles(profile.genres, watchlist || [], 1)[0];
    suggestions.push({
      id: "s-genre",
      priority: "info",
      text: pick
        ? `You're into ${top} — "${pick.title}" (${pick.type}) could be a good pick this week.`
        : `You're into ${top} — worth checking what's new to watch there this week.`,
    });
  }

  const trackedLabels = trackers.map((t) => t.label.toLowerCase());
  profile.interests.forEach((interest) => {
    const hasTracker = trackedLabels.some((l) => l.includes(interest.toLowerCase()));
    if (!hasTracker && !["golf", "fitness"].includes(interest.toLowerCase())) {
      suggestions.push({
        id: `s-interest-${interest}`,
        priority: "info",
        text: `You listed "${interest}" as an interest — want to add a tracker for it?`,
      });
    }
  });

  return suggestions.slice(0, 5);
}

function GolfRoundLog({ theme, title, rounds, setRounds, delay }) {
  const emptyForm = {
    date: new Date().toISOString().slice(0, 10),
    course: "",
    par: "72",
    front9: "",
    back9: "",
    fairwayHits: "",
    gir: "",
    avgDrivingDistance: "",
    totalPutts: "",
    scrambling: "",
    sandSaves: "",
  };
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(emptyForm);
  const [photoFiles, setPhotoFiles] = useState([]);
  const [saving, setSaving] = useState(false);
  const [convertingPhotos, setConvertingPhotos] = useState(false);
  const [expandedId, setExpandedId] = useState(null);
  const [roundPhotos, setRoundPhotos] = useState({});
  const photoInputRef = useRef(null);

  function updateForm(key, value) {
    setForm((f) => ({ ...f, [key]: value }));
  }

  async function handlePhotoSelect(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    setConvertingPhotos(true);
    try {
      const converted = await Promise.all(files.map(convertHeicIfNeeded));
      setPhotoFiles((prev) => [...prev, ...converted].slice(0, 6));
    } finally {
      setConvertingPhotos(false);
    }
  }

  function removeStagedPhoto(idx) {
    setPhotoFiles((prev) => prev.filter((_, i) => i !== idx));
  }

  async function addRound() {
    if (!form.course.trim() || form.front9 === "" || form.back9 === "") return;
    setSaving(true);
    try {
      const id = "gr" + Date.now() + Math.random().toString(36).slice(2, 6);
      const photoIds = [];
      for (const file of photoFiles) {
        const photoId = "gp" + Date.now() + Math.random().toString(36).slice(2, 8);
        await dbPutPhoto({ id: photoId, roundId: id, blob: file, createdAt: Date.now() });
        photoIds.push(photoId);
      }
      const numOrNull = (v) => (v === "" ? null : Number(v));
      const round = {
        id,
        date: form.date || new Date().toISOString().slice(0, 10),
        course: form.course.trim(),
        par: Number(form.par) || 72,
        front9: Number(form.front9) || 0,
        back9: Number(form.back9) || 0,
        fairwayHits: numOrNull(form.fairwayHits),
        gir: numOrNull(form.gir),
        avgDrivingDistance: numOrNull(form.avgDrivingDistance),
        totalPutts: numOrNull(form.totalPutts),
        scrambling: numOrNull(form.scrambling),
        sandSaves: numOrNull(form.sandSaves),
        photoIds,
      };
      setRounds([round, ...rounds]);
      setForm(emptyForm);
      setPhotoFiles([]);
      setShowForm(false);
    } finally {
      setSaving(false);
    }
  }

  async function removeRound(id) {
    const round = rounds.find((r) => r.id === id);
    if (round && round.photoIds && round.photoIds.length > 0) {
      await Promise.all(round.photoIds.map((pid) => dbDeletePhoto(pid)));
    }
    setRounds(rounds.filter((r) => r.id !== id));
  }

  async function loadPhotosFor(round) {
    if (roundPhotos[round.id] || !round.photoIds || round.photoIds.length === 0) return;
    const records = await dbGetPhotosByIds(round.photoIds);
    const withUrls = records.map((r) => ({ id: r.id, url: URL.createObjectURL(r.blob) }));
    setRoundPhotos((prev) => ({ ...prev, [round.id]: withUrls }));
  }

  function toggleExpand(round) {
    if (expandedId === round.id) {
      setExpandedId(null);
      return;
    }
    setExpandedId(round.id);
    loadPhotosFor(round);
  }

  const sorted = rounds.slice().sort((a, b) => b.date.localeCompare(a.date));
  const scores = rounds.map((r) => r.front9 + r.back9);
  const avgScore = scores.length ? Math.round((scores.reduce((s, v) => s + v, 0) / scores.length) * 10) / 10 : null;
  const bestScore = scores.length ? Math.min(...scores) : null;

  const inputStyle = {
    background: theme.inputBg,
    border: `1px solid ${theme.inputBorder}`,
    borderRadius: "8px",
    color: theme.inputText,
    padding: "8px 10px",
    fontSize: "13px",
    minWidth: 0,
    width: "100%",
    "--focus-ring": theme.accentSoft,
    "--focus-border": theme.accent,
  };
  const fieldLabelStyle = {
    fontSize: "10px",
    fontWeight: 700,
    letterSpacing: "0.05em",
    textTransform: "uppercase",
    color: theme.textFaint,
    marginBottom: "4px",
    display: "block",
  };

  function Field({ label, children }) {
    return (
      <div style={{ minWidth: 0 }}>
        <span style={fieldLabelStyle}>{label}</span>
        {children}
      </div>
    );
  }

  return (
    <Card theme={theme} delay={delay}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "10px", flexWrap: "wrap", gap: "8px" }}>
        <SectionLabel theme={theme} icon={<IconGolf />} style={{ marginBottom: 0 }}>
          {title}
        </SectionLabel>
        <button
          onClick={() => setShowForm((s) => !s)}
          className="v-btn"
          style={{ fontSize: "11.5px", fontWeight: 700, color: theme.textMuted, background: "transparent", border: `1px solid ${theme.divider}`, borderRadius: "999px", padding: "4px 10px" }}
        >
          {showForm ? "Cancel" : "+ Add Round"}
        </button>
      </div>

      {rounds.length > 0 && (
        <div style={{ display: "flex", gap: "16px", fontSize: "12px", color: theme.textFaint, marginBottom: "16px" }}>
          <span>{rounds.length} round{rounds.length === 1 ? "" : "s"}</span>
          {avgScore !== null && (
            <span>
              avg <span className="v-tabular" style={{ color: theme.text, fontWeight: 700 }}>{avgScore}</span>
            </span>
          )}
          {bestScore !== null && (
            <span>
              best <span className="v-tabular" style={{ color: theme.text, fontWeight: 700 }}>{bestScore}</span>
            </span>
          )}
        </div>
      )}

      {showForm && (
        <div style={{ background: theme.accentSoft, border: `1px solid ${theme.divider}`, borderRadius: "12px", padding: "14px", marginBottom: "18px" }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: "10px", marginBottom: "10px" }}>
            <Field label="Course">
              <input value={form.course} onChange={(e) => updateForm("course", e.target.value)} className="v-input" style={inputStyle} placeholder="Ballyhack Golf Club" />
            </Field>
            <Field label="Date">
              <input type="date" value={form.date} onChange={(e) => updateForm("date", e.target.value)} className="v-input" style={inputStyle} />
            </Field>
            <Field label="Par">
              <input type="number" value={form.par} onChange={(e) => updateForm("par", e.target.value)} className="v-input v-tabular" style={inputStyle} />
            </Field>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: "10px", marginBottom: "10px" }}>
            <Field label="Front 9">
              <input type="number" value={form.front9} onChange={(e) => updateForm("front9", e.target.value)} className="v-input v-tabular" style={inputStyle} placeholder="42" />
            </Field>
            <Field label="Back 9">
              <input type="number" value={form.back9} onChange={(e) => updateForm("back9", e.target.value)} className="v-input v-tabular" style={inputStyle} placeholder="42" />
            </Field>
            <Field label="Total putts">
              <input type="number" value={form.totalPutts} onChange={(e) => updateForm("totalPutts", e.target.value)} className="v-input v-tabular" style={inputStyle} placeholder="30" />
            </Field>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: "10px", marginBottom: "10px" }}>
            <Field label="Fairway hits %">
              <input type="number" value={form.fairwayHits} onChange={(e) => updateForm("fairwayHits", e.target.value)} className="v-input v-tabular" style={inputStyle} placeholder="43" />
            </Field>
            <Field label="GIR %">
              <input type="number" value={form.gir} onChange={(e) => updateForm("gir", e.target.value)} className="v-input v-tabular" style={inputStyle} placeholder="33" />
            </Field>
            <Field label="Avg drive (yd)">
              <input type="number" value={form.avgDrivingDistance} onChange={(e) => updateForm("avgDrivingDistance", e.target.value)} className="v-input v-tabular" style={inputStyle} placeholder="244" />
            </Field>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: "10px", marginBottom: "12px" }}>
            <Field label="Scrambling %">
              <input type="number" value={form.scrambling} onChange={(e) => updateForm("scrambling", e.target.value)} className="v-input v-tabular" style={inputStyle} placeholder="75" />
            </Field>
            <Field label="Sand saves %">
              <input type="number" value={form.sandSaves} onChange={(e) => updateForm("sandSaves", e.target.value)} className="v-input v-tabular" style={inputStyle} placeholder="50" />
            </Field>
          </div>

          <span style={fieldLabelStyle}>Scorecard photos (optional)</span>
          <div style={{ display: "flex", flexWrap: "wrap", gap: "8px", marginBottom: "10px" }}>
            {photoFiles.map((f, i) => (
              <div key={i} style={{ position: "relative", width: "52px", height: "52px", borderRadius: "8px", overflow: "hidden", border: `1px solid ${theme.divider}` }}>
                <img src={URL.createObjectURL(f)} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
                <button
                  onClick={() => removeStagedPhoto(i)}
                  title="Remove"
                  className="v-btn"
                  style={{ position: "absolute", top: "2px", right: "2px", width: "16px", height: "16px", borderRadius: "50%", border: "none", background: "rgba(0,0,0,0.6)", color: "#fff", fontSize: "10px", lineHeight: "16px", textAlign: "center", padding: 0 }}
                >
                  ×
                </button>
              </div>
            ))}
            <button
              onClick={() => photoInputRef.current && photoInputRef.current.click()}
              disabled={convertingPhotos}
              className="v-btn"
              style={{ width: "52px", height: "52px", borderRadius: "8px", border: `1px dashed ${theme.inputBorder}`, background: "transparent", color: theme.textMuted, fontSize: convertingPhotos ? "9px" : "20px", fontWeight: convertingPhotos ? 700 : 400, opacity: convertingPhotos ? 0.7 : 1 }}
            >
              {convertingPhotos ? "Loading…" : "+"}
            </button>
            <input ref={photoInputRef} type="file" accept="image/*,.heic,.heif" multiple onChange={handlePhotoSelect} style={{ display: "none" }} />
          </div>

          <button
            onClick={addRound}
            disabled={saving}
            className="v-btn"
            style={{ padding: "9px 18px", borderRadius: "8px", border: "none", background: theme.accent, color: theme.accentText, fontSize: "13px", fontWeight: 700, opacity: saving ? 0.6 : 1 }}
          >
            {saving ? "Saving…" : "Save Round"}
          </button>
        </div>
      )}

      {sorted.length > 0 ? (
        <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
          {sorted.map((r) => {
            const total = r.front9 + r.back9;
            const toPar = total - r.par;
            const toParLabel = toPar === 0 ? "E" : toPar > 0 ? `+${toPar}` : `${toPar}`;
            const toParColor = toPar > 0 ? theme.danger : toPar < 0 ? theme.positive : theme.textMuted;
            const expanded = expandedId === r.id;
            const metrics = [
              ["Fairway hits", r.fairwayHits, "%"],
              ["GIR", r.gir, "%"],
              ["Avg drive", r.avgDrivingDistance, "yd"],
              ["Putts", r.totalPutts, ""],
              ["Scrambling", r.scrambling, "%"],
              ["Sand saves", r.sandSaves, "%"],
            ].filter(([, v]) => v !== null && v !== undefined);
            return (
              <div key={r.id} style={{ background: theme.accentSoft, border: `1px solid ${theme.divider}`, borderRadius: "10px", overflow: "hidden" }}>
                <div onClick={() => toggleExpand(r)} style={{ display: "flex", alignItems: "center", gap: "10px", padding: "10px 12px", cursor: "pointer" }}>
                  <span style={{ fontSize: "11px", color: theme.textFaint, flexShrink: 0, width: "44px" }}>
                    {r.date.slice(5).replace("-", "/")}
                  </span>
                  <span style={{ flex: 1, minWidth: 0, fontSize: "13.5px", fontWeight: 600, color: theme.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {r.course}
                  </span>
                  <span className="v-tabular" style={{ fontSize: "12px", color: theme.textFaint, flexShrink: 0 }}>
                    {r.front9}-{r.back9}
                  </span>
                  <span className="v-tabular" style={{ fontSize: "15px", fontWeight: 700, color: theme.text, flexShrink: 0 }}>
                    {total} <span style={{ fontSize: "12px", color: toParColor }}>({toParLabel})</span>
                  </span>
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      removeRound(r.id);
                    }}
                    title="Remove"
                    className="v-btn"
                    style={{ width: "18px", height: "18px", borderRadius: "50%", border: "none", background: theme.dangerSoft, color: theme.danger, fontSize: "11px", lineHeight: "18px", textAlign: "center", padding: 0, flexShrink: 0 }}
                  >
                    ×
                  </button>
                </div>
                {expanded && (
                  <div style={{ padding: "0 12px 14px", borderTop: `1px solid ${theme.divider}` }}>
                    {metrics.length > 0 && (
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(90px, 1fr))", gap: "10px", marginTop: "12px" }}>
                        {metrics.map(([label, value, suffix]) => (
                          <div key={label}>
                            <div style={fieldLabelStyle}>{label}</div>
                            <div className="v-tabular" style={{ fontSize: "14px", fontWeight: 700, color: theme.text }}>
                              {value}
                              {suffix}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                    {roundPhotos[r.id] && roundPhotos[r.id].length > 0 && (
                      <div style={{ display: "flex", flexWrap: "wrap", gap: "8px", marginTop: "12px" }}>
                        {roundPhotos[r.id].map((p) => (
                          <a key={p.id} href={p.url} target="_blank" rel="noopener noreferrer">
                            <img src={p.url} alt="" style={{ width: "64px", height: "64px", objectFit: "cover", borderRadius: "8px", border: `1px solid ${theme.divider}`, display: "block" }} />
                          </a>
                        ))}
                      </div>
                    )}
                  </div>
                )}

function TikTokConnect({ theme, integrations, setIntegrations }) {
  const [connected, setConnected] = useState(null);
  const [statusMsg, setStatusMsg] = useState(null);
  const [showConfig, setShowConfig] = useState(false);

  const backendUrl = integrations.tiktokBackendUrl.trim().replace(/\/$/, "");

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const tiktokParam = params.get("tiktok");
    if (tiktokParam === "connected") {
      setStatusMsg({ type: "success", message: "TikTok connected." });
      setConnected(true);
    } else if (tiktokParam === "error") {
      setStatusMsg({ type: "error", message: `Connection failed (${params.get("reason") || "unknown"}).` });
    }
    if (tiktokParam) {
      params.delete("tiktok");
      params.delete("reason");
      const newSearch = params.toString();
      const newUrl = window.location.pathname + (newSearch ? `?${newSearch}` : "") + window.location.hash;
      window.history.replaceState({}, "", newUrl);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    if (!backendUrl) {
      setConnected(false);
      return;
    }
    let cancelled = false;
    fetch(`${backendUrl}/.netlify/functions/tiktok-status`)
      .then((r) => r.json())
      .then((data) => {
        if (!cancelled) setConnected(!!data.connected);
      })
      .catch(() => {
        if (!cancelled) setConnected(false);
      });
    return () => {
      cancelled = true;
    };
  }, [backendUrl]);

  function connect() {
    if (!integrations.tiktokClientKey.trim() || !backendUrl) {
      setStatusMsg({ type: "error", message: "Add your Client Key and backend URL first." });
      setShowConfig(true);
      return;
    }
    const redirectUri = `${backendUrl}/.netlify/functions/tiktok-callback`;
    const state = Math.random().toString(36).slice(2);
    try {
      sessionStorage.setItem("tiktok_oauth_state", state);
    } catch (e) {
      /* ignore — low-stakes for a single-user personal app */
    }
    const authUrl =
      "https://www.tiktok.com/v2/auth/authorize/" +
      `?client_key=${encodeURIComponent(integrations.tiktokClientKey.trim())}` +
      "&scope=video.publish" +
      "&response_type=code" +
      `&redirect_uri=${encodeURIComponent(redirectUri)}` +
      `&state=${state}`;
    window.location.href = authUrl;
  }

  async function disconnect() {
    if (!backendUrl) return;
    try {
      await fetch(`${backendUrl}/.netlify/functions/tiktok-disconnect`, { method: "POST" });
      setConnected(false);
      setStatusMsg({ type: "success", message: "Disconnected." });
    } catch (err) {
      setStatusMsg({ type: "error", message: "Couldn't disconnect — try again." });
    }
  }

  const inputStyle = {
    width: "100%",
    background: theme.inputBg,
    border: `1px solid ${theme.inputBorder}`,
    borderRadius: "8px",
    color: theme.inputText,
    padding: "8px 10px",
    fontSize: "12.5px",
    "--focus-ring": theme.accentSoft,
    "--focus-border": theme.accent,
  };

  return (
    <div
      style={{
        background: theme.accentSoft,
        border: `1px solid ${theme.divider}`,
        borderRadius: "12px",
        padding: "14px 16px",
        marginBottom: "18px",
      }}
    >
      <div
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          gap: "10px",
          flexWrap: "wrap",
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
          <span
            style={{
              width: "9px",
              height: "9px",
              borderRadius: "50%",
              background: connected ? theme.positive : theme.textFaint,
              flexShrink: 0,
            }}
          />
          <span style={{ fontSize: "13px", fontWeight: 700, color: theme.text }}>
            {connected === null
              ? "Checking TikTok connection…"
              : connected
              ? "TikTok connected"
              : "TikTok not connected"}
          </span>
        </div>
        <div style={{ display: "flex", gap: "8px" }}>
          <button
            onClick={() => setShowConfig((s) => !s)}
            className="v-btn"
            style={{
              fontSize: "12px",
              fontWeight: 700,
              color: theme.textMuted,
              background: "transparent",
              border: `1px solid ${theme.divider}`,
              borderRadius: "8px",
              padding: "6px 12px",
            }}
          >
            {showConfig ? "Hide setup" : "Setup"}
          </button>
          {connected ? (
            <button
              onClick={disconnect}
              className="v-btn"
              style={{
                fontSize: "12px",
                fontWeight: 700,
                color: theme.danger,
                background: "transparent",
                border: `1px solid ${theme.inputBorder}`,
                borderRadius: "8px",
                padding: "6px 12px",
              }}
            >
              Disconnect
            </button>
          ) : (
            <button
              onClick={connect}
              className="v-btn"
              style={{
                fontSize: "12px",
                fontWeight: 700,
                color: theme.accentText,
                background: theme.accent,
                border: "none",
                borderRadius: "8px",
                padding: "6px 12px",
              }}
            >
              Connect TikTok Account
            </button>
          )}
        </div>
      </div>

      {showConfig && (
        <div style={{ marginTop: "12px", display: "flex", flexDirection: "column", gap: "8px" }}>
          <input
            placeholder="TikTok Client Key"
            value={integrations.tiktokClientKey}
            onChange={(e) => setIntegrations({ ...integrations, tiktokClientKey: e.target.value })}
            className="v-input"
            style={inputStyle}
          />
          <input
            placeholder="Backend URL (e.g. https://your-site.netlify.app)"
            value={integrations.tiktokBackendUrl}
            onChange={(e) => setIntegrations({ ...integrations, tiktokBackendUrl: e.target.value })}
            className="v-input"
            style={inputStyle}
          />
        </div>
      )}

      {statusMsg && (
        <div
          style={{
            marginTop: "10px",
            fontSize: "12px",
            fontWeight: 600,
            color: statusMsg.type === "error" ? theme.danger : theme.positive,
          }}
        >
          {statusMsg.message}
        </div>
      )}
    </div>
  );
}

function AgendaStripSection({ theme, events, delay }) {

    d.setDate(d.getDate() + i);
    const iso = d.toISOString().slice(0, 10);
    days.push({
      iso,
      isToday: i === 0,
      label: d.toLocaleDateString(undefined, { weekday: "short" }),
      dateLabel: d.toLocaleDateString(undefined, { month: "short", day: "numeric" }),
      items: events.filter((e) => e.date === iso),

  return (
    <Card theme={theme} delay={delay}>
      <SectionLabel theme={theme} icon={<IconCalendar />}>7-Day Agenda</SectionLabel>

          overflowX: "auto",
          paddingBottom: "4px",

        {days.map((d) => (

              display: "flex",
              flexDirection: "column",
              gap: "6px",

function TransactionsSection({ theme, transactions, setTransactions, categoryOptions, delay }) {
  const [date, setDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [merchant, setMerchant] = useState("");
  const [amount, setAmount] = useState("");
  const [category, setCategory] = useState("");
  const [showPaste, setShowPaste] = useState(false);
  const [pasteText, setPasteText] = useState("");
  const [importStatus, setImportStatus] = useState(null);
  const [pdfBusy, setPdfBusy] = useState(false);
  const pdfInputRef = useRef(null);

  function applyImport(parsed) {
    if (parsed.length === 0) {
      setImportStatus({ type: "error", message: "Couldn't find any transactions in that — expecting a date, description, and amount per line." });
      return;
    }
    setTransactions([...parsed, ...transactions]);
    setImportStatus({
      type: "success",
      message: `Imported ${parsed.length} transaction${parsed.length === 1 ? "" : "s"} — double-check the guessed categories (and dates, for PDF imports) below.`,
    });
    setTimeout(() => setImportStatus(null), 8000);
  }

  async function handlePdfUpload(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setPdfBusy(true);
    setImportStatus(null);
    try {
      const text = await extractPdfText(file);
      applyImport(parseStatementText(text));
    } catch (err) {
      setImportStatus({ type: "error", message: err.message || "Couldn't read that PDF." });
    } finally {
      setPdfBusy(false);
    }
  }

  function addTransaction() {
    const trimmedMerchant = merchant.trim();
    if (!trimmedMerchant || !amount) return;
    const tx = {
      id: "tx" + Date.now() + Math.random().toString(36).slice(2, 8),
      date: date || new Date().toISOString().slice(0, 10),
      merchant: trimmedMerchant,
      amount: Math.abs(Number(amount)) || 0,
      category: category.trim() || guessCategory(trimmedMerchant),
    };
    setTransactions([tx, ...transactions]);
    setMerchant("");
    setAmount("");
    setCategory("");
  }

  function removeTransaction(id) {
    setTransactions(transactions.filter((t) => t.id !== id));
  }

  function updateTransactionCategory(id, value) {
    setTransactions(transactions.map((t) => (t.id === id ? { ...t, category: value } : t)));
  }

  function importPasted() {
    applyImport(parseStatementText(pasteText));
    setPasteText("");
    setShowPaste(false);
  }

  const monthPrefix = new Date().toISOString().slice(0, 7);
  const monthTransactions = transactions.filter((t) => t.date.startsWith(monthPrefix));
  const totalThisMonth = monthTransactions.reduce((s, t) => s + t.amount, 0);

  const byCategory = {};
  monthTransactions.forEach((t) => {
    byCategory[t.category] = (byCategory[t.category] || 0) + t.amount;
  });
  const categoryBreakdown = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
  const maxCategorySpend = categoryBreakdown.length > 0 ? categoryBreakdown[0][1] : 0;

  const sorted = transactions.slice().sort((a, b) => b.date.localeCompare(a.date));
  const allCategoryOptions = Array.from(new Set([...(categoryOptions || []), ...transactions.map((t) => t.category)]));

  const inputStyle = {
    background: theme.inputBg,
    border: `1px solid ${theme.inputBorder}`,
    borderRadius: "8px",
    color: theme.inputText,
    padding: "9px 12px",
    fontSize: "14px",
    minWidth: 0,
    "--focus-ring": theme.accentSoft,
    "--focus-border": theme.accent,
  };

  return (
    <Card theme={theme} delay={delay}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "6px", flexWrap: "wrap", gap: "8px" }}>
        <SectionLabel theme={theme} icon={<IconReceipt />} style={{ marginBottom: 0 }}>Transactions</SectionLabel>
        <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
          <button
            onClick={() => pdfInputRef.current && pdfInputRef.current.click()}
            disabled={pdfBusy}
            className="v-btn"
            style={{ fontSize: "11.5px", fontWeight: 700, color: theme.textMuted, background: "transparent", border: `1px solid ${theme.divider}`, borderRadius: "999px", padding: "4px 10px" }}
          >
            {pdfBusy ? "Reading PDF…" : "Upload PDF"}
          </button>
          <input ref={pdfInputRef} type="file" accept="application/pdf,.pdf" onChange={handlePdfUpload} style={{ display: "none" }} />
          <button
            onClick={() => setShowPaste((s) => !s)}
            className="v-btn"
            style={{ fontSize: "11.5px", fontWeight: 700, color: theme.textMuted, background: "transparent", border: `1px solid ${theme.divider}`, borderRadius: "999px", padding: "4px 10px" }}
          >
            {showPaste ? "Cancel" : "Paste statement"}
          </button>
        </div>
      </div>
      <div style={{ fontSize: "11px", color: theme.textFaint, marginBottom: "12px", lineHeight: 1.4 }}>
        PDF parsing runs entirely in your browser — the file is never uploaded anywhere.
      </div>
      <div style={{ display: "flex", gap: "14px", fontSize: "12px", color: theme.textFaint, marginBottom: "16px" }}>
        <span>
          <span className="v-tabular" style={{ color: theme.text, fontWeight: 700 }}>${totalThisMonth.toLocaleString()}</span> this month
        </span>
        <span>{monthTransactions.length} transaction{monthTransactions.length === 1 ? "" : "s"}</span>
      </div>

      {showPaste && (
        <div style={{ marginBottom: "16px" }}>
          <textarea
            value={pasteText}
            onChange={(e) => setPasteText(e.target.value)}
            placeholder={"Paste rows copied from your bank or card statement export — one transaction per line, e.g.\n08/03/2026, STARBUCKS #4521, 5.40\n08/04/2026, AMAZON.COM, 32.10"}
            className="v-input"
            style={{
              width: "100%",
              minHeight: "90px",
              resize: "vertical",
              background: theme.inputBg,
              border: `1px solid ${theme.inputBorder}`,
              borderRadius: "10px",
              color: theme.inputText,
              padding: "12px",
              fontSize: "12.5px",
              lineHeight: 1.5,
              fontFamily: "monospace",
              marginBottom: "10px",
              "--focus-ring": theme.accentSoft,
              "--focus-border": theme.accent,
            }}
          />
          <button
            onClick={importPasted}
            className="v-btn"
            style={{ padding: "8px 16px", borderRadius: "8px", border: "none", background: theme.accent, color: theme.accentText, fontSize: "13px", fontWeight: 700 }}
          >
            Import
          </button>
        </div>
      )}
      {importStatus && (
        <div style={{ fontSize: "12px", fontWeight: 600, color: importStatus.type === "error" ? theme.danger : theme.positive, marginBottom: "14px" }}>
          {importStatus.message}
        </div>
      )}

      {categoryBreakdown.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: "8px", marginBottom: "18px" }}>
          {categoryBreakdown.map(([cat, amt]) => (
            <div key={cat}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: "12px", color: theme.textMuted, marginBottom: "3px" }}>
                <span>{cat}</span>
                <span className="v-tabular">${amt.toLocaleString()}</span>
              </div>
              <div style={{ height: "5px", borderRadius: "999px", background: theme.progressTrack, overflow: "hidden" }}>
                <div
                  style={{
                    height: "100%",
                    width: `${maxCategorySpend ? Math.round((amt / maxCategorySpend) * 100) : 0}%`,
                    borderRadius: "999px",
                    background: theme.progressFill,
                    backgroundImage: typeof theme.progressFill === "string" && theme.progressFill.includes("gradient") ? theme.progressFill : undefined,
                  }}
                />
              </div>
            </div>
          ))}
        </div>
      )}

      {sorted.length > 0 ? (
        <div className="v-scroll" style={{ display: "flex", flexDirection: "column", gap: "6px", maxHeight: "220px", overflowY: "auto", marginBottom: "18px" }}>
          {sorted.map((t) => (
            <div
              key={t.id}
              style={{ display: "flex", alignItems: "center", gap: "8px", background: theme.accentSoft, border: `1px solid ${theme.divider}`, borderRadius: "8px", padding: "8px 10px" }}
            >
              <span style={{ fontSize: "11px", color: theme.textFaint, flexShrink: 0, width: "44px" }}>
                {t.date.slice(5).replace("-", "/")}
              </span>
              <span style={{ flex: 1, minWidth: 0, fontSize: "13px", color: theme.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {t.merchant}
              </span>
              <input
                value={t.category}
                onChange={(e) => updateTransactionCategory(t.id, e.target.value)}
                list="v-tx-categories"
                className="v-input"
                style={{ width: "100px", fontSize: "11.5px", color: theme.textMuted, background: "transparent", border: "none", padding: "2px 0", flexShrink: 0, "--focus-ring": theme.accentSoft, "--focus-border": "transparent" }}
              />
              <span className="v-tabular" style={{ fontSize: "13px", fontWeight: 700, color: theme.text, flexShrink: 0 }}>
                ${t.amount.toLocaleString()}
              </span>
              <button
                onClick={() => removeTransaction(t.id)}
                title="Remove"
                className="v-btn"
                style={{ width: "18px", height: "18px", borderRadius: "50%", border: "none", background: theme.dangerSoft, color: theme.danger, fontSize: "11px", lineHeight: "18px", textAlign: "center", padding: 0, flexShrink: 0 }}
              >
                ×
              </button>
            </div>
          ))}
        </div>
      ) : (
        <div style={{ fontSize: "13px", color: theme.textFaint, marginBottom: "18px" }}>
          No transactions yet — add one below or paste in a statement.
        </div>
      )}

      <datalist id="v-tx-categories">
        {allCategoryOptions.map((c) => (
          <option key={c} value={c} />
        ))}
      </datalist>

      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap" }}>
        <input
          type="date"
          value={date}
          onChange={(e) => setDate(e.target.value)}
          className="v-input"
          style={{ ...inputStyle, flex: "1 1 130px" }}
        />
        <input
          placeholder="Merchant"
          value={merchant}
          onChange={(e) => setMerchant(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addTransaction()}
          className="v-input"
          style={{ ...inputStyle, flex: "2 1 140px" }}
        />
        <input
          placeholder="Amount $"
          type="number"
          value={amount}
          onChange={(e) => setAmount(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addTransaction()}
          className="v-input"
          style={{ ...inputStyle, flex: "1 1 90px" }}
        />
        <input
          placeholder="Category (optional)"
          value={category}
          onChange={(e) => setCategory(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addTransaction()}
          list="v-tx-categories"
          className="v-input"
          style={{ ...inputStyle, flex: "1 1 130px" }}
        />
        <button
          onClick={addTransaction}
          className="v-btn"
          style={{ padding: "9px 16px", borderRadius: "8px", border: "none", background: theme.accent, color: theme.accentText, fontSize: "13px", fontWeight: 700, flexShrink: 0 }}
        >
          Add
        </button>
      </div>
    </Card>
  );
}

function JournalSection({ theme, data, setData, delay }) {
  const today = new Date().toISOString().slice(0, 10);
  const todayEntry = data.find((e) => e.date === today);
  const past = data.filter((e) => e.date !== today).sort((a, b) => b.date.localeCompare(a.date));

  function updateToday(text) {
    const idx = data.findIndex((e) => e.date === today);
    if (idx === -1) {
      setData([...data, { date: today, text }]);
    } else {
      setData(data.map((e) => (e.date === today ? { ...e, text } : e)));
    }
  }

  function removeEntry(date) {
    setData(data.filter((e) => e.date !== date));
  }

  return (
    <Card theme={theme} delay={delay}>
      <SectionLabel theme={theme} icon={<IconBookOpen />}>Journal</SectionLabel>
      <div style={{ fontSize: "12px", color: theme.textMuted, marginBottom: "8px" }}>
        {new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}
      </div>
      <textarea
        value={todayEntry ? todayEntry.text : ""}
        onChange={(e) => updateToday(e.target.value)}
        placeholder="What's on your mind today?"
        className="v-input"
        style={{
          width: "100%",
          minHeight: "80px",
          resize: "vertical",
          background: theme.inputBg,
          border: `1px solid ${theme.inputBorder}`,
          borderRadius: "10px",
          color: theme.inputText,
          padding: "12px",
          fontSize: "13.5px",
          lineHeight: 1.5,
          marginBottom: "16px",
          "--focus-ring": theme.accentSoft,
          "--focus-border": theme.accent,
        }}
      />

      {past.length > 0 ? (
        <div className="v-scroll" style={{ display: "flex", flexDirection: "column", gap: "10px", maxHeight: "220px", overflowY: "auto" }}>
          {past.map((e) => (
            <div key={e.date} style={{ background: theme.accentSoft, border: `1px solid ${theme.divider}`, borderRadius: "10px", padding: "10px 12px" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "4px" }}>
                <span style={{ fontSize: "11px", fontWeight: 700, color: theme.textMuted }}>
                  {new Date(e.date + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" })}
                </span>
                <button
                  onClick={() => removeEntry(e.date)}
                  title="Delete entry"
                  className="v-btn"
                  style={{ width: "18px", height: "18px", borderRadius: "50%", border: "none", background: theme.dangerSoft, color: theme.danger, fontSize: "11px", lineHeight: "18px", textAlign: "center", padding: 0 }}
                >
                  ×
                </button>
              </div>
              <div style={{ fontSize: "13px", color: theme.text, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>{e.text}</div>
            </div>
          ))}
        </div>
      ) : (
        <div style={{ fontSize: "12.5px", color: theme.textFaint }}>Past entries will show up here.</div>
      )}
    </Card>
  );
}
