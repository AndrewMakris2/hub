<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vantage</title>
<meta name="color-scheme" content="light dark" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  ::selection { background: rgba(120,120,255,0.3); }
  input, button { font-family: inherit; }
  button { cursor: pointer; }

  @keyframes vFadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .v-card {
    position: relative;
    overflow: hidden;
    transition: transform 0.22s cubic-bezier(.2,.8,.2,1), box-shadow 0.22s ease;
    animation: vFadeInUp 0.5s cubic-bezier(.2,.8,.2,1) both;
  }
  .v-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent-line, transparent);
    opacity: 0.85;
  }
  .v-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.28) !important;
  }

  .v-btn { transition: transform 0.12s ease, filter 0.12s ease; }
  .v-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .v-btn:active { filter: brightness(0.95); transform: translateY(0); }

  .v-input { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  .v-input:focus {
    outline: none;
    box-shadow: 0 0 0 3px var(--focus-ring, rgba(0,0,0,0.12));
    border-color: var(--focus-border, currentColor) !important;
  }

  .v-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .v-scroll::-webkit-scrollbar-track { background: transparent; }
  .v-scroll::-webkit-scrollbar-thumb { background: var(--scroll-thumb, rgba(128,128,128,0.35)); border-radius: 999px; }

  .v-swatch-box { transition: transform 0.15s ease; }
  .v-swatch:hover .v-swatch-box { transform: scale(1.08); }

  .v-tabular { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
</style>
</head>

};

function isMergeablePlainObject(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    if (parsed == null) return fallback;
    if (isMergeablePlainObject(fallback) && isMergeablePlainObject(parsed)) {
      return { ...fallback, ...parsed };
    }
    return parsed;
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    /* localStorage unavailable or full — silently ignore */
  }
}

function usePersistentState(key, initial) {
  const [state, setState] = useState(() => loadJSON(key, initial));
  useEffect(() => {
    saveJSON(key, state);
  }, [key, state]);
  return [state, setState];
}

function computeGoalProgress(value, target) {
  if (!target) return null;
  const v = Number(value);
  const t = Number(target);
  if (Number.isNaN(v) || Number.isNaN(t) || t === 0) return null;
  return Math.max(0, Math.min(100, Math.round((v / t) * 100)));
}

function findFreeWeekendDay(events) {
  const busyDates = new Set(events.map((e) => e.date));
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (let i = 1; i <= 9; i++) {
    const d = new Date(today.getTime() + i * 86400000);
    const day = d.getDay();
    const iso = d.toISOString().slice(0, 10);
    if ((day === 0 || day === 6) && !busyDates.has(iso)) {
      return { date: iso, label: d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }) };
    }
  }
  return null;
}

function daysUntil(dateStr) {
  const target = new Date(dateStr + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}

function Metric({ theme, label, value, suffix, editable, onChange, inputType }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(value);

  useEffect(() => {
    setDraft(value);
  }, [value]);

  function commit() {
    setEditing(false);
    if (draft === "" || draft === value) return;
    onChange(draft);
  }

  return (
    <div style={{ minWidth: 0 }}>
      <div
        style={{
          fontSize: "11px",
          fontWeight: 600,
          letterSpacing: "0.06em",
          textTransform: "uppercase",
          color: theme.textMuted,
          marginBottom: "6px",
          whiteSpace: "nowrap",
          overflow: "hidden",
          textOverflow: "ellipsis",
        }}
      >
        {label}
      </div>
      {editable && editing ? (
        <input
          autoFocus
          type={inputType || "text"}
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onBlur={commit}
          onKeyDown={(e) => {
            if (e.key === "Enter") commit();
            if (e.key === "Escape") {
              setDraft(value);
              setEditing(false);
            }
          }}
          className="v-input v-tabular"
          style={{
            width: "100%",
            fontSize: "26px",
            fontWeight: 700,
            color: theme.inputText,
            background: theme.inputBg,
            border: `1px solid ${theme.accent}`,
            borderRadius: "8px",
            padding: "4px 8px",
            "--focus-ring": theme.accentSoft,
            "--focus-border": theme.accent,
          }}
        />
      ) : (
        <div
          onClick={() => editable && setEditing(true)}
          title={editable ? "Click to edit" : undefined}
          className="v-tabular"
          style={{
            fontSize: "26px",
            fontWeight: 700,
            color: theme.text,
            cursor: editable ? "text" : "default",
            lineHeight: 1.15,
            wordBreak: "break-word",
          }}

          {value}
          {suffix ? (
            <span style={{ fontSize: "15px", fontWeight: 600, color: theme.textMuted, marginLeft: "4px" }}>
              {suffix}
            </span>
          ) : null}
        </div>
      )}
    </div>
  );
}

function ProgressBar({ theme, from, to, current }) {
  const span = Math.abs(from - to) || 1;
  const progressed = Math.min(Math.max((from - current) / (from - to), 0), 1);
  const pct = Math.round(progressed * 100);
  return (
    <div style={{ marginTop: "18px" }}>
      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          fontSize: "11px",
          fontWeight: 600,

/* ----------------------------------------------------------------------
   SUGGESTIONS ENGINE
   Pure, local, rule-based — no external calls or API keys. Reads profile,
   goal progress, and event dates to produce a short list of nudges.
---------------------------------------------------------------------- */

function generateSuggestions({ fitness, golf, trackers, profile, events }) {
  const suggestions = [];

  if (profile.topPicks && profile.topPicks.length > 0) {
    const pick = profile.topPicks[0];
    const free = findFreeWeekendDay(events);
    if (free) {
      suggestions.push({
        id: "s-freeday",
        text: `You're free ${free.label} — good day for ${pick.toLowerCase()}, your top pick from the quiz.`,
      });
    } else {
      suggestions.push({
        id: "s-toppick",
        text: `You ranked ${pick.toLowerCase()} as a top pick in the quiz — worth making time for it this week.`,
      });
    }
  }

  trackers.forEach((t) => {
    const progress = computeGoalProgress(t.value, t.target);
    if (progress !== null && progress < 50) {
      suggestions.push({
        id: `s-tracker-${t.id}`,
        text: `${t.label} is at ${progress}% of your goal (${t.value}/${t.target}) — a push this week would help.`,
      });
    }
  });

  events.forEach((ev) => {
    const days = daysUntil(ev.date);
    if (days >= 0 && days <= 10) {
      suggestions.push({
        id: `s-event-${ev.id}`,
        text: `${ev.title} is in ${days} day${days === 1 ? "" : "s"} (${ev.detail}) — good time to start prepping.`,
      });
    }
  });

  if (fitness.currentWeight > fitness.targetWeight) {
    const diff = Math.round((fitness.currentWeight - fitness.targetWeight) * 10) / 10;
    suggestions.push({
      id: "s-fitness",
      text: `You're ${diff} lbs from your target weight — a cardio session this week would help close the gap.`,
    });
  } else {
    suggestions.push({
      id: "s-fitness",
      text: `You've hit your target weight — nice work. Consider setting a new one.`,
    });
  }

  if (profile.interests.some((i) => i.toLowerCase().includes("golf"))) {
    suggestions.push({
      id: "s-golf",
      text: `Handicap is sitting at ${golf.handicap} — booking a round would keep it sharp.`,
    });
  }

  if (profile.genres && profile.genres.length > 0) {
    const top = profile.genres.slice(0, 2).join(" and ");
    suggestions.push({
      id: "s-genre",
      text: `You're into ${top} — worth checking what's new to watch there this week.`,
    });
  }

  const trackedLabels = trackers.map((t) => t.label.toLowerCase());
  profile.interests.forEach((interest) => {
    const hasTracker = trackedLabels.some((l) => l.includes(interest.toLowerCase()));
    if (!hasTracker && !["golf", "fitness"].includes(interest.toLowerCase())) {
      suggestions.push({
        id: `s-interest-${interest}`,
        text: `You listed "${interest}" as an interest — want to add a tracker for it?`,
      });
    }
  });

  return suggestions.slice(0, 5);
}

                    placeholder="optional"
                    className="v-input v-tabular"
                    style={{
                      width: "100%",
                      fontSize: "12px",
                      fontWeight: 600,
                      color: theme.textMuted,
                      background: "transparent",
                      border: "none",
                      borderRadius: "4px",
                      padding: 0,
                      "--focus-ring": theme.accentSoft,
                      "--focus-border": "transparent",
                    }}
                  />
                </div>
                {progress !== null && (
                  <div
                    title={`${progress}% of goal`}
                    style={{
                      height: "4px",
                      borderRadius: "999px",
                      background: theme.progressTrack,
                      marginTop: "8px",
                      overflow: "hidden",
                    }}
                  >
                    <div
                      style={{
                        height: "100%",
                        width: `${progress}%`,
                        borderRadius: "999px",
                        backgroundImage:
                          typeof theme.progressFill === "string" && theme.progressFill.includes("gradient")
                            ? theme.progressFill
                            : undefined,
                        background: theme.progressFill,
                        transition: "width 0.3s ease",
                      }}
                    />
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ) : (
        <div style={{ fontSize: "13px", color: theme.textFaint, marginBottom: "20px" }}>
          No custom trackers yet — add one below.
        </div>
      )}

      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap" }}>
        <input
          placeholder="Label (e.g. Pages Read)"
          value={label}
          onChange={(e) => setLabel(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addTracker()}
          className="v-input"
          style={{ ...inputStyle, flex: "2 1 180px" }}
        />
        <input
          placeholder="Value (e.g. 42)"
          value={value}
          onChange={(e) => setValue(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addTracker()}
          className="v-input"
          style={{ ...inputStyle, flex: "1 1 100px" }}
        />
        <input
          placeholder="Goal (optional)"
          value={target}
          onChange={(e) => setTarget(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addTracker()}
          className="v-input"
          style={{ ...inputStyle, flex: "1 1 110px" }}
        />
        <button
          onClick={addTracker}
          className="v-btn"
          style={{
            flex: "0 0 auto",
            background: theme.accent,
            color: theme.accentText,
            border: "none",
            borderRadius: "8px",
            padding: "9px 18px",
            fontSize: "14px",
            fontWeight: 700,
          }}
        >
          Add Tracker
        </button>
      </div>
    </Card>
  );
}

const QUIZ_STEPS = ["Genres", "Activities", "Top 3", "Anything else?"];

function QuizModal({ theme, profile, setProfile, onClose }) {
  const [step, setStep] = useState(0);
  const [genres, setGenres] = useState(profile.genres);
  const [activities, setActivities] = useState(profile.activities);
  const [topPicks, setTopPicks] = useState(profile.topPicks);
  const [notes, setNotes] = useState(profile.notes);

  const likedActivities = Object.keys(activities).filter((a) => activities[a] === "like");

  function toggleGenre(g) {
    setGenres((prev) => (prev.includes(g) ? prev.filter((x) => x !== g) : [...prev, g]));
  }

  function cycleActivity(a) {
    setActivities((prev) => {
      const current = prev[a] || "neutral";
      const next = current === "neutral" ? "like" : current === "like" ? "dislike" : "neutral";
      const updated = { ...prev, [a]: next };
      if (next !== "like") {
        setTopPicks((tp) => tp.filter((x) => x !== a));
      }
      return updated;
    });
  }

  function toggleTopPick(a) {
    setTopPicks((prev) => {
      if (prev.includes(a)) return prev.filter((x) => x !== a);
      if (prev.length >= 3) return prev;
      return [...prev, a];
    });
  }

  function finish() {
    setProfile({ ...profile, genres, activities, topPicks, notes: notes.trim() });
    onClose();
  }

  const chipBase = {
    fontSize: "12.5px",
    fontWeight: 600,
    padding: "7px 12px",
    borderRadius: "999px",
    border: "1px solid transparent",
    cursor: "pointer",
  };

  return ReactDOM.createPortal(
    <div
      style={{
        position: "fixed",
        inset: 0,
        zIndex: 100,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        padding: "20px",
        background: "rgba(0,0,0,0.55)",
      }}
    >
      <div
        className="v-scroll"
        style={{
          width: "100%",
          maxWidth: "540px",
          maxHeight: "85vh",
          overflowY: "auto",
          "--scroll-thumb": theme.divider,
          ...cardBackgroundStyle(theme),
          padding: "24px",
        }}
      >
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: "4px" }}>
          <div>
            <div
              style={{
                fontSize: "11px",
                fontWeight: 700,
                letterSpacing: "0.1em",
                textTransform: "uppercase",
                color: theme.sectionLabelColor,
                marginBottom: "6px",
              }}
            >
              Taste Quiz &middot; Step {step + 1} of {QUIZ_STEPS.length}
            </div>
            <div style={{ fontSize: "19px", fontWeight: 800, color: theme.text }}>{QUIZ_STEPS[step]}</div>
          </div>
          <button
            onClick={onClose}
            title="Close"
            className="v-btn"
            style={{
              border: "none",
              background: theme.accentSoft,
              color: theme.text,
              width: "30px",
              height: "30px",
              borderRadius: "50%",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              flexShrink: 0,
            }}
          >
            <IconClose />
          </button>
        </div>

        <div style={{ display: "flex", gap: "5px", marginBottom: "20px" }}>
          {QUIZ_STEPS.map((s, i) => (
            <div
              key={s}
              style={{
                height: "3px",
                flex: 1,
                borderRadius: "999px",
                background: i <= step ? theme.accent : theme.progressTrack,
              }}
            />
          ))}
        </div>

        {step === 0 && (
          <div>
            <p style={{ fontSize: "13px", color: theme.textMuted, marginTop: 0, marginBottom: "16px", lineHeight: 1.5 }}>
              Pick every genre you enjoy in movies or TV — as many as apply.
            </p>
            <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>
              {QUIZ_GENRES.map((g) => {
                const active = genres.includes(g);
                return (
                  <button
                    key={g}
                    onClick={() => toggleGenre(g)}
                    className="v-btn"
                    style={{
                      ...chipBase,
                      background: active ? theme.accentSoft : theme.chip,
                      color: active ? theme.accent : theme.chipText,
                      borderColor: active ? theme.accent : "transparent",
                    }}
                  >
                    {g}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {step === 1 && (
          <div>
            <p style={{ fontSize: "13px", color: theme.textMuted, marginTop: 0, marginBottom: "16px", lineHeight: 1.5 }}>
              Tap each activity to cycle through: skip &rarr; like &rarr; dislike &rarr; skip.
            </p>
            <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>
              {QUIZ_ACTIVITIES.map((a) => {
                const state = activities[a] || "neutral";
                const style =
                  state === "like"
                    ? { background: theme.chip, color: theme.positive, borderColor: theme.positive }
                    : state === "dislike"
                    ? { background: theme.dangerSoft, color: theme.danger, borderColor: theme.danger }
                    : { background: theme.chip, color: theme.chipText, borderColor: "transparent" };
                return (
                  <button key={a} onClick={() => cycleActivity(a)} className="v-btn" style={{ ...chipBase, ...style }}>
                    {state === "like" ? "✓ " : state === "dislike" ? "✕ " : ""}
                    {a}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {step === 2 && (
          <div>
            <p style={{ fontSize: "13px", color: theme.textMuted, marginTop: 0, marginBottom: "16px", lineHeight: 1.5 }}>
              Of the ones you liked, pick up to 3 you'd actually want to make time for. Suggestions will
              prioritize these.
            </p>
            {likedActivities.length === 0 ? (
              <div style={{ fontSize: "13px", color: theme.textFaint }}>
                Go back and mark a few activities as liked first.
              </div>
            ) : (
              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>
                {likedActivities.map((a) => {
                  const rank = topPicks.indexOf(a);
                  const active = rank !== -1;
                  return (
                    <button
                      key={a}
                      onClick={() => toggleTopPick(a)}
                      className="v-btn"
                      style={{
                        ...chipBase,
                        display: "inline-flex",
                        alignItems: "center",
                        gap: "6px",
                        background: active ? theme.accentSoft : theme.chip,
                        color: active ? theme.accent : theme.chipText,
                        borderColor: active ? theme.accent : "transparent",
                      }}
                    >
                      {active && (
                        <span
                          style={{
                            width: "16px",
                            height: "16px",
                            borderRadius: "50%",
                            background: theme.accent,
                            color: theme.accentText,
                            fontSize: "10px",
                            fontWeight: 800,
                            display: "flex",
                            alignItems: "center",
                            justifyContent: "center",
                          }}
                        >
                          {rank + 1}
                        </span>
                      )}
                      {a}
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {step === 3 && (
          <div>
            <p style={{ fontSize: "13px", color: theme.textMuted, marginTop: 0, marginBottom: "12px", lineHeight: 1.5 }}>
              Favorite movie, show, hobby, anything — free text, totally optional.
            </p>
            <textarea
              value={notes}
              onChange={(e) => setNotes(e.target.value)}
              placeholder="e.g. Big fan of heist movies, just got into pottery..."
              className="v-input"
              rows={4}
              style={{
                width: "100%",
                resize: "vertical",
                background: theme.inputBg,
                border: `1px solid ${theme.inputBorder}`,
                borderRadius: "8px",
                color: theme.inputText,
                padding: "10px 12px",
                fontSize: "13.5px",
                fontFamily: "inherit",
                "--focus-ring": theme.accentSoft,
                "--focus-border": theme.accent,
              }}
            />
          </div>
        )}

        <div style={{ display: "flex", justifyContent: "space-between", marginTop: "24px", gap: "10px" }}>
          <button
            onClick={() => setStep((s) => Math.max(0, s - 1))}
            disabled={step === 0}
            className="v-btn"
            style={{
              padding: "9px 16px",
              borderRadius: "8px",
              border: `1px solid ${theme.inputBorder}`,
              background: "transparent",
              color: theme.text,
              fontSize: "13px",
              fontWeight: 700,
              opacity: step === 0 ? 0.4 : 1,
              cursor: step === 0 ? "default" : "pointer",
            }}
          >
            Back
          </button>
          {step < QUIZ_STEPS.length - 1 ? (
            <button
              onClick={() => setStep((s) => Math.min(QUIZ_STEPS.length - 1, s + 1))}
              className="v-btn"
              style={{
                padding: "9px 20px",
                borderRadius: "8px",
                border: "none",
                background: theme.accent,
                color: theme.accentText,
                fontSize: "13px",
                fontWeight: 700,
              }}
            >
              Next
            </button>
          ) : (
            <button
              onClick={finish}
              className="v-btn"
              style={{
                padding: "9px 20px",
                borderRadius: "8px",
                border: "none",
                background: theme.accent,
                color: theme.accentText,
                fontSize: "13px",
                fontWeight: 700,
              }}
            >
              Save & Finish
            </button>
          )}
        </div>
      </div>
    </div>,
    document.body
  );
}

function ProfileSection({ theme, profile, setProfile }) {
  const [tag, setTag] = useState("");
  const [quizOpen, setQuizOpen] = useState(false);

  const quizTaken = profile.genres.length > 0 || Object.keys(profile.activities).length > 0;
  const likedCount = Object.values(profile.activities).filter((v) => v === "like").length;

  function addInterest() {
    const trimmed = tag.trim();
    if (!trimmed) return;
    if (profile.interests.some((i) => i.toLowerCase() === trimmed.toLowerCase())) {
      setTag("");
      return;
    }
    setProfile({ ...profile, interests: [...profile.interests, trimmed] });
    setTag("");
  }

  function removeInterest(interest) {
    setProfile({ ...profile, interests: profile.interests.filter((i) => i !== interest) });
  }

  return (
    <Card theme={theme} delay={200}>
      <SectionLabel theme={theme} icon={<IconUser />}>About Me</SectionLabel>
      <div style={{ fontSize: "12px", color: theme.textMuted, marginBottom: "14px", lineHeight: 1.4 }}>
        Interests power the suggestions above — add what you're into.
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: "8px", marginBottom: "14px" }}>
        {profile.interests.map((interest) => (
          <span
            key={interest}
            style={{
              display: "inline-flex",
              alignItems: "center",
              gap: "6px",
              fontSize: "12px",
              fontWeight: 600,
              color: theme.chipText,
              background: theme.chip,
              padding: "6px 10px",
              borderRadius: "999px",
            }}
          >
            {interest}
            <button
              onClick={() => removeInterest(interest)}
              className="v-btn"
              title="Remove"
              style={{
                border: "none",
                background: "transparent",
                color: theme.chipText,
                fontSize: "12px",
                lineHeight: 1,
                padding: 0,
                opacity: 0.7,
              }}
            >
              ×
            </button>
          </span>
        ))}
        {profile.interests.length === 0 && (
          <span style={{ fontSize: "13px", color: theme.textFaint }}>No interests added yet.</span>
        )}
      </div>
      <div style={{ display: "flex", gap: "10px" }}>
        <input
          placeholder="Add an interest (e.g. Cooking)"
          value={tag}
          onChange={(e) => setTag(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addInterest()}
          className="v-input"
          style={{
            flex: 1,
            minWidth: 0,
            background: theme.inputBg,
            border: `1px solid ${theme.inputBorder}`,
            borderRadius: "8px",
            color: theme.inputText,
            padding: "9px 12px",
            fontSize: "14px",
            "--focus-ring": theme.accentSoft,
            "--focus-border": theme.accent,
          }}
        />
        <button
          onClick={addInterest}
          className="v-btn"
          style={{
            background: theme.accent,
            color: theme.accentText,
            border: "none",
            borderRadius: "8px",
            padding: "9px 18px",
            fontSize: "14px",
            fontWeight: 700,
          }}
        >
          Add
        </button>
      </div>

      <div
        style={{
          marginTop: "16px",
          paddingTop: "16px",
          borderTop: `1px solid ${theme.divider}`,
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          gap: "10px",
          flexWrap: "wrap",
        }}
      >
        <div style={{ fontSize: "12px", color: theme.textMuted, lineHeight: 1.4 }}>
          {quizTaken ? (
            <>
              Taste quiz: {profile.genres.length} genre{profile.genres.length === 1 ? "" : "s"}, {likedCount} liked
              activit{likedCount === 1 ? "y" : "ies"}.
            </>
          ) : (
            "Take the taste quiz to power richer, more specific suggestions."
          )}
        </div>
        <button
          onClick={() => setQuizOpen(true)}
          className="v-btn"
          style={{
            display: "flex",
            alignItems: "center",
            gap: "7px",
            flexShrink: 0,
            background: theme.accentSoft,
            color: theme.text,
            border: `1px solid ${theme.cardBorder}`,
            borderRadius: "8px",
            padding: "7px 14px",
            fontSize: "12.5px",
            fontWeight: 700,
          }}
        >
          <IconChecklist />
          {quizTaken ? "Retake Quiz" : "Take the Quiz"}
        </button>
      </div>

      {quizOpen && <QuizModal theme={theme} profile={profile} setProfile={setProfile} onClose={() => setQuizOpen(false)} />}
    </Card>
  );
}

function SuggestionsSection({ theme, fitness, golf, trackers, profile, events }) {
  const suggestions = useMemo(
    () => generateSuggestions({ fitness, golf, trackers, profile, events }),
    [fitness, golf, trackers, profile, events]
  );

  return (
    <Card theme={theme} style={{ gridColumn: "1 / -1" }} delay={0}>
      <SectionLabel theme={theme} icon={<IconBulb />}>For You</SectionLabel>
      {suggestions.length > 0 ? (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: "12px" }}>

            <div

              style={{
                display: "flex",
                gap: "10px",

}

/* ----------------------------------------------------------------------
   THEME SWITCHER
---------------------------------------------------------------------- */

const THEME_GROUPS = [
  { label: "Light", keys: ["minimal", "sunset", "forest", "pastel", "glass"] },
  {
    label: "Dark",
    keys: [
      "navyGold",
      "darkModern",
      "cyberpunk",
      "obsidian",
      "crimsonNoir",
      "emeraldMidnight",
      "amberTerminal",
      "amethyst",
      "oceanAbyss",
      "roseGold",
      "slateSteel",
    ],
  },
];

function swatchFill(t) {
  const bg = t.pageBgGradient && t.pageBgGradient !== "none" ? t.pageBgGradient : t.pageBg;
  const isGradient = typeof bg === "string" && bg.includes("gradient");
  return isGradient ? { backgroundImage: bg } : { background: bg };
}

function ThemeSwatch({ theme, themeKey: key, t, active, onSelect }) {
  return (
    <button
      onClick={onSelect}
      title={t.name}
      className="v-swatch"
      style={{
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        gap: "7px",
        padding: "6px",
        border: "none",
        background: "transparent",
      }}
    >
      <span
        className="v-swatch-box"
        style={{
          width: "46px",
          height: "46px",
          borderRadius: "13px",
          display: "block",
          position: "relative",
          border: active ? `2px solid ${theme.accent}` : `1px solid ${theme.divider}`,
          boxShadow: active ? `0 0 0 3px ${theme.accentSoft}` : "none",
          transition: "box-shadow 0.15s ease, border-color 0.15s ease",
          ...swatchFill(t),
        }}
      >
        <span
          style={{
            position: "absolute",
            bottom: "5px",
            right: "5px",
            width: "11px",
            height: "11px",
            borderRadius: "50%",
            background: t.accent,
            boxShadow: "0 0 0 2px rgba(0,0,0,0.28)",
          }}
        />
        {active && (
          <span
            style={{
              position: "absolute",
              top: "5px",
              left: "5px",
              width: "8px",
              height: "8px",
              borderRadius: "50%",
              background: theme.accent,
              boxShadow: "0 0 0 2px rgba(0,0,0,0.28)",
            }}
          />
        )}
      </span>
      <span
        style={{
          fontSize: "10.5px",
          fontWeight: active ? 700 : 500,
          color: active ? theme.text : theme.textMuted,
          textAlign: "center",
          lineHeight: 1.15,
          maxWidth: "62px",
        }}
      >
        {t.name}
      </span>
    </button>
  );
}

function ThemePopover({ theme, themeKey, setThemeKey, onClose }) {
  return (
    <div
      className="v-scroll"
      style={{
        position: "absolute",
        top: "calc(100% + 12px)",
        right: 0,
        width: "300px",
        maxWidth: "min(88vw, 320px)",
        maxHeight: "70vh",
        overflowY: "auto",
        zIndex: 50,
        padding: "18px 16px",
        "--scroll-thumb": theme.divider,
        ...cardBackgroundStyle(theme),
      }}
    >
      {THEME_GROUPS.map((group) => (
        <div key={group.label} style={{ marginBottom: group.label === "Dark" ? 0 : "18px" }}>
          <div
            style={{
              fontSize: "11px",
              fontWeight: 700,
              letterSpacing: "0.1em",
              textTransform: "uppercase",
              color: theme.sectionLabelColor,
              marginBottom: "10px",
              paddingLeft: "2px",
            }}
          >
            {group.label}
          </div>
          <div
            style={{
              display: "grid",
              gridTemplateColumns: "repeat(4, 1fr)",
              gap: "2px",
            }}
          >
            {group.keys.map((key) => (
              <ThemeSwatch
                key={key}
                theme={theme}
                themeKey={key}
                t={THEMES[key]}
                active={key === themeKey}
                onSelect={() => {
                  setThemeKey(key);
                  onClose();
                }}
              />
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function ThemePicker({ theme, themeKey, setThemeKey }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  const current = THEMES[themeKey];

  useEffect(() => {
    function handleOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setOpen(false);
      }
    }
    document.addEventListener("mousedown", handleOutside);
    return () => document.removeEventListener("mousedown", handleOutside);
  }, []);

  return (
    <div ref={wrapRef} style={{ position: "relative" }}>
      <button
        onClick={() => setOpen((o) => !o)}
        className="v-btn"
        style={{
          display: "flex",
          alignItems: "center",
          gap: "9px",
          padding: "6px 14px 6px 6px",
          borderRadius: "999px",
          border: `1px solid ${theme.cardBorder}`,
          background: theme.accentSoft,
          color: theme.text,
          fontSize: "13px",
          fontWeight: 600,
        }}
      >
        <span
          style={{
            width: "24px",
            height: "24px",
            borderRadius: "50%",
            display: "inline-block",
            border: `1px solid ${theme.divider}`,
            ...swatchFill(current),
          }}
        />
        {current.name}
        <span
          style={{
            fontSize: "9px",
            color: theme.textMuted,
            display: "inline-block",
            transform: open ? "rotate(180deg)" : "none",
            transition: "transform 0.15s ease",
          }}
        >
          &#9662;
        </span>
      </button>

      {open && (
        <ThemePopover theme={theme} themeKey={themeKey} setThemeKey={setThemeKey} onClose={() => setOpen(false)} />
      )}
    </div>
  );
}

/* ----------------------------------------------------------------------
   BACKUP & RESTORE
---------------------------------------------------------------------- */

function isPlainObject(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

function sanitizeBackup(parsed) {
  const out = {};
  if (!isPlainObject(parsed)) return out;

  if (typeof parsed.theme === "string" && THEMES[parsed.theme]) {
    out.theme = parsed.theme;
  }
  if (isPlainObject(parsed.fitness)) {
    const f = parsed.fitness;
    out.fitness = {
      benchLbs: Number(f.benchLbs) || DEFAULT_FITNESS.benchLbs,
      benchReps: Number(f.benchReps) || DEFAULT_FITNESS.benchReps,
      currentWeight: Number(f.currentWeight) || DEFAULT_FITNESS.currentWeight,
      targetWeight: Number(f.targetWeight) || DEFAULT_FITNESS.targetWeight,
    };
  }
  if (isPlainObject(parsed.golf)) {
    const g = parsed.golf;
    out.golf = {
      roundsYtd: Number(g.roundsYtd) || DEFAULT_GOLF.roundsYtd,
      handicap: Number.isFinite(Number(g.handicap)) ? Number(g.handicap) : DEFAULT_GOLF.handicap,
    };
  }
  if (Array.isArray(parsed.trackers)) {
    out.trackers = parsed.trackers
      .filter((t) => isPlainObject(t) && typeof t.label === "string" && t.label.trim())
      .map((t, i) => ({
        id: typeof t.id === "string" && t.id ? t.id : "t" + Date.now() + i,
        label: String(t.label),
        value: String(t.value ?? ""),
        target: String(t.target ?? ""),
      }));
  }
  if (isPlainObject(parsed.profile) && Array.isArray(parsed.profile.interests)) {
    const p = parsed.profile;
    const activities = isPlainObject(p.activities) ? p.activities : {};
    const validActivityStates = new Set(["like", "dislike", "neutral"]);
    out.profile = {
      interests: p.interests.filter((i) => typeof i === "string" && i.trim()).map(String),
      genres: Array.isArray(p.genres) ? p.genres.filter((g) => typeof g === "string" && g.trim()).map(String) : [],
      activities: Object.fromEntries(
        Object.entries(activities).filter(([, v]) => validActivityStates.has(v))
      ),
      topPicks: Array.isArray(p.topPicks)
        ? p.topPicks.filter((t) => typeof t === "string" && t.trim()).map(String).slice(0, 3)
        : [],
      notes: typeof p.notes === "string" ? p.notes : "",
    };
  }
  return out;
}

function IconBackup() {
  return (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <path d="M12 3v12" />
      <path d="M7 10l5 5 5-5" />
      <path d="M4 19h16" />
    </svg>
  );
}

function BackupMenu({
  theme,
  themeKey,
  fitness,
  golf,
  trackers,
  profile,
  setThemeKey,
  setFitness,
  setGolf,
  setTrackers,
  setProfile,
}) {
  const [open, setOpen] = useState(false);
  const [status, setStatus] = useState(null);
  const wrapRef = useRef(null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    function handleOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setOpen(false);
      }
    }
    document.addEventListener("mousedown", handleOutside);
    return () => document.removeEventListener("mousedown", handleOutside);
  }, []);

  function handleExport() {
    const payload = {
      app: "personal-dashboard",
      version: 1,
      exportedAt: new Date().toISOString(),
      theme: themeKey,
      fitness,
      golf,
      trackers,
      profile,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `dashboard-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus({ type: "success", message: "Backup downloaded." });
  }

  function handleImportClick() {
    if (fileInputRef.current) fileInputRef.current.click();
  }

  function handleFileChange(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const sanitized = sanitizeBackup(parsed);
        if (Object.keys(sanitized).length === 0) {
          setStatus({ type: "error", message: "No recognizable dashboard data in that file." });
          return;
        }
        if (sanitized.theme) setThemeKey(sanitized.theme);
        if (sanitized.fitness) setFitness(sanitized.fitness);
        if (sanitized.golf) setGolf(sanitized.golf);
        if (sanitized.trackers) setTrackers(sanitized.trackers);
        if (sanitized.profile) setProfile(sanitized.profile);
        setStatus({ type: "success", message: "Backup restored." });
      } catch (err) {
        setStatus({ type: "error", message: "Couldn't parse that file as JSON." });
      }
    };
    reader.readAsText(file);
  }

  return (
    <div ref={wrapRef} style={{ position: "relative" }}>
      <button
        onClick={() => {
          setOpen((o) => !o);
          setStatus(null);
        }}
        title="Backup & restore"
        className="v-btn"
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          width: "34px",
          height: "34px",
          borderRadius: "50%",
          border: `1px solid ${theme.cardBorder}`,
          background: theme.accentSoft,
          color: theme.text,
        }}
      >
        <IconBackup />
      </button>

      {open && (
        <div
          style={{
            position: "absolute",
            top: "calc(100% + 12px)",
            right: 0,
            width: "260px",
            zIndex: 50,
            padding: "16px",
            ...cardBackgroundStyle(theme),
          }}
        >
          <div
            style={{
              fontSize: "11px",
              fontWeight: 700,
              letterSpacing: "0.1em",
              textTransform: "uppercase",
              color: theme.sectionLabelColor,
              marginBottom: "6px",
            }}
          >
            Backup & Restore
          </div>
          <div style={{ fontSize: "12px", color: theme.textMuted, marginBottom: "14px", lineHeight: 1.4 }}>
            Your data lives only in this browser. Export a copy, or restore from a previous export.
          </div>

          <button
            onClick={handleExport}
            className="v-btn"
            style={{
              width: "100%",
              padding: "9px 12px",
              borderRadius: "8px",
              border: "none",
              background: theme.accent,
              color: theme.accentText,
              fontSize: "13px",
              fontWeight: 700,
              marginBottom: "8px",
            }}
          >
            Export Backup
          </button>
          <button
            onClick={handleImportClick}
            className="v-btn"
            style={{
              width: "100%",
              padding: "9px 12px",
              borderRadius: "8px",
              border: `1px solid ${theme.inputBorder}`,
              background: "transparent",
              color: theme.text,
              fontSize: "13px",
              fontWeight: 700,
            }}
          >
            Import Backup
          </button>
          <input
            ref={fileInputRef}
            type="file"
            accept="application/json"
            onChange={handleFileChange}
            style={{ display: "none" }}
          />

          {status && (
            <div
              style={{
                marginTop: "10px",
                fontSize: "12px",
                fontWeight: 600,
                color: status.type === "error" ? theme.danger : theme.positive,
              }}
            >
              {status.message}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ----------------------------------------------------------------------
   CALENDAR INTEGRATION
   Client-side OAuth against Google Calendar and Microsoft Graph. Needs:
   1. The page served over http/https (OAuth providers reject file://).
   2. Your own OAuth client IDs from Google Cloud Console / Microsoft Entra,
      pasted into the fields below — nothing is hardcoded or sent anywhere
      but Google/Microsoft's own APIs.
---------------------------------------------------------------------- */

function normalizeGoogleEvents(items) {
  return (items || []).map((it) => {
    const start = (it.start && (it.start.dateTime || it.start.date)) || new Date().toISOString();
    return {
      id: `g-${it.id}`,
      title: it.summary || "(untitled event)",
      detail: new Date(start).toLocaleDateString(undefined, { month: "short", day: "numeric" }),
      date: start.slice(0, 10),
      source: "Google",
    };
  });
}

function normalizeMicrosoftEvents(items) {
  return (items || []).map((it) => {
    const start = (it.start && it.start.dateTime) || new Date().toISOString();
    return {
      id: `ms-${it.id}`,
      title: it.subject || "(untitled event)",
      detail: new Date(start).toLocaleDateString(undefined, { month: "short", day: "numeric" }),
      date: start.slice(0, 10),
      source: "Outlook",
    };
  });
}

function CalendarMenu({ theme, integrations, setIntegrations, onEvents, connectedCounts }) {
  const [open, setOpen] = useState(false);
  const [googleStatus, setGoogleStatus] = useState(null);
  const [msStatus, setMsStatus] = useState(null);
  const [googleBusy, setGoogleBusy] = useState(false);
  const [msBusy, setMsBusy] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    function handleOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setOpen(false);
      }
    }
    document.addEventListener("mousedown", handleOutside);
    return () => document.removeEventListener("mousedown", handleOutside);
  }, []);

  function connectGoogle() {
    const clientId = integrations.googleClientId.trim();
    if (!clientId) {
      setGoogleStatus({ type: "error", message: "Add your Google Client ID first." });
      return;
    }
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      setGoogleStatus({ type: "error", message: "Google's sign-in script hasn't loaded yet — try again in a moment." });
      return;
    }
    setGoogleBusy(true);
    setGoogleStatus(null);
    try {
      const tokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: "https://www.googleapis.com/auth/calendar.readonly",
        callback: async (resp) => {
          setGoogleBusy(false);
          if (resp.error) {
            setGoogleStatus({ type: "error", message: `Google sign-in failed: ${resp.error}` });
            return;
          }
          try {
            const now = new Date();
            const in30 = new Date(now.getTime() + 30 * 86400000);
            const url =
              "https://www.googleapis.com/calendar/v3/calendars/primary/events" +
              `?timeMin=${encodeURIComponent(now.toISOString())}` +
              `&timeMax=${encodeURIComponent(in30.toISOString())}` +
              "&singleEvents=true&orderBy=startTime&maxResults=15";
            const r = await fetch(url, { headers: { Authorization: `Bearer ${resp.access_token}` } });
            if (!r.ok) throw new Error(`Google Calendar API returned ${r.status}`);
            const data = await r.json();
            const events = normalizeGoogleEvents(data.items);
            onEvents("google", events);
            setGoogleStatus({ type: "success", message: `Connected — pulled ${events.length} events.` });
          } catch (err) {
            setGoogleStatus({ type: "error", message: err.message || "Failed to fetch Google Calendar events." });
          }
        },
      });
      tokenClient.requestAccessToken();
    } catch (err) {
      setGoogleBusy(false);
      setGoogleStatus({ type: "error", message: err.message || "Couldn't start Google sign-in." });
    }
  }

  function disconnectGoogle() {
    onEvents("google", []);
    setGoogleStatus({ type: "success", message: "Disconnected." });
  }

  async function connectMicrosoft() {
    const clientId = integrations.msClientId.trim();
    if (!clientId) {
      setMsStatus({ type: "error", message: "Add your Microsoft Client ID first." });
      return;
    }
    if (!window.msal) {
      setMsStatus({ type: "error", message: "Microsoft's auth script hasn't loaded yet — try again in a moment." });
      return;
    }
    setMsBusy(true);
    setMsStatus(null);
    try {
      const msalApp = new window.msal.PublicClientApplication({
        auth: { clientId, redirectUri: window.location.origin + window.location.pathname },
      });
      await msalApp.initialize();
      const loginResp = await msalApp.loginPopup({ scopes: ["Calendars.Read"] });
      let tokenResp;
      try {
        tokenResp = await msalApp.acquireTokenSilent({ scopes: ["Calendars.Read"], account: loginResp.account });
      } catch (silentErr) {
        tokenResp = await msalApp.acquireTokenPopup({ scopes: ["Calendars.Read"], account: loginResp.account });
      }
      const now = new Date();
      const in30 = new Date(now.getTime() + 30 * 86400000);
      const url =
        "https://graph.microsoft.com/v1.0/me/calendarview" +
        `?startDateTime=${encodeURIComponent(now.toISOString())}` +
        `&endDateTime=${encodeURIComponent(in30.toISOString())}` +
        "&$orderby=start/dateTime&$top=15";
      const r = await fetch(url, { headers: { Authorization: `Bearer ${tokenResp.accessToken}` } });
      if (!r.ok) throw new Error(`Microsoft Graph API returned ${r.status}`);
      const data = await r.json();
      const events = normalizeMicrosoftEvents(data.value);
      onEvents("microsoft", events);
      setMsStatus({ type: "success", message: `Connected — pulled ${events.length} events.` });
    } catch (err) {
      setMsStatus({ type: "error", message: err.message || "Failed to connect to Outlook." });
    } finally {
      setMsBusy(false);
    }
  }

  function disconnectMicrosoft() {
    onEvents("microsoft", []);
    setMsStatus({ type: "success", message: "Disconnected." });
  }

  const smallInputStyle = {
    width: "100%",
    background: theme.inputBg,
    border: `1px solid ${theme.inputBorder}`,
    borderRadius: "6px",
    color: theme.inputText,
    padding: "7px 9px",
    fontSize: "12px",
    marginBottom: "8px",
    "--focus-ring": theme.accentSoft,
    "--focus-border": theme.accent,
  };

  const connectBtnStyle = {
    width: "100%",
    padding: "8px 12px",
    borderRadius: "8px",
    border: "none",
    background: theme.accent,
    color: theme.accentText,
    fontSize: "12.5px",
    fontWeight: 700,
  };

  const disconnectBtnStyle = {
    width: "100%",
    padding: "8px 12px",
    borderRadius: "8px",
    border: `1px solid ${theme.inputBorder}`,
    background: "transparent",
    color: theme.text,
    fontSize: "12.5px",
    fontWeight: 700,
  };

  return (
    <div ref={wrapRef} style={{ position: "relative" }}>
      <button
        onClick={() => setOpen((o) => !o)}
        title="Connect calendars"
        className="v-btn"
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          width: "34px",
          height: "34px",
          borderRadius: "50%",
          border: `1px solid ${theme.cardBorder}`,
          background: theme.accentSoft,
          color: theme.text,
        }}
      >
        <IconLink />
      </button>

      {open && (
        <div
          className="v-scroll"
          style={{
            position: "absolute",
            top: "calc(100% + 12px)",
            right: 0,
            width: "280px",
            maxHeight: "80vh",
            overflowY: "auto",
            zIndex: 50,
            padding: "16px",
            "--scroll-thumb": theme.divider,
            ...cardBackgroundStyle(theme),
          }}
        >
          <div
            style={{
              fontSize: "11px",
              fontWeight: 700,
              letterSpacing: "0.1em",
              textTransform: "uppercase",
              color: theme.sectionLabelColor,
              marginBottom: "6px",
            }}
          >
            Connect Calendars
          </div>
          <div style={{ fontSize: "11.5px", color: theme.textMuted, marginBottom: "14px", lineHeight: 1.4 }}>
            Needs an https:// URL and your own OAuth client ID (Google Cloud Console / Microsoft Entra). Ask for
            setup steps if you haven't done this yet.
          </div>

          <div style={{ fontSize: "12px", fontWeight: 700, color: theme.text, marginBottom: "6px" }}>
            Google Calendar {connectedCounts.google > 0 ? `(${connectedCounts.google} events)` : ""}
          </div>
          <input
            placeholder="Google Client ID"
            value={integrations.googleClientId}
            onChange={(e) => setIntegrations({ ...integrations, googleClientId: e.target.value })}
            className="v-input"
            style={smallInputStyle}
          />
          <button
            onClick={connectedCounts.google > 0 ? disconnectGoogle : connectGoogle}
            disabled={googleBusy}
            className="v-btn"
            style={{
              ...(connectedCounts.google > 0 ? disconnectBtnStyle : connectBtnStyle),
              opacity: googleBusy ? 0.6 : 1,
              marginBottom: "6px",
            }}
          >
            {googleBusy ? "Connecting…" : connectedCounts.google > 0 ? "Disconnect Google" : "Connect Google Calendar"}
          </button>
          {googleStatus && (
            <div
              style={{
                fontSize: "11.5px",
                fontWeight: 600,
                color: googleStatus.type === "error" ? theme.danger : theme.positive,
                marginBottom: "10px",
              }}
            >
              {googleStatus.message}
            </div>
          )}

          <div
            style={{
              height: "1px",
              background: theme.divider,
              margin: "12px 0",
            }}
          />

          <div style={{ fontSize: "12px", fontWeight: 700, color: theme.text, marginBottom: "6px" }}>
            Outlook Calendar {connectedCounts.microsoft > 0 ? `(${connectedCounts.microsoft} events)` : ""}
          </div>
          <input
            placeholder="Microsoft Client ID"
            value={integrations.msClientId}
            onChange={(e) => setIntegrations({ ...integrations, msClientId: e.target.value })}
            className="v-input"
            style={smallInputStyle}
          />
          <button
            onClick={connectedCounts.microsoft > 0 ? disconnectMicrosoft : connectMicrosoft}
            disabled={msBusy}
            className="v-btn"
            style={{
              ...(connectedCounts.microsoft > 0 ? disconnectBtnStyle : connectBtnStyle),
              opacity: msBusy ? 0.6 : 1,
            }}
          >
            {msBusy ? "Connecting…" : connectedCounts.microsoft > 0 ? "Disconnect Outlook" : "Connect Outlook"}
          </button>
          {msStatus && (
            <div
              style={{
                fontSize: "11.5px",
                fontWeight: 600,
                color: msStatus.type === "error" ? theme.danger : theme.positive,
                marginTop: "8px",
              }}
            >
              {msStatus.message}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

  themeKey,
  fitness,
  golf,

  setThemeKey,

/* ----------------------------------------------------------------------
   APP
---------------------------------------------------------------------- */

function App() {
  const [themeKey, setThemeKey] = usePersistentState(STORAGE_KEYS.theme, "minimal");
  const theme = THEMES[themeKey] || THEMES.minimal;

  const [fitness, setFitness] = usePersistentState(STORAGE_KEYS.fitness, DEFAULT_FITNESS);
  const [golf, setGolf] = usePersistentState(STORAGE_KEYS.golf, DEFAULT_GOLF);
  const [trackers, setTrackers] = usePersistentState(STORAGE_KEYS.trackers, DEFAULT_TRACKERS);
  const [profile, setProfile] = usePersistentState(STORAGE_KEYS.profile, DEFAULT_PROFILE);
  const [integrations, setIntegrations] = usePersistentState(STORAGE_KEYS.integrations, DEFAULT_INTEGRATIONS);

  const [connectedEvents, setConnectedEvents] = useState({ google: [], microsoft: [] });
  function handleCalendarEvents(source, events) {
    setConnectedEvents((prev) => ({ ...prev, [source]: events }));
  }
  const allConnectedEvents = useMemo(
    () => [...connectedEvents.google, ...connectedEvents.microsoft],
    [connectedEvents]
  );
  const connectedCounts = { google: connectedEvents.google.length, microsoft: connectedEvents.microsoft.length };

  return (
    <div
      style={{
        minHeight: "100vh",
        background: theme.pageBgGradient !== "none" ? theme.pageBgGradient : theme.pageBg,
        color: theme.text,
        transition: "background 0.25s ease, color 0.25s ease",
      }}
    >
      <Header
        theme={theme}
        themeKey={themeKey}
        fitness={fitness}
        golf={golf}
        trackers={trackers}
        profile={profile}
        integrations={integrations}
        connectedCounts={connectedCounts}
        setThemeKey={setThemeKey}
        setFitness={setFitness}
        setGolf={setGolf}
        setTrackers={setTrackers}
        setProfile={setProfile}
        setIntegrations={setIntegrations}
        onEvents={handleCalendarEvents}
      />

      <div
        style={{
          maxWidth: "1100px",
          margin: "0 auto",
          padding: "32px 20px 64px",
        }}
      >
        <div
          style={{
            display: "grid",
            gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))",
            gap: "20px",
          }}
        >
          <SuggestionsSection
            theme={theme}
            fitness={fitness}
            golf={golf}
            trackers={trackers}
            profile={profile}
            events={[...UPCOMING_EVENTS, ...allConnectedEvents]}
          />
          <FitnessSection theme={theme} data={fitness} setData={setFitness} />
          <GolfSection theme={theme} data={golf} setData={setGolf} />
          <UpcomingSection theme={theme} connectedEvents={allConnectedEvents} />
          <FinancialSection theme={theme} />
          <ProfileSection theme={theme} profile={profile} setProfile={setProfile} />
          <CustomTrackersSection theme={theme} trackers={trackers} setTrackers={setTrackers} />
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
