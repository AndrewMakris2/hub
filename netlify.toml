[build]
  command = "npm install && node build.js"
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Thin cron trigger for the scheduled YouTube auto-poster — it only picks a
# video and hands off to post-random-video-background.js (see that file and
# README.md for the full picture). 6pm UTC daily; change the cron
# expression to whatever cadence/time is wanted.
[functions."post-random-video"]
  schedule = "0 18 * * *"

# Security headers. Only takes effect on the Netlify deploy — GitHub Pages
# has no mechanism for custom response headers, so that copy relies solely
# on the <meta http-equiv="Content-Security-Policy"> tag in index.html
# (which can't carry frame-ancestors; X-Frame-Options below is this site's
# only source of clickjacking protection, and only on Netlify).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
