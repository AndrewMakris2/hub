[build]
  command = "npm install && node build.js"
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Security headers. Only takes effect on the Netlify deploy — GitHub Pages
# has no mechanism for custom response headers, so that copy relies solely
# on the <meta http-equiv="Content-Security-Policy"> tag in index.html
# (which can't carry frame-ancestors; X-Frame-Options below is this site's
# only source of clickjacking protection, and only on Netlify).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://accounts.google.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://cdn.sheetjs.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https:; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# securityx.html is embedded in an <iframe> by index.html's SecurityX tab.
# The blanket DENY/frame-ancestors 'none' above blocks that same-origin
# framing too, so this file needs its own, more permissive header set.
[[headers]]
  for = "/securityx.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
