<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- CSP lives here (not just netlify.toml) because GitHub Pages has no
     mechanism for custom response headers at all — this is the only way to
     get any CSP enforcement on that copy of the site. Netlify additionally
     gets it as a real header (see netlify.toml) for the earlier-blocking,
     more robust delivery; frame-ancestors is ignored here by spec (meta tags
     can't set it) but is enforced via the Netlify header + X-Frame-Options.
     script-src needs 'unsafe-inline' for the inlined fflate lib, the compiled
     app script build.js writes below, and the SW-registration snippet at the
     bottom — none of them carry a nonce/hash. 'unsafe-eval' was needed only
     for Babel Standalone's in-browser JSX transform; app.jsx is now compiled
     ahead of time by build.js, so it's dropped. The real protection here is
     the explicit host allowlist, which still blocks loading a script from any
     origin not listed below. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://accounts.google.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://cdn.sheetjs.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https: http://127.0.0.1:4787; frame-src 'self'; base-uri 'self'; object-src 'none'" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>BearVantageHub</title>
<!-- index.html is generated from app.jsx by build.js — edit app.jsx, not this file. -->
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#0b1f3a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BearVantageHub" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  /* ==========================================================================
     VANTAGE — global design system
     Theme colors arrive as --v-* custom properties set on :root from the active
     theme object (see applyThemeVars). Everything below is theme-agnostic so all
     22 themes work, light and dark, without per-theme CSS.
     ========================================================================== */
  :root {
    /* spacing scale */
    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
    --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

    /* radius scale */
    --r-xs: 6px; --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-pill: 999px;

    /* Leading. Three steps, because a line box wants to be either tight
       (a number, a control label), snug (a title) or comfortable (prose). */
    --lh-tight: 1.2;
    --lh-snug: 1.35;
    --lh-body: 1.55;

    /* motion */
    --ease: cubic-bezier(.2,.8,.2,1);
    --ease-out: cubic-bezier(.16,1,.3,1);
    --dur-1: 120ms; --dur-2: 180ms; --dur-3: 260ms;

    /* elevation — light default, re-stepped for dark below */
    --sh-1: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --sh-2: 0 4px 8px -2px rgba(16,24,40,.10), 0 2px 4px -2px rgba(16,24,40,.06);
    --sh-3: 0 12px 24px -6px rgba(16,24,40,.14), 0 4px 8px -4px rgba(16,24,40,.08);
    --sh-4: 0 24px 48px -12px rgba(16,24,40,.20);

    /* Type. Nine steps: the app was rendering 26 distinct sizes, nine of
       them crammed between 10.5 and 15px where a 0.5px step is invisible
       individually and, in aggregate, is why nothing quite lines up. */
    --fs-1: 11px;   /* eyebrow, meta, badge      */
    --fs-2: 12px;   /* secondary                 */
    --fs-3: 13px;   /* body — the workhorse      */
    --fs-4: 14px;   /* emphasis                  */
    --fs-5: 16px;   /* card title                */
    --fs-6: 18px;   /* section title             */
    --fs-7: 20px;   /* stat                      */
    --fs-8: 24px;   /* page title                */
    --fs-9: 30px;   /* display                   */

    /* Surface. One edge weight, one radius, one elevation — the card was
       taking all three from per-theme values that disagreed with each
       other (Minimal shipped a 0.04-alpha shadow, i.e. none). */
    --v-edge: color-mix(in oklab, var(--v-text, #000) 15%, transparent);
    --v-edge-strong: color-mix(in oklab, var(--v-text, #000) 26%, transparent);
    --r-card: 16px;
    --pad-card: 18px 20px;
    --sh-card:
      0 1px 2px -1px color-mix(in oklab, var(--v-text, #000) 10%, transparent),
      0 4px 12px -4px color-mix(in oklab, var(--v-text, #000) 8%, transparent),
      0 16px 32px -16px color-mix(in oklab, var(--v-text, #000) 10%, transparent);
    /* A hover/press state as an ink wash rather than filter: brightness(),
       which lightens a dark button and washes out a light one — it cannot be
       correct in both schemes at once. */
    --state-hover: color-mix(in oklab, var(--v-text, #000) 6%, transparent);
    --state-press: color-mix(in oklab, var(--v-text, #000) 11%, transparent);
    /* One control height, so a row of inputs and buttons lines up. */
    --control-h: 38px;
    /* Round icon buttons are square by definition — one token so the touch
       size cannot disagree with the pointer size and render an ellipse. */
    --iconbtn: 38px;

    /* layout */
    --rail-w: 236px;
    --topbar-h: 56px;

    /* safe areas (0 on non-notched devices) */
    --sa-t: env(safe-area-inset-top, 0px);
    --sa-b: env(safe-area-inset-bottom, 0px);
    --sa-l: env(safe-area-inset-left, 0px);
    --sa-r: env(safe-area-inset-right, 0px);

    /* Display face for headline-scale moments (page titles, the brand
       wordmark, the home greeting) — everything else stays on the system
       stack below. One face used sparingly reads as a considered choice;
       a theme may still set its own --v-font-display to opt out. */
    --v-font-display: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --v-edge: color-mix(in oklab, var(--v-text, #fff) 10%, transparent);
    --v-edge-strong: color-mix(in oklab, var(--v-text, #fff) 20%, transparent);
    --sh-1: 0 1px 2px rgba(0,0,0,.40);
    --sh-2: 0 4px 10px -2px rgba(0,0,0,.45);
    --sh-3: 0 14px 28px -8px rgba(0,0,0,.55);
    --sh-4: 0 28px 56px -16px rgba(0,0,0,.65);
  }
  :root[data-scheme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    /* paints behind the app so iOS rubber-band overscroll matches the theme */
    background: var(--v-page-bg, #fafaf8);
    color: var(--v-text, #1a1a1a);
  }
  #root { min-height: 100vh; min-height: 100dvh; }
  ::selection { background: var(--v-accent-soft, rgba(120,120,255,0.3)); }
  input, button, select, textarea { font-family: inherit; }
  button { cursor: pointer; }
  /* long unbroken strings (hashes, JWTs, URLs) must never widen the page */
  pre, code { overflow-wrap: anywhere; }
  img { max-width: 100%; }

  @keyframes vFadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes vFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes vSheetUp { from { transform: translateY(6%); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
  @keyframes vShimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
  @keyframes v-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ---- Cards ---- */
  .v-card {
    position: relative;
    /* Stacking context so the sheen can sit at z-index -1 — above the card
       background, below the content. Without it the ::after composited over
       the text: the FOR YOU label rendered 2.56:1 against a computed 4.97:1. */
    isolation: isolate;
    overflow: hidden;
    transition: transform var(--dur-3) var(--ease), box-shadow var(--dur-3) var(--ease);
    /* backwards, not both — see the note above: "both" retains the final
       transform forever and turns every card into a containing block. */
    animation: vFadeInUp 0.5s var(--ease) backwards;
  }
  /* The card's identity is its edge and its elevation. Nothing is painted
     across the top: see the note above. */
  /* Lift only where a real pointer can hover — on touch this fired on tap and
     made cards jump. Elevation now follows the theme's scheme instead of a
     hardcoded dark shadow that looked like soot on the light themes. */
  @media (hover: hover) and (pointer: fine) {
    /* !important because the border is an inline style — without it this rule
       matches and changes nothing. */
    .v-card:hover, .v-hometile:hover { border-color: var(--v-edge-strong) !important; }
  }

  /* ---- Buttons ---- */
  .v-btn {
    transition: background var(--dur-1) ease, border-color var(--dur-1) ease, box-shadow var(--dur-1) ease;
  }
  /* The fallback shape, for the call sites that never gave one. */
  .v-btn:not(.v-btn--tight):not(.v-navitem):not(.v-navgroup):not(.v-chip):not(.v-themebtn):not(.v-habitcell):not(.v-hometile):not(.v-card):not(.v-segmented__seg) {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 7px;
    min-height: var(--control-h);
    padding: 0 var(--sp-3);
    border-radius: var(--r-sm);
    font-size: var(--fs-3);
    font-weight: 500;
  }
  /* Deliberately no `white-space: nowrap` here. Some buttons are cards —
     the Mechanical Orchard tool tiles carry a wrapped description — and
     forbidding the wrap pushed 158px of text out of the page. */
  @media (hover: hover) and (pointer: fine) {
    .v-btn:hover { box-shadow: inset 0 0 0 999px var(--state-hover); }
    .v-navitem:hover, .v-card:hover, .v-hometile:hover, .v-swatch:hover { box-shadow: none; }
  }
  .v-btn:active { box-shadow: inset 0 0 0 999px var(--state-press); transform: none; }
  /* No opacity: fading the control fades its LABEL, and measured on the
     accentText/accent pair at .55 that is below 4.5:1 in 27 of 28 themes
     (worst 2.28:1). State it as a surface instead, and keep the text readable. */
  .v-btn[disabled], .v-btn:disabled {
    cursor: not-allowed;
    filter: none; transform: none;
    background: color-mix(in oklab, var(--v-text) 7%, transparent) !important;
    color: var(--v-text-muted) !important;
    border-color: var(--v-edge) !important;
    box-shadow: none !important;
  }
  /* Comfortable hit areas on touch. Opt out with .v-btn--tight for deliberately
     tiny controls (habit grid squares, star ratings) that must stay small. */
  @media (pointer: coarse) {
    :root { --control-h: 44px; --iconbtn: 44px; }
    /* min-width as well as min-height: a control can miss the target size on
       either axis, and the delete buttons were missing it on the one nothing
       was checking. */
    .v-btn:not(.v-btn--tight) { min-height: 44px; min-width: 44px; }
    .v-navitem { min-height: 44px; }
  }

  /* ---- Inputs ---- */
  .v-input {
    transition: border-color var(--dur-2) ease, box-shadow var(--dur-2) ease;
    max-width: 100%;
  }
  /* Single-line controls share one height. The line box carries it rather
     than padding, so an inline padding at the call site cannot re-break the
     alignment. Textareas and the deliberately tiny controls opt out. */
  input.v-input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not(.v-input--bare),
  select.v-input:not(.v-input--bare) {
    min-height: var(--control-h);
    padding-top: 0 !important;
    padding-bottom: 0 !important;
    line-height: calc(var(--control-h) - 2px);
  }
  textarea.v-input { min-height: var(--control-h); line-height: 1.55; }

  /* An inline editor keeps the type of whatever it is standing in for. It
     earns its hit area from the padding of the row it sits in, and it says it
     is editable on hover and focus rather than by carrying a permanent box —
     which is the thing that made these tiles look like static captions. */
  .v-input--bare {
    min-height: 0 !important;
    line-height: 1.35 !important;
    padding: 3px 5px !important;
    margin: -3px -5px;
    border-radius: 8px;
    width: 100%;
    background: transparent;
    transition: background var(--dur-1) ease, box-shadow var(--dur-1) ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .v-input--bare:hover { background: var(--state-hover); }
  }
  .v-input--bare:focus-visible { background: var(--state-hover); }

  /* A symbol bound to a field is one thing and must not be broken across
     lines. */
  .v-fieldpair { flex-wrap: nowrap !important; }
  .v-main .v-fieldpair > .v-input,
  .v-fieldpair > .v-input.v-input { min-width: 0 !important; }
  .v-input:focus { outline: none; }
  .v-input:focus-visible,
  input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--v-accent, currentColor);
    outline-offset: 1px;
    box-shadow: 0 0 0 4px var(--v-accent-soft, rgba(0,0,0,0.12));
    border-color: var(--v-accent, currentColor) !important;
  }
  /* The 7-day agenda is a 760px row of fixed columns. On a phone that hid
     four days behind a clip with no scrollbar; below 640px it wraps to a
     2-up grid instead. Above that the row stays, with a right-edge fade so
     the cut reads as "more" rather than as a rendering fault. */
  .v-agenda-days {
    mask-image: linear-gradient(to right, #000 calc(100% - 20px), transparent);
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 20px), transparent);
  }
  .v-agenda-days.is-scrollend { mask-image: none; -webkit-mask-image: none; }
  @media (max-width: 640px) {
    .v-agenda-days {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      overflow-x: visible !important;
      mask-image: none; -webkit-mask-image: none;
    }
  }

  /* Add-rows are laid out for desktop, so on a phone the optional fields get
     squeezed until the placeholder truncates mid-word ("Category (optior").
     Give inputs a floor and let the row wrap rather than compress. The min()
     cap keeps that floor inside whatever column the input sits in, so a grid
     cell can never be forced to overflow. */
  @media (max-width: 640px) {
    .v-main div:has(> .v-input) { flex-wrap: wrap; }
    /* !important because these inputs set minWidth: 0 inline, which otherwise
       wins over any stylesheet rule — the same reason the iOS font-size rule
       below needs it. */
    .v-main .v-input { min-width: min(100%, 15rem) !important; }
    .v-main textarea.v-input { min-width: 100% !important; }
  }

  /* iOS zooms the page when a focused input's text is under 16px. Every input
     in the app sets fontSize inline, so this has to be !important to land. */
  @media (max-width: 640px) {
    .v-input, input, select, textarea, .v-input.v-tabular { font-size: 16px !important; }
    input[type="date"] { min-height: 40px; }
  }

  /* ---- Scrollbars ---- */
  .v-scroll { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb, var(--v-divider, rgba(128,128,128,0.35))) transparent; }
  .v-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .v-scroll::-webkit-scrollbar-track { background: transparent; }
  .v-scroll::-webkit-scrollbar-thumb { background: var(--scroll-thumb, var(--v-divider, rgba(128,128,128,0.35))); border-radius: var(--r-pill); }
  .v-scroll::-webkit-scrollbar-thumb:hover { filter: brightness(1.25); }
  /* horizontal scrollers get momentum + no scroll chaining on touch */
  .v-scroll-x { overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }

  .v-swatch-box { transition: transform var(--dur-2) ease; }
  .v-swatch:hover .v-swatch-box { transform: scale(1.08); }
  .v-tabular { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; font-family: var(--v-font-display, inherit); }

  /* Full-viewport embed shells (SecurityX). dvh keeps mobile browser chrome
     from cropping the frame; the mobile tier also subtracts the top bar. */
  .v-fullshell { height: 100vh; height: 100dvh; }
  @media (max-width: 900px) {
    .v-fullshell { height: calc(100dvh - var(--topbar-h) - var(--sa-t)); }
  }

  /* Icon-only buttons: grow the *hit* area on touch without moving anything.
     A layout-affecting min-width would reflow the dense rows these sit in. */
  .v-iconbtn { position: relative; }
  /* The lane an end-of-row action occupies. See .v-rowact below. */
  :root { --act-rail: 38px; }
  @media (pointer: coarse) { :root { --act-rail: 52px; } }
  /* A row (or tile) whose trailing action floats over it. The padding is the
     whole mechanism: without it the label runs under the button. */
  .v-rowact { position: relative; padding-right: var(--act-rail) !important; }
  .v-rowact > .v-rowact__btn { position: absolute; top: 8px; right: 8px; }
  @media (pointer: coarse) {
    .v-iconbtn::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 44px; height: 44px;
    }
  }

  /* Hover/focus tooltip for icon-only buttons. Driven by [data-tip] rather
     than [title] directly — a small JS delegate (app.jsx) swaps the two on
     hover-in so the browser's own slow, unstyled title tooltip never shows
     up alongside this one. */
  [data-tip] { position: relative; }
  [data-tip]::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: rgba(20,20,24,0.96); color: #fff; font-size: 12px; font-weight: 600;
    padding: 5px 9px; border-radius: 6px; white-space: normal; max-width: 220px;
    text-align: center; pointer-events: none; opacity: 0; z-index: 1200;
    transition: opacity 0.12s ease 0.35s;
  }
  [data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    [data-tip]::after { transition-delay: 0s; }
  }

  /* Touch sizing for the deliberately small controls */
  @media (pointer: coarse) {
    .v-star { font-size: 22px !important; padding: 2px 4px !important; }
    .v-rail-brand { min-height: 44px; }
  }

  .v-rail-utilities > .v-btn:not(.v-themebtn),
  .v-rail-utilities > *:not(.v-themewrap) > .v-btn:not(.v-themebtn) {
    width: var(--iconbtn) !important; height: var(--iconbtn) !important;
    min-width: var(--iconbtn) !important; min-height: var(--iconbtn) !important;
    padding: 0 !important;
    border-radius: 50% !important;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent !important;
    border: 1px solid var(--v-edge) !important;
  }
  /* The theme picker is not an icon button — it names the active theme — so on
     the desktop rail it takes the full width under the icon row rather than
     being squeezed into a circle with its label thrown away. In the phone
     drawer it shares the row: there, height is what is scarce, and a second
     row of chrome costs the navigation more than the label is worth. */
  @media (min-width: 901px) {
    /* :root on each of these. A media query adds no specificity, and the base
       .v-rail-utilities rule — flex-wrap: wrap — is declared earlier in this
       file, so without it the base wins at every desktop width and the foot
       of the rail breaks back onto three rows. Same trap as .v-main. */
    :root .v-rail-utilities { justify-content: flex-start; flex-wrap: nowrap; flex-direction: row; }
    :root .v-rail-utilities > .v-themewrap { flex: 1 1 auto; min-width: 0; }
    :root .v-rail-utilities > .v-themewrap > .v-themebtn { width: 100%; justify-content: flex-start; }
    /* The tray is a grid of equal icons, not a nowrap row — it has five of
       them and the rail is 240px. */
    :root .v-rail-tools__tray { flex-wrap: wrap; justify-content: flex-start; }
  }
  /* The tray of occasional tools. Hidden is hidden — [hidden] is a display
     rule and flex containers override it, which is a classic way to ship an
     invisible row that still takes up space. */
  .v-rail-tools__tray[hidden] { display: none; }
  .v-rail-tools__tray {
    margin-top: 6px;
    padding-top: 8px;
    border-top: 1px solid var(--v-edge);
  }
  .v-rail-tools[aria-expanded="true"] {
    background: var(--state-press) !important;
    color: var(--v-text) !important;
  }

  /* Feed thumbnails (Sports). Class-driven so the column can shrink on phones
     and so the real image and the alignment placeholder can never disagree. */
  .v-feedthumb {
    width: 104px; aspect-ratio: 16 / 10; border-radius: 10px;
    flex-shrink: 0; display: block;
  }
  @media (max-width: 640px) { .v-feedthumb { width: 76px; border-radius: 8px; } }

  /* ---- Ambient depth ----
     A wide, very low-opacity wash of the theme's own accent behind everything.
     It reads as depth rather than colour, and because it is derived from
     --v-accent it suits all 27 themes without per-theme tuning. */
  .v-app { position: relative; isolation: isolate; }
  .v-app::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.13;
    background:
      radial-gradient(760px 420px at 6% -6%, var(--v-accent, transparent), transparent 62%),
      radial-gradient(680px 380px at 96% 4%, var(--v-accent, transparent), transparent 58%);
  }
  :root[data-scheme="dark"] .v-app::before { opacity: 0.20; }

  /* Active navigation: an accent rail plus a soft wash, so the current page is
     legible at a glance instead of relying on a tint alone. */
  .v-navitem { position: relative; }
  .v-navitem.is-active::before {
    content: "";
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 62%;
    border-radius: 0 3px 3px 0;
    background: var(--v-accent);
  }
  .v-navitem.is-active {
    background-image: linear-gradient(90deg, var(--v-accent-soft), transparent 78%);
  }

  /* ---- News feed ---- */
  .v-feedgrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr));
    gap: 12px;
  }
  .v-feedcard {
    display: flex;
    gap: 12px;
    padding: 12px;
    text-decoration: none;
    align-items: flex-start;
    transition: transform var(--dur-2) var(--ease), border-color var(--dur-2) ease, box-shadow var(--dur-2) ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .v-feedcard:hover { transform: translateY(-2px); border-color: var(--v-accent) !important; box-shadow: var(--sh-3); }
  }
  .v-feedart {
    width: 84px; aspect-ratio: 1 / 1; border-radius: 10px;
    flex-shrink: 0; object-fit: cover; display: block;
  }
  .v-feedart--gen { display: flex; align-items: center; justify-content: center; }
  .v-feedart--gen img { width: 26px; height: 26px; border-radius: 6px; background: rgba(255,255,255,.9); padding: 3px; }
  .v-feedcard__body { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1; }
  .v-feedcard__title { font-size: 14px; font-weight: 700; line-height: 1.35; }
  .v-feedcard__sum { font-size: 12.5px; line-height: 1.45; }
  .v-feedcard__meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; margin-top: auto; }
  .v-feedcard__meta img { border-radius: 3px; flex-shrink: 0; }
  @media (max-width: 640px) {
    .v-feedart { width: 68px; }
    .v-feedcard__title { font-size: 13.5px; }
  }

  /* ---- Resume ---- */
  .v-resume__head { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .v-resume__avatar {
    width: 76px; height: 76px; border-radius: 20px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 27px; font-weight: 800; letter-spacing: -0.02em;
    box-shadow: var(--sh-2);
  }
  .v-certgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 10px; }
  .v-cert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 13px; border-radius: var(--r-md); }
  .v-resume__two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; }
  @media (max-width: 640px) {
    .v-resume__avatar { width: 60px; height: 60px; border-radius: 16px; font-size: 21px; }
  }

  /* Print: the resume becomes a clean document — no app chrome, no ambient
     wash, no card shadows, and nothing split awkwardly across a page break. */
  @media print {
    .v-noprint, .v-topbar, .v-rail, .v-scrim, .v-toasts { display: none !important; }
    .v-app::before { display: none !important; }
    .v-main { margin: 0 !important; padding: 0 !important; }
    .v-container { max-width: none !important; padding: 0 !important; }
    .v-resume .v-card {
      border: none !important; box-shadow: none !important; background: #fff !important;
      padding: 0 0 14px !important; break-inside: avoid;
    }
    .v-resume .v-card::before, .v-resume .v-card::after { display: none !important; }
    .v-resume__job, .v-cert { break-inside: avoid; }
    .v-resume, .v-resume * { color: #111 !important; }
    .v-resume__avatar { box-shadow: none !important; }
    .v-certgrid { grid-template-columns: 1fr 1fr !important; }
  }

  /* ---- MO tool help ---- */
  .v-mohelp { border-radius: var(--r-md); padding: 13px 14px; margin-bottom: 18px; }
  .v-mohelp ol { list-style: decimal; }

  /* Home tile watermark — the same visual language as the page banners. */
  .v-hometile { position: relative; overflow: hidden; }
  .v-hometile[draggable="true"] { cursor: grab; }
  .v-hometile--dragging { opacity: 0.4; }
  .v-hometile__mark {
    position: absolute;
    right: -10px; bottom: -14px;
    transform: scale(4.2);
    transform-origin: bottom right;
    opacity: 0.055;
    pointer-events: none;
  }
  :root[data-scheme="dark"] .v-hometile__mark { opacity: 0.085; }
  .v-hometile__glow {
    position: absolute;
    top: -40%; right: -30%;
    width: 70%; height: 70%;
    border-radius: 50%;
    opacity: 0.16;
    filter: blur(30px);
    pointer-events: none;
  }

  /* Home "Snapshots" strip — a horizontally-scrolling row of page photos in
     varied widths, separate from the per-page banner entirely. */
  .v-snaprow {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }
  .v-snapcard {
    position: relative;
    flex: 0 0 auto;
    height: 128px;
    border-radius: var(--r-md, 12px);
    overflow: hidden;
    display: block;
    padding: 0;
  }
  .v-snapcard img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s ease; }
  .v-snapcard:hover img { transform: scale(1.05); }
  .v-snapcard__veil { position: absolute; inset: 0; background: linear-gradient(200deg, transparent 40%, rgba(0,0,0,0.62) 100%); }
  .v-snapcard__label {
    position: absolute; left: 10px; right: 10px; bottom: 8px;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,0.35);
  }
  @media (max-width: 640px) { .v-snapcard { height: 104px; } }

  /* ---- Home layouts ---- */
  .v-home-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .v-home-cmd { display: grid; grid-template-columns: 1fr 1.35fr 0.85fr; gap: 16px; align-items: start; }
  .v-home-brief { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; align-items: start; }
  .v-hometiles--dense { grid-template-columns: repeat(auto-fill, minmax(min(132px, 100%), 1fr)); gap: 10px; }
  .v-hometiles--dense .v-hometile { padding: 12px; gap: 5px; }

  .v-home-bento {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    align-items: stretch;
  }
  .v-bento-a { grid-column: span 2; }
  .v-bento-b { grid-column: span 2; }
  .v-bento-c { grid-column: span 2; }
  .v-bento-d { grid-column: span 1; }
  .v-bento-e { grid-column: span 1; }
  .v-bento-f { grid-column: span 2; }
  .v-home-bento > div { min-width: 0; display: flex; }
  .v-home-bento > div > * { flex: 1; }

  @media (max-width: 1180px) {
    .v-home-cmd { grid-template-columns: 1fr 1fr; }
    .v-home-cmd > .v-home-col:last-child { grid-column: span 2; }
    .v-home-bento { grid-template-columns: repeat(2, 1fr); }
    .v-bento-a, .v-bento-b, .v-bento-c, .v-bento-f { grid-column: span 2; }
    .v-bento-d, .v-bento-e { grid-column: span 1; }
  }
  @media (max-width: 820px) {
    .v-home-cmd, .v-home-brief { grid-template-columns: 1fr; }
    .v-home-cmd > .v-home-col:last-child { grid-column: span 1; }
    .v-home-bento { grid-template-columns: 1fr; }
    .v-home-bento > div { grid-column: span 1 !important; }
  }

  /* Light text links inside card headers — padded enough to tap. */
  .v-linkbtn { padding: 5px 9px; border-radius: var(--r-sm); }
  @media (pointer: coarse) { .v-linkbtn { min-width: 44px; } }

  /* ---- Collapsed rail (desktop) ----
     Icons only, so the whole app gets ~165px of width back without losing
     navigation. Hidden entirely below 900px, where the drawer takes over. */
  .v-rail-collapse { margin-top: 4px; }
  @media (max-width: 900px) { .v-rail-collapse { display: none !important; } }
  @media (min-width: 901px) {
    :root.rail-collapsed { --rail-w: 72px; }
    :root.rail-collapsed .v-navitem__label,
    :root.rail-collapsed .v-navitem__badge,
    :root.rail-collapsed .v-rail-brand__text,
    :root.rail-collapsed .v-railonly,
    :root.rail-collapsed .v-navgroup > span,
    :root.rail-collapsed .v-navgroup svg { display: none !important; } /* beats inline display on the carets */
    :root.rail-collapsed .v-navgroup {
      /* keep a divider where the group heading was */
      height: 1px; padding: 0; margin: 9px 8px 5px; overflow: hidden;
      background: var(--v-divider); border-radius: 1px;
    }
    :root.rail-collapsed .v-navitem,
    :root.rail-collapsed .v-rail-brand,
    :root.rail-collapsed .v-rail-collapse { justify-content: center; }
    :root.rail-collapsed .v-rail-nav > button:first-child { justify-content: center; }
    :root.rail-collapsed .v-navitem.is-active::before { width: 2.5px; }
    /* The theme pill loses its label, so it becomes a round swatch button. */
    :root.rail-collapsed .v-themebtn { padding: 6px; justify-content: center; }
    /* Collapsed to icons the rail is 72px wide, and the utilities row has to
       live inside that. The expanded-rail rules that give the theme picker a
       full-width row (flex: 1 1 auto) and lay the row out horizontally both
       have to be undone here or the picker spills out of the rail. */
    :root.rail-collapsed .v-rail-utilities {
      flex-direction: column;
      flex-wrap: nowrap;
      align-items: center;
    }
    :root.rail-collapsed .v-rail-utilities > .v-themewrap {
      flex: 0 0 auto;
      width: auto;
    }
    :root.rail-collapsed .v-rail-utilities > .v-themewrap > .v-themebtn {
      width: var(--iconbtn); height: var(--iconbtn);
      min-width: var(--iconbtn); min-height: var(--iconbtn);
      padding: 0; border-radius: 50%;
      justify-content: center;
    }
  }

  /* ---- Page header ------------------------------------------------------
     A page names itself in type, on the page's own ground. The icon keeps a
     tinted chip so the header has an anchor and the accent still shows up
     once per page rather than as a 112px band of unrelated colour. */
  .v-pagehead {
    display: flex; align-items: center; gap: 14px;
    padding: 2px 0 18px; margin-bottom: 22px;
    border-bottom: 1px solid var(--v-edge);
    position: relative;
  }
  .v-pagehead__chip {
    flex-shrink: 0; width: 42px; height: 42px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--v-accent-soft); color: var(--v-accent-on);
  }
  .v-pagehead__title {
    margin: 0;
    font-size: var(--fs-8); font-weight: 800; line-height: 1.15;
    letter-spacing: -0.02em; color: var(--v-text);
    font-family: var(--v-font-display, inherit);
    /* A two-word page name should not break one word onto its own line. */
    text-wrap: balance;
  }
  .v-pagehead__sub {
    margin: 3px 0 0;
    font-size: var(--fs-3); line-height: 1.45; color: var(--v-text-muted);
  }
  @media (max-width: 640px) {
    .v-pagehead { gap: 11px; padding-bottom: 14px; margin-bottom: 16px; }
    .v-pagehead__chip { width: 36px; height: 36px; border-radius: 10px; }
  }

  /* A photo the user chose keeps a hero. The scrim is a bottom-weighted
     gradient sized to the text rather than a tint of a hashed hue, so white
     type clears its background whatever the picture is. */
  .v-pagehero {
    position: relative; overflow: hidden;
    border-radius: var(--r-card);
    min-height: 132px; margin-bottom: 22px;
    display: flex; align-items: flex-end;
    box-shadow: var(--sh-card);
    /* A ground of its own, under the photo. The title and subtitle here are
       white because they sit on a scrim over a picture — but between the page
       painting and the picture arriving there is no picture, and on a light
       theme that is white type on a near-white page (measured 1.20:1). It is
       not only the loading window: an image that 404s, or a network that
       blocks it, leaves the page there for good if onError does not fire.
       This makes the hero legible with no image at all. */
    background: #2b2b2f;
  }
  .v-pagehero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .v-pagehero__scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.34) 46%, rgba(0,0,0,0.06) 100%);
  }
  .v-pagehero__text { position: relative; z-index: 1; padding: 18px 22px; }
  .v-pagehero .v-pagehead__title { color: #fff; }
  .v-pagehero .v-pagehead__sub { color: rgba(255,255,255,0.92); }

  /* ---- Per-page banner variants (see PageBanner) ---- */
  .v-banner--corner-img {
    width: 92px; height: 92px; border-radius: 14px; object-fit: cover; flex-shrink: 0;
    box-shadow: 0 6px 18px rgba(0,0,0,0.16);
  }
  @media (max-width: 640px) { .v-banner--corner-img { width: 64px; height: 64px; border-radius: 11px; } }

  /* Banner image control — quiet until you go looking for it. */
  .v-banner-edit {
    position: absolute; top: 10px; right: 10px; z-index: 3;
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 9px;
    border: 1px solid var(--v-edge);
    background: transparent; color: var(--v-text-faint);
    opacity: 0; transition: opacity var(--dur-2) ease;
  }
  /* Over a photo it goes back to glass, where white-on-dark is the legible
     choice and the blur has something to blur. */
  .v-pagehero .v-banner-edit {
    border-color: rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.25); color: #fff;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  div:hover > .v-banner-edit, .v-banner-edit:focus-visible { opacity: 1; }
  @media (pointer: coarse) {
    /* No hover to reveal it on touch, and it needs a real target. */
    .v-banner-edit { opacity: 0.85; width: 40px; height: 40px; }
  }
  .v-banner-edit-panel {
    position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 4;
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 8px; border-radius: var(--r-md);
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }


  /* ---- Toasts ---- */
  .v-toasts {
    position: fixed;
    z-index: 200;
    right: calc(16px + var(--sa-r));
    bottom: calc(16px + var(--sa-b));
    display: flex;
    flex-direction: column-reverse;
    gap: 10px;
    width: min(380px, calc(100vw - 32px));
    pointer-events: none;
  }
  .v-toast {
    pointer-events: auto;
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 12px 12px 16px;
    overflow: hidden;
    box-shadow: var(--sh-4);
    animation: vToastIn var(--dur-3) var(--ease-out) both;
  }
  .v-toast__bar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--toast-tone);
  }
  .v-toast__icon { display: inline-flex; flex-shrink: 0; margin-top: 1px; }
  .v-toast__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .v-toast__title { font-size: 13px; font-weight: 700; }
  .v-toast__msg { font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere; }
  .v-toast__action {
    flex-shrink: 0; border: none; border-radius: var(--r-sm);
    padding: 6px 10px; font-size: 12px; font-weight: 700;
  }
  .v-toast__close {
    flex-shrink: 0; border: none; background: transparent;
    padding: 2px; display: inline-flex; align-items: center;
  }
  @keyframes vToastIn {
    from { opacity: 0; transform: translateY(10px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* On a phone they belong at the top, under the bar, where the thumb isn't. */
  @media (max-width: 640px) {
    .v-toasts {
      right: calc(10px + var(--sa-r));
      left: calc(10px + var(--sa-l));
      width: auto;
      bottom: auto;
      top: calc(var(--topbar-h) + var(--sa-t) + 10px);
      flex-direction: column;
    }
  }

  /* ---- Empty states ---- */
  .v-empty {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 6px; padding: clamp(20px, 4vw, 34px) 16px;
  }
  .v-empty svg { opacity: .9; margin-bottom: 2px; }
  .v-empty__title { font-size: 14.5px; font-weight: 700; }
  .v-empty__msg { font-size: 12.5px; line-height: 1.5; max-width: 42ch; }

  /* Habit streak grid. Fourteen 18px squares are fine with a mouse; on touch
     they need to be bigger, which means showing fewer of them — the last week
     is what matters on a phone anyway. */
  .v-habitcell { width: 18px; height: 18px; }
  @media (pointer: coarse) { .v-habitcell { width: 26px; height: 26px; } }
  @media (max-width: 640px) {
    .v-habitgrid .v-habitcell:nth-child(-n+7) { display: none; }
  }

  /* ---- Skeleton loading ---- */
  .v-skeleton {
    background: linear-gradient(90deg,
      var(--v-chip, rgba(128,128,128,.12)) 25%,
      var(--v-divider, rgba(128,128,128,.22)) 37%,
      var(--v-chip, rgba(128,128,128,.12)) 63%);
    background-size: 800px 100%;
    animation: vShimmer 1.4s linear infinite;
    border-radius: var(--r-sm);
  }

  /* ==========================================================================
     Command rail (desktop) / off-canvas drawer (mobile)
     ========================================================================== */
  .v-rail {
    position: fixed;
    top: var(--v-rail-gap, 0px); left: var(--v-rail-gap, 0px); bottom: var(--v-rail-gap, 0px);
    width: var(--rail-w);
    display: flex;
    flex-direction: column;
    padding: calc(20px + var(--sa-t)) 14px calc(20px + var(--sa-b)) calc(14px + var(--sa-l));
    gap: 22px;
    overflow: visible;
    z-index: 40;
    border-radius: var(--v-rail-radius, 0px);
    box-shadow: var(--v-rail-shadow, none);
  }
  /* Background/blur live on a pseudo-element, not .v-rail itself — a
     backdrop-filter on .v-rail would make it the containing block for
     any position:fixed descendant (the popovers below), confining them
     to the rail's narrow width instead of the viewport. */
  .v-rail::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    background: var(--rail-bg);
    border-right: 1px solid var(--rail-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .v-rail-nav {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 2px;
    /* Fades the last few pixels so a clipped label reads as "more below"
       rather than as a rendering fault. Removed once scrolled to the end. */
    mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent 100%);
  }
  .v-rail-nav.is-scrollend {
    mask-image: none; -webkit-mask-image: none;
  }
  .v-rail-utilities { display: flex; flex-direction: column; gap: 8px; }
  @media (max-width: 900px) {
    /* Stacked, these five cost 232px of drawer height for controls whose
       widths already sum to less than one row. */
    .v-rail-utilities { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px; }
    .v-rail-utilities > * { flex: 0 0 auto; }
  }
  .v-main { margin-left: var(--rail-w); min-width: 0; }

  .v-navitem {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;
    padding: 9px 10px;
    border-radius: var(--r-md);
    cursor: pointer;
    transition: background var(--dur-2) ease, color var(--dur-2) ease;
  }
  .v-navitem:hover { background: var(--navitem-hover, rgba(128,128,128,0.1)); }

  /* Mobile top bar + scrim — hidden on desktop */
  .v-topbar { display: none; }
  .v-scrim { display: none; }

  /* ---- Priority Stream ---- */
  .v-stream-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 14px 4px;
    border-bottom: 1px solid var(--stream-divider, rgba(128,128,128,0.14));
  }
  .v-stream-item:last-child { border-bottom: none; }

  /* ---- Home overview tiles ---- */
  .v-hometiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(132px, 14vw, 168px), 1fr));
    gap: 12px;
  }
  .v-hometile {
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: left;
    border: none;
    cursor: pointer;
    padding: 14px 14px 13px;
    transition: transform var(--dur-2) ease, box-shadow var(--dur-2) ease;
  }
  /* The icon and the label belong on one line; stacking them was most of the
     empty space in the tile. */
  .v-hometile__head { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .v-hometile__head > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (hover: hover) and (pointer: fine) {
    .v-hometile:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
  }

  /* ---- Content container ---- */
  .v-container { width: 100%; margin: 0 auto; padding: clamp(20px, 3.2vw, 34px) clamp(14px, 3vw, 24px) 72px; }
  .v-container--reader { max-width: 820px; }
  .v-container--wide  { max-width: 1200px; }
  .v-container--xwide { max-width: 1320px; }
  .v-container--full  { max-width: none; padding: 0; }

  /* ---- Modals / sheets ---- */
  .v-modal-overlay {
    position: fixed; inset: 0; z-index: 120;
    display: flex; align-items: flex-start; justify-content: center;
    padding: min(6vh, 48px) 16px;
    background: rgba(0,0,0,0.6);
    animation: vFadeIn var(--dur-2) ease both;
    overscroll-behavior: contain;
  }
  .v-modal-card {
    width: 100%; max-width: 820px;
    max-height: 88vh; max-height: 88dvh;
    overflow-y: auto;
    animation: vFadeInUp var(--dur-3) var(--ease-out) both;
  }
  /* Phone: become a bottom sheet that uses the full width and most of the height */
  @media (max-width: 640px) {
    .v-modal-overlay { align-items: flex-end; padding: 0; }
    .v-modal-card {
      max-width: 100%;
      max-height: 94vh; max-height: 94dvh;
      border-radius: var(--r-xl) var(--r-xl) 0 0 !important;
      border-bottom: none !important;
      padding: 20px 16px calc(20px + var(--sa-b)) !important;
      animation: vSheetUp var(--dur-3) var(--ease-out) both;
    }
  }

  /* ---- Segmented control ------------------------------------------------
     One track, one thumb: exactly one of these is true at a time. Deliberately
     unlike .v-btn — a choice and an action should not be the same picture.

     The track scrolls sideways rather than wrapping. Five decode modes on a
     390px phone wrapped to three rows of chrome above a text area that had
     260px left; as a strip it is one row and the overflow is a swipe. */
  .v-segmented {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 3px;
    border-radius: 999px;
    border: 1px solid var(--v-edge);
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
    /* Shrink to content, but never past it. */
    width: fit-content;
  }
  .v-segmented::-webkit-scrollbar { display: none; }
  .v-segmented__seg {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 30px;
    padding: 0 14px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-size: var(--fs-2);
    font-weight: 600;
    letter-spacing: 0;
    white-space: nowrap;
    cursor: pointer;
  }
  .v-segmented--sm .v-segmented__seg { min-height: 26px; padding: 0 11px; font-size: var(--fs-1); }
  .v-segmented--sm { padding: 2px; }
  /* On touch the segments take the 44px target like every other control, so
     the track loses its inset instead of adding to it. */
  @media (pointer: coarse) {
    .v-segmented, .v-segmented--sm { padding: 2px; }
  }
  /* The thumb. A shadow rather than a border, so the track's rhythm is not
     broken by a line appearing and disappearing as the selection moves. */
  .v-segmented__seg.is-on {
    box-shadow: 0 1px 2px rgba(0,0,0,0.10), 0 1px 1px rgba(0,0,0,0.06);
    font-weight: 700;
  }
  @media (hover: hover) and (pointer: fine) {
    .v-segmented__seg:not(.is-on):hover { background: var(--state-hover) !important; color: var(--v-text) !important; }
  }
  .v-segmented__seg:focus-visible { outline: 2px solid var(--v-accent); outline-offset: -2px; }

  /* ---- All-pages directory ---------------------------------------------
     The map of the app: every page and every tool on one screen. Wider than a
     normal modal because its whole value is showing everything at once. */
  .v-dir { max-width: min(1040px, 94vw); }
  .v-dir__head { display: flex; align-items: center; gap: 10px; }
  .v-dir__head .v-input { min-height: 40px; }
  .v-dir__grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 12.5rem), 1fr));
    gap: 8px;
  }
  .v-dir__item {
    display: flex; align-items: center; gap: 9px;
    min-height: 40px; padding: 0 11px;
    border-radius: 10px;
    font-size: var(--fs-3); font-weight: 500;
    text-align: left;
  }
  @media (hover: hover) and (pointer: fine) {
    .v-dir__item:hover { background: var(--state-hover) !important; border-color: var(--v-edge-strong) !important; }
  }
  /* A page never opened. Retires itself once everything has been seen once. */
  .v-dir__dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--v-accent);
  }
  @media (max-width: 640px) {
    .v-dir { max-width: 100%; }
    .v-dir__grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 10rem), 1fr)); }
  }

  /* --- Mechanical Orchard dashboard --------------------------------------
     The status strip and the tool grid are both "as many as fit, minimum
     legible width" — auto-fit rather than a fixed column count, so the same
     rule serves a phone, a laptop and an ultrawide without breakpoints. The
     stat cards get a smaller minimum than the tool cards because they hold a
     number and a line, not a number and a paragraph. */
  .v-mo-stats {
    display: grid;
    /* 13rem rather than something roomier so all five status cards fit one
       row at a normal laptop width — a lone fifth card wrapping onto its own
       row reads as a different section rather than as the end of this one. */
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr));
    gap: 12px;
  }
  .v-mo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr));
    gap: 12px;
  }
  /* A tool card is a button, so it has to say so on hover and focus without
     moving the text — the cards sit in a grid and any size change would
     shove its neighbours. Border colour and lift only. */
  .v-mo-tool {
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .v-mo-tool:hover,
  .v-mo-tool:focus-visible {
    border-color: var(--mo-tool-border, var(--v-accent, currentColor)) !important;
    transform: translateY(-2px);
    box-shadow: var(--sh-2, 0 6px 18px rgba(0,0,0,0.10));
  }
  @media (prefers-reduced-motion: reduce) {
    .v-mo-tool { transition: none; }
    .v-mo-tool:hover, .v-mo-tool:focus-visible { transform: none; }
  }
  /* A tool rendered in the page rather than in a dialog. The modal card had a
     max-height and its own scrollbar because it floated; in the page the
     document scrolls, so neither applies. */
  .v-mo-panel { animation: vFadeInUp 0.16s ease both; }

  /* ---- Focus ring: visible on every theme (accent + a contrasting halo) ---- */
  .v-btn:focus-visible, .v-navitem:focus-visible, .v-swatch:focus-visible,
  .v-hometile:focus-visible, .v-rail-brand:focus-visible,
  a:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 2px solid var(--v-accent, #4d9bff);
    outline-offset: 2px;
    box-shadow: 0 0 0 4px var(--v-accent-soft, rgba(120,120,255,0.4));
    border-radius: var(--r-sm);
  }

  /* ==========================================================================
     Breakpoints
     1080px — narrow the rail so content keeps room on small laptops
      900px — rail becomes an off-canvas drawer behind a top bar
      640px — phone: sheets, tighter gutters, single-column grids
     ========================================================================== */
  @media (max-width: 1080px) {
    :root { --rail-w: 208px; }
  }

  @media (max-width: 900px) {
    .v-rail {
      --drawer-w: min(310px, 86vw);
      width: var(--drawer-w);
      left: calc(-1 * var(--drawer-w) - 12px);
      visibility: hidden;
      transition: left var(--dur-3) var(--ease-out), visibility 0s linear var(--dur-3);
      box-shadow: var(--sh-4);
      padding-top: calc(16px + var(--sa-t));
    }
    .v-rail.is-open {
      left: 0;
      visibility: visible;
      transition: left var(--dur-3) var(--ease-out), visibility 0s;
    }
    .v-rail::before { border-right: 1px solid var(--rail-border); }
    .v-main { margin-left: 0; padding-top: calc(var(--topbar-h) + var(--sa-t)); }

    .v-topbar {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 10px;
      height: calc(var(--topbar-h) + var(--sa-t));
      padding: var(--sa-t) calc(12px + var(--sa-r)) 0 calc(12px + var(--sa-l));
      background: var(--rail-bg, var(--v-page-bg));
      border-bottom: 1px solid var(--rail-border, var(--v-divider));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .v-scrim {
      display: block;
      position: fixed; inset: 0;
      z-index: 39;
      background: rgba(0,0,0,0.5);
      animation: vFadeIn var(--dur-2) ease both;
      border: none;
      width: 100%;
    }
    /* the drawer owns the whole viewport height on mobile */
    .v-rail-nav { padding-bottom: 8px; }
  }

  @media (max-width: 640px) {
    .v-hometiles { grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 10px; }
    .v-card { border-radius: var(--r-lg) !important; }
  }

  @media (max-width: 400px) {
    .v-hometiles { grid-template-columns: 1fr 1fr; gap: 8px; }
  }

  /* Wide screens: let dense pages breathe instead of a narrow ribbon */
  @media (min-width: 1600px) {
    .v-container--wide { max-width: 1360px; }
    .v-container--xwide { max-width: 1480px; }
  }

  /* ---- Reduced motion ---- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .v-card:hover, .v-btn:hover, .v-hometile:hover { transform: none !important; }
  }

  /* ---- Print ---- */
  @media print {
    .v-rail, .v-topbar, .v-scrim { display: none !important; }
    .v-main { margin-left: 0 !important; padding-top: 0 !important; }
    .v-card { box-shadow: none !important; break-inside: avoid; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Optional calendar integrations: only used if you connect Google via the header. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- pdf.js (PDF statement/report reading), fflate (PPTX zip read/write), msal-browser
     (Outlook calendar), and heic-to (HEIC photo conversion) used to load unconditionally
     here on every page view, whether or not that page's feature was ever touched. They're
     now pulled on demand instead, the same way SheetJS/ExcelJS/mammoth/pdfmake already
     are elsewhere in this app (see the loadPdfJs/loadFflate/loadMsal/loadHeicTo helpers
     in app.jsx) — same features, no longer part of every page's baseline weight. -->

<!--APP-->

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        /* offline app-shell caching is a nice-to-have, not required */
      });
    });
  }
</script>
</body>
</html>
