  :root {
    /* spacing scale */
    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
    --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

    /* radius scale */
    --r-xs: 6px; --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-pill: 999px;

    /* motion */
    --ease: cubic-bezier(.2,.8,.2,1);
    --ease-out: cubic-bezier(.16,1,.3,1);
    --dur-1: 120ms; --dur-2: 180ms; --dur-3: 260ms;

    /* elevation — light default, re-stepped for dark below */
    --sh-1: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --sh-2: 0 4px 8px -2px rgba(16,24,40,.10), 0 2px 4px -2px rgba(16,24,40,.06);
    --sh-3: 0 12px 24px -6px rgba(16,24,40,.14), 0 4px 8px -4px rgba(16,24,40,.08);
    --sh-4: 0 24px 48px -12px rgba(16,24,40,.20);

    /* layout */
    --rail-w: 236px;
    --topbar-h: 56px;

    /* safe areas (0 on non-notched devices) */
    --sa-t: env(safe-area-inset-top, 0px);
    --sa-b: env(safe-area-inset-bottom, 0px);
    --sa-l: env(safe-area-inset-left, 0px);
    --sa-r: env(safe-area-inset-right, 0px);
  }
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --sh-1: 0 1px 2px rgba(0,0,0,.40);
    --sh-2: 0 4px 10px -2px rgba(0,0,0,.45);
    --sh-3: 0 14px 28px -8px rgba(0,0,0,.55);
    --sh-4: 0 28px 56px -16px rgba(0,0,0,.65);
  }
  :root[data-scheme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    /* paints behind the app so iOS rubber-band overscroll matches the theme */
    background: var(--v-page-bg, #fafaf8);
    color: var(--v-text, #1a1a1a);
  }
  #root { min-height: 100vh; min-height: 100dvh; }
  ::selection { background: var(--v-accent-soft, rgba(120,120,255,0.3)); }
  input, button, select, textarea { font-family: inherit; }
  button { cursor: pointer; }
  /* long unbroken strings (hashes, JWTs, URLs) must never widen the page */
  pre, code { overflow-wrap: anywhere; }
  img { max-width: 100%; }

  @keyframes vFadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes vFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes vSheetUp { from { transform: translateY(6%); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
  @keyframes vShimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
  @keyframes v-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ---- Cards ---- */
  .v-card {
    position: relative;
    /* Stacking context so the sheen can sit at z-index -1 — above the card
       background, below the content. Without it the ::after composited over
       the text: the FOR YOU label rendered 2.56:1 against a computed 4.97:1. */
    isolation: isolate;
    overflow: hidden;
    transition: transform var(--dur-3) var(--ease), box-shadow var(--dur-3) var(--ease);
    animation: vFadeInUp 0.5s var(--ease) both;
  }
  .v-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent-line, transparent);
    opacity: 0.6;
  }
  /* A stat tile is small enough that a full-width bar dominates it — reduce it
     to a short mark that reads as an accent rather than a rule. */
  .v-hometile::before { height: 2px; width: 34px; opacity: 0.75; border-radius: 0 0 2px 0; }
  /* Lift only where a real pointer can hover — on touch this fired on tap and
     made cards jump. Elevation now follows the theme's scheme instead of a
     hardcoded dark shadow that looked like soot on the light themes. */
  @media (hover: hover) and (pointer: fine) {
    .v-card:hover { transform: translateY(-3px); box-shadow: var(--sh-3) !important; }
  }

  /* ---- Buttons ---- */
  .v-btn { transition: transform var(--dur-1) ease, filter var(--dur-1) ease, background var(--dur-1) ease; }
  @media (hover: hover) and (pointer: fine) {
    .v-btn:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: inset 0 0 0 999px rgba(127,127,127,0.09); }
    .v-navitem:hover, .v-card:hover, .v-hometile:hover, .v-swatch:hover { box-shadow: none; }
  }
  .v-btn:active { filter: brightness(0.95); transform: translateY(0); }
  .v-btn[disabled], .v-btn:disabled { cursor: not-allowed; opacity: .55; filter: none; transform: none; }
  /* Comfortable hit areas on touch. Opt out with .v-btn--tight for deliberately
     tiny controls (habit grid squares, star ratings) that must stay small. */
  @media (pointer: coarse) {
    .v-btn:not(.v-btn--tight) { min-height: 40px; }
    .v-navitem { min-height: 44px; }
  }

  /* ---- Inputs ---- */
  .v-input { transition: border-color var(--dur-2) ease, box-shadow var(--dur-2) ease; max-width: 100%; }
  .v-input:focus { outline: none; }
  .v-input:focus-visible,
  input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--v-accent, currentColor);
    outline-offset: 1px;
    box-shadow: 0 0 0 4px var(--v-accent-soft, rgba(0,0,0,0.12));
    border-color: var(--v-accent, currentColor) !important;
  }
  /* The 7-day agenda is a 760px row of fixed columns. On a phone that hid
     four days behind a clip with no scrollbar; below 640px it wraps to a
     2-up grid instead. Above that the row stays, with a right-edge fade so
     the cut reads as "more" rather than as a rendering fault. */
  .v-agenda-days {
    mask-image: linear-gradient(to right, #000 calc(100% - 20px), transparent);
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 20px), transparent);
  }
  .v-agenda-days.is-scrollend { mask-image: none; -webkit-mask-image: none; }
  @media (max-width: 640px) {
    .v-agenda-days {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      overflow-x: visible !important;
      mask-image: none; -webkit-mask-image: none;
    }
  }

  /* Add-rows are laid out for desktop, so on a phone the optional fields get
     squeezed until the placeholder truncates mid-word ("Category (optior").
     Give inputs a floor and let the row wrap rather than compress. The min()
     cap keeps that floor inside whatever column the input sits in, so a grid
     cell can never be forced to overflow. */
  @media (max-width: 640px) {
    .v-main div:has(> .v-input) { flex-wrap: wrap; }
    /* !important because these inputs set minWidth: 0 inline, which otherwise
       wins over any stylesheet rule — the same reason the iOS font-size rule
       below needs it. */
    .v-main .v-input { min-width: min(100%, 15rem) !important; }
    .v-main textarea.v-input { min-width: 100% !important; }
  }

  /* iOS zooms the page when a focused input's text is under 16px. Every input
     in the app sets fontSize inline, so this has to be !important to land. */
  @media (max-width: 640px) {
    .v-input, input, select, textarea, .v-input.v-tabular { font-size: 16px !important; }
    input[type="date"] { min-height: 40px; }
  }

  /* ---- Scrollbars ---- */
  .v-scroll { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb, var(--v-divider, rgba(128,128,128,0.35))) transparent; }
  .v-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .v-scroll::-webkit-scrollbar-track { background: transparent; }
  .v-scroll::-webkit-scrollbar-thumb { background: var(--scroll-thumb, var(--v-divider, rgba(128,128,128,0.35))); border-radius: var(--r-pill); }
  .v-scroll::-webkit-scrollbar-thumb:hover { filter: brightness(1.25); }
  /* horizontal scrollers get momentum + no scroll chaining on touch */
  .v-scroll-x { overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }

  .v-swatch-box { transition: transform var(--dur-2) ease; }
  .v-swatch:hover .v-swatch-box { transform: scale(1.08); }
  .v-tabular { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; font-family: var(--v-font-display, inherit); }

  /* Full-viewport embed shells (SecurityX). dvh keeps mobile browser chrome
     from cropping the frame; the mobile tier also subtracts the top bar. */
  .v-fullshell { height: 100vh; height: 100dvh; }
  @media (max-width: 900px) {
    .v-fullshell { height: calc(100dvh - var(--topbar-h) - var(--sa-t)); }
  }

  /* Icon-only buttons: grow the *hit* area on touch without moving anything.
     A layout-affecting min-width would reflow the dense rows these sit in. */
  .v-iconbtn { position: relative; }
  @media (pointer: coarse) {
    .v-iconbtn::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 44px; height: 44px;
    }
  }

  /* Touch sizing for the deliberately small controls */
  @media (pointer: coarse) {
    .v-star { font-size: 22px !important; padding: 2px 4px !important; }
    .v-rail-brand { min-height: 44px; }
  }

  /* Feed thumbnails (Sports). Class-driven so the column can shrink on phones
     and so the real image and the alignment placeholder can never disagree. */
  .v-feedthumb {
    width: 104px; aspect-ratio: 16 / 10; border-radius: 10px;
    flex-shrink: 0; display: block;
  }
  @media (max-width: 640px) { .v-feedthumb { width: 76px; border-radius: 8px; } }

  /* ---- Ambient depth ----
     A wide, very low-opacity wash of the theme's own accent behind everything.
     It reads as depth rather than colour, and because it is derived from
     --v-accent it suits all 27 themes without per-theme tuning. */
  .v-app { position: relative; isolation: isolate; }
  .v-app::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.13;
    background:
      radial-gradient(760px 420px at 6% -6%, var(--v-accent, transparent), transparent 62%),
      radial-gradient(680px 380px at 96% 4%, var(--v-accent, transparent), transparent 58%);
  }
  :root[data-scheme="dark"] .v-app::before { opacity: 0.20; }

  /* Cards get a faint top sheen so they read as lit surfaces rather than flat
     rectangles. Clipped by the existing overflow:hidden. */
  .v-card::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0) 42%);
  }
  :root[data-scheme="light"] .v-card::after {
    background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0) 46%);
    mix-blend-mode: overlay;
  }
  @media (hover: hover) and (pointer: fine) {
    .v-card:hover { border-color: var(--v-accent) !important; }
  }

  /* Active navigation: an accent rail plus a soft wash, so the current page is
     legible at a glance instead of relying on a tint alone. */
  .v-navitem { position: relative; }
  .v-navitem.is-active::before {
    content: "";
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 62%;
    border-radius: 0 3px 3px 0;
    background: var(--v-accent);
  }
  .v-navitem.is-active {
    background-image: linear-gradient(90deg, var(--v-accent-soft), transparent 78%);
  }

  /* ---- News feed ---- */
  .v-feedgrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr));
    gap: 12px;
  }
  .v-feedcard {
    display: flex;
    gap: 12px;
    padding: 12px;
    text-decoration: none;
    align-items: flex-start;
    transition: transform var(--dur-2) var(--ease), border-color var(--dur-2) ease, box-shadow var(--dur-2) ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .v-feedcard:hover { transform: translateY(-2px); border-color: var(--v-accent) !important; box-shadow: var(--sh-3); }
  }
  .v-feedart {
    width: 84px; aspect-ratio: 1 / 1; border-radius: 10px;
    flex-shrink: 0; object-fit: cover; display: block;
  }
  .v-feedart--gen { display: flex; align-items: center; justify-content: center; }
  .v-feedart--gen img { width: 26px; height: 26px; border-radius: 6px; background: rgba(255,255,255,.9); padding: 3px; }
  .v-feedcard__body { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1; }
  .v-feedcard__title { font-size: 14px; font-weight: 700; line-height: 1.35; }
  .v-feedcard__sum { font-size: 12.5px; line-height: 1.45; }
  .v-feedcard__meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; margin-top: auto; }
  .v-feedcard__meta img { border-radius: 3px; flex-shrink: 0; }
  @media (max-width: 640px) {
    .v-feedart { width: 68px; }
    .v-feedcard__title { font-size: 13.5px; }
  }

  /* ---- Resume ---- */
  .v-resume__head { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .v-resume__avatar {
    width: 76px; height: 76px; border-radius: 20px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 27px; font-weight: 800; letter-spacing: -0.02em;
    box-shadow: var(--sh-2);
  }
  .v-certgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 10px; }
  .v-cert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 13px; border-radius: var(--r-md); }
  .v-resume__two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; }
  @media (max-width: 640px) {
    .v-resume__avatar { width: 60px; height: 60px; border-radius: 16px; font-size: 21px; }
  }

  /* Print: the resume becomes a clean document — no app chrome, no ambient
     wash, no card shadows, and nothing split awkwardly across a page break. */
  @media print {
    .v-noprint, .v-topbar, .v-rail, .v-scrim, .v-toasts { display: none !important; }
    .v-app::before { display: none !important; }
    .v-main { margin: 0 !important; padding: 0 !important; }
    .v-container { max-width: none !important; padding: 0 !important; }
    .v-resume .v-card {
      border: none !important; box-shadow: none !important; background: #fff !important;
      padding: 0 0 14px !important; break-inside: avoid;
    }
    .v-resume .v-card::before, .v-resume .v-card::after { display: none !important; }
    .v-resume__job, .v-cert { break-inside: avoid; }
    .v-resume, .v-resume * { color: #111 !important; }
    .v-resume__avatar { box-shadow: none !important; }
    .v-certgrid { grid-template-columns: 1fr 1fr !important; }
  }

  /* ---- MO tool help ---- */
  .v-mohelp { border-radius: var(--r-md); padding: 13px 14px; margin-bottom: 18px; }
  .v-mohelp ol { list-style: decimal; }

  /* Home tile watermark — the same visual language as the page banners. */
  .v-hometile { position: relative; overflow: hidden; }
  .v-hometile[draggable="true"] { cursor: grab; }
  .v-hometile--dragging { opacity: 0.4; }
  .v-hometile__mark {
    position: absolute;
    right: -10px; bottom: -14px;
    transform: scale(4.2);
    transform-origin: bottom right;
    opacity: 0.055;
    pointer-events: none;
  }
  :root[data-scheme="dark"] .v-hometile__mark { opacity: 0.085; }
  .v-hometile__glow {
    position: absolute;
    top: -40%; right: -30%;
    width: 70%; height: 70%;
    border-radius: 50%;
    opacity: 0.16;
    filter: blur(30px);
    pointer-events: none;
  }

  /* Home "Snapshots" strip — a horizontally-scrolling row of page photos in
     varied widths, separate from the per-page banner entirely. */
  .v-snaprow {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }
  .v-snapcard {
    position: relative;
    flex: 0 0 auto;
    height: 128px;
    border-radius: var(--r-md, 12px);
    overflow: hidden;
    display: block;
    padding: 0;
  }
  .v-snapcard img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s ease; }
  .v-snapcard:hover img { transform: scale(1.05); }
  .v-snapcard__veil { position: absolute; inset: 0; background: linear-gradient(200deg, transparent 40%, rgba(0,0,0,0.62) 100%); }
  .v-snapcard__label {
    position: absolute; left: 10px; right: 10px; bottom: 8px;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,0.35);
  }
  @media (max-width: 640px) { .v-snapcard { height: 104px; } }

  /* ---- Home layouts ---- */
  .v-home-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .v-home-cmd { display: grid; grid-template-columns: 1fr 1.35fr 0.85fr; gap: 16px; align-items: start; }
  .v-home-brief { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; align-items: start; }
  .v-hometiles--dense { grid-template-columns: repeat(auto-fill, minmax(min(132px, 100%), 1fr)); gap: 10px; }
  .v-hometiles--dense .v-hometile { padding: 12px; gap: 5px; }

  .v-home-bento {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    align-items: stretch;
  }
  .v-bento-a { grid-column: span 2; }
  .v-bento-b { grid-column: span 2; }
  .v-bento-c { grid-column: span 2; }
  .v-bento-d { grid-column: span 1; }
  .v-bento-e { grid-column: span 1; }
  .v-bento-f { grid-column: span 2; }
  .v-home-bento > div { min-width: 0; display: flex; }
  .v-home-bento > div > * { flex: 1; }

  @media (max-width: 1180px) {
    .v-home-cmd { grid-template-columns: 1fr 1fr; }
    .v-home-cmd > .v-home-col:last-child { grid-column: span 2; }
    .v-home-bento { grid-template-columns: repeat(2, 1fr); }
    .v-bento-a, .v-bento-b, .v-bento-c, .v-bento-f { grid-column: span 2; }
    .v-bento-d, .v-bento-e { grid-column: span 1; }
  }
  @media (max-width: 820px) {
    .v-home-cmd, .v-home-brief { grid-template-columns: 1fr; }
    .v-home-cmd > .v-home-col:last-child { grid-column: span 1; }
    .v-home-bento { grid-template-columns: 1fr; }
    .v-home-bento > div { grid-column: span 1 !important; }
  }

  /* Light text links inside card headers — padded enough to tap. */
  .v-linkbtn { padding: 5px 9px; border-radius: var(--r-sm); }
  @media (pointer: coarse) { .v-linkbtn { min-width: 44px; } }

  /* ---- Collapsed rail (desktop) ----
     Icons only, so the whole app gets ~165px of width back without losing
     navigation. Hidden entirely below 900px, where the drawer takes over. */
  .v-rail-collapse { margin-top: 4px; }
  @media (max-width: 900px) { .v-rail-collapse { display: none !important; } }
  @media (min-width: 901px) {
    :root.rail-collapsed { --rail-w: 72px; }
    :root.rail-collapsed .v-navitem__label,
    :root.rail-collapsed .v-navitem__badge,
    :root.rail-collapsed .v-rail-brand__text,
    :root.rail-collapsed .v-railonly,
    :root.rail-collapsed .v-navgroup > span,
    :root.rail-collapsed .v-navgroup svg { display: none !important; } /* beats inline display on the carets */
    :root.rail-collapsed .v-navgroup {
      /* keep a divider where the group heading was */
      height: 1px; padding: 0; margin: 9px 8px 5px; overflow: hidden;
      background: var(--v-divider); border-radius: 1px;
    }
    :root.rail-collapsed .v-navitem,
    :root.rail-collapsed .v-rail-brand,
    :root.rail-collapsed .v-rail-collapse { justify-content: center; }
    :root.rail-collapsed .v-rail-nav > button:first-child { justify-content: center; }
    :root.rail-collapsed .v-navitem.is-active::before { width: 2.5px; }
    /* The theme pill loses its label, so it becomes a round swatch button. */
    :root.rail-collapsed .v-themebtn { padding: 6px; justify-content: center; }
  }

  /* ---- Per-page banner variants (see PageBanner) ---- */
  .v-banner--corner-img {
    width: 92px; height: 92px; border-radius: 14px; object-fit: cover; flex-shrink: 0;
    box-shadow: 0 6px 18px rgba(0,0,0,0.16);
  }
  @media (max-width: 640px) { .v-banner--corner-img { width: 64px; height: 64px; border-radius: 11px; } }

  /* Banner image control — quiet until you go looking for it. */
  .v-banner-edit {
    position: absolute; top: 10px; right: 10px; z-index: 3;
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.25); color: #fff;
    opacity: 0; transition: opacity var(--dur-2) ease;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  div:hover > .v-banner-edit, .v-banner-edit:focus-visible { opacity: 1; }
  @media (pointer: coarse) {
    /* No hover to reveal it on touch, and it needs a real target. */
    .v-banner-edit { opacity: 0.85; width: 40px; height: 40px; }
  }
  .v-banner-edit-panel {
    position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 4;
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 8px; border-radius: var(--r-md);
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }


  /* ---- Toasts ---- */
  .v-toasts {
    position: fixed;
    z-index: 200;
    right: calc(16px + var(--sa-r));
    bottom: calc(16px + var(--sa-b));
    display: flex;
    flex-direction: column-reverse;
    gap: 10px;
    width: min(380px, calc(100vw - 32px));
    pointer-events: none;
  }
  .v-toast {
    pointer-events: auto;
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 12px 12px 16px;
    overflow: hidden;
    box-shadow: var(--sh-4);
    animation: vToastIn var(--dur-3) var(--ease-out) both;
  }
  .v-toast__bar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--toast-tone);
  }
  .v-toast__icon { display: inline-flex; flex-shrink: 0; margin-top: 1px; }
  .v-toast__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .v-toast__title { font-size: 13px; font-weight: 700; }
  .v-toast__msg { font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere; }
  .v-toast__action {
    flex-shrink: 0; border: none; border-radius: var(--r-sm);
    padding: 6px 10px; font-size: 12px; font-weight: 700;
  }
  .v-toast__close {
    flex-shrink: 0; border: none; background: transparent;
    padding: 2px; display: inline-flex; align-items: center;
  }
  @keyframes vToastIn {
    from { opacity: 0; transform: translateY(10px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* On a phone they belong at the top, under the bar, where the thumb isn't. */
  @media (max-width: 640px) {
    .v-toasts {
      right: calc(10px + var(--sa-r));
      left: calc(10px + var(--sa-l));
      width: auto;
      bottom: auto;
      top: calc(var(--topbar-h) + var(--sa-t) + 10px);
      flex-direction: column;
    }
  }

  /* ---- Empty states ---- */
  .v-empty {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 6px; padding: clamp(20px, 4vw, 34px) 16px;
  }
  .v-empty svg { opacity: .9; margin-bottom: 2px; }
  .v-empty__title { font-size: 14.5px; font-weight: 700; }
  .v-empty__msg { font-size: 12.5px; line-height: 1.5; max-width: 42ch; }

  /* Habit streak grid. Fourteen 18px squares are fine with a mouse; on touch
     they need to be bigger, which means showing fewer of them — the last week
     is what matters on a phone anyway. */
  .v-habitcell { width: 18px; height: 18px; }
  @media (pointer: coarse) { .v-habitcell { width: 26px; height: 26px; } }
  @media (max-width: 640px) {
    .v-habitgrid .v-habitcell:nth-child(-n+7) { display: none; }
  }

  /* ---- Skeleton loading ---- */
  .v-skeleton {
    background: linear-gradient(90deg,
      var(--v-chip, rgba(128,128,128,.12)) 25%,
      var(--v-divider, rgba(128,128,128,.22)) 37%,
      var(--v-chip, rgba(128,128,128,.12)) 63%);
    background-size: 800px 100%;
    animation: vShimmer 1.4s linear infinite;
    border-radius: var(--r-sm);
  }

  /* ==========================================================================
     Command rail (desktop) / off-canvas drawer (mobile)
     ========================================================================== */
  .v-rail {
    position: fixed;
    top: var(--v-rail-gap, 0px); left: var(--v-rail-gap, 0px); bottom: var(--v-rail-gap, 0px);
    width: var(--rail-w);
    display: flex;
    flex-direction: column;
    padding: calc(20px + var(--sa-t)) 14px calc(20px + var(--sa-b)) calc(14px + var(--sa-l));
    gap: 22px;
    overflow: visible;
    z-index: 40;
    border-radius: var(--v-rail-radius, 0px);
    box-shadow: var(--v-rail-shadow, none);
  }
  /* Background/blur live on a pseudo-element, not .v-rail itself — a
     backdrop-filter on .v-rail would make it the containing block for
     any position:fixed descendant (the popovers below), confining them
     to the rail's narrow width instead of the viewport. */
  .v-rail::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    background: var(--rail-bg);
    border-right: 1px solid var(--rail-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .v-rail-nav {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 2px;
    /* Fades the last few pixels so a clipped label reads as "more below"
       rather than as a rendering fault. Removed once scrolled to the end. */
    mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent 100%);
  }
  .v-rail-nav.is-scrollend {
    mask-image: none; -webkit-mask-image: none;
  }
  .v-rail-utilities { display: flex; flex-direction: column; gap: 8px; }
  @media (max-width: 900px) {
    /* Stacked, these five cost 232px of drawer height for controls whose
       widths already sum to less than one row. */
    .v-rail-utilities { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px; }
    .v-rail-utilities > * { flex: 0 0 auto; }
  }
  .v-main { margin-left: var(--rail-w); min-width: 0; }

  .v-navitem {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;
    padding: 9px 10px;
    border-radius: var(--r-md);
    cursor: pointer;
    transition: background var(--dur-2) ease, color var(--dur-2) ease;
  }
  .v-navitem:hover { background: var(--navitem-hover, rgba(128,128,128,0.1)); }

  /* Mobile top bar + scrim — hidden on desktop */
  .v-topbar { display: none; }
  .v-scrim { display: none; }

  /* ---- Priority Stream ---- */
  .v-stream-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 14px 4px;
    border-bottom: 1px solid var(--stream-divider, rgba(128,128,128,0.14));
  }
  .v-stream-item:last-child { border-bottom: none; }

  /* ---- Home overview tiles ---- */
  .v-hometiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(132px, 14vw, 168px), 1fr));
    gap: 12px;
  }
  .v-hometile {
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: left;
    border: none;
    cursor: pointer;
    padding: 14px 14px 13px;
    transition: transform var(--dur-2) ease, box-shadow var(--dur-2) ease;
  }
  /* The icon and the label belong on one line; stacking them was most of the
     empty space in the tile. */
  .v-hometile__head { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .v-hometile__head > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (hover: hover) and (pointer: fine) {
    .v-hometile:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
  }

  /* ---- Content container ---- */
  .v-container { width: 100%; margin: 0 auto; padding: clamp(20px, 3.2vw, 34px) clamp(14px, 3vw, 24px) 72px; }
  .v-container--reader { max-width: 820px; }
  .v-container--wide  { max-width: 1200px; }
  .v-container--xwide { max-width: 1320px; }
  .v-container--full  { max-width: none; padding: 0; }

  /* ---- Modals / sheets ---- */
  .v-modal-overlay {
    position: fixed; inset: 0; z-index: 120;
    display: flex; align-items: flex-start; justify-content: center;
    padding: min(6vh, 48px) 16px;
    background: rgba(0,0,0,0.6);
    animation: vFadeIn var(--dur-2) ease both;
    overscroll-behavior: contain;
  }
  .v-modal-card {
    width: 100%; max-width: 820px;
    max-height: 88vh; max-height: 88dvh;
    overflow-y: auto;
    animation: vFadeInUp var(--dur-3) var(--ease-out) both;
  }
  /* Phone: become a bottom sheet that uses the full width and most of the height */
  @media (max-width: 640px) {
    .v-modal-overlay { align-items: flex-end; padding: 0; }
    .v-modal-card {
      max-width: 100%;
      max-height: 94vh; max-height: 94dvh;
      border-radius: var(--r-xl) var(--r-xl) 0 0 !important;
      border-bottom: none !important;
      padding: 20px 16px calc(20px + var(--sa-b)) !important;
      animation: vSheetUp var(--dur-3) var(--ease-out) both;
    }
  }

  /* ---- Focus ring: visible on every theme (accent + a contrasting halo) ---- */
  .v-btn:focus-visible, .v-navitem:focus-visible, .v-swatch:focus-visible,
  .v-hometile:focus-visible, .v-rail-brand:focus-visible,
  a:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 2px solid var(--v-accent, #4d9bff);
    outline-offset: 2px;
    box-shadow: 0 0 0 4px var(--v-accent-soft, rgba(120,120,255,0.4));
    border-radius: var(--r-sm);
  }

  /* ==========================================================================
     Breakpoints
     1080px — narrow the rail so content keeps room on small laptops
      900px — rail becomes an off-canvas drawer behind a top bar
      640px — phone: sheets, tighter gutters, single-column grids
     ========================================================================== */
  @media (max-width: 1080px) {
    :root { --rail-w: 208px; }
  }

  @media (max-width: 900px) {
    .v-rail {
      --drawer-w: min(310px, 86vw);
      width: var(--drawer-w);
      left: calc(-1 * var(--drawer-w) - 12px);
      visibility: hidden;
      transition: left var(--dur-3) var(--ease-out), visibility 0s linear var(--dur-3);
      box-shadow: var(--sh-4);
      padding-top: calc(16px + var(--sa-t));
    }
    .v-rail.is-open {
      left: 0;
      visibility: visible;
      transition: left var(--dur-3) var(--ease-out), visibility 0s;
    }
    .v-rail::before { border-right: 1px solid var(--rail-border); }
    .v-main { margin-left: 0; padding-top: calc(var(--topbar-h) + var(--sa-t)); }

    .v-topbar {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 10px;
      height: calc(var(--topbar-h) + var(--sa-t));
      padding: var(--sa-t) calc(12px + var(--sa-r)) 0 calc(12px + var(--sa-l));
      background: var(--rail-bg, var(--v-page-bg));
      border-bottom: 1px solid var(--rail-border, var(--v-divider));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .v-scrim {
      display: block;
      position: fixed; inset: 0;
      z-index: 39;
      background: rgba(0,0,0,0.5);
      animation: vFadeIn var(--dur-2) ease both;
      border: none;
      width: 100%;
    }
    /* the drawer owns the whole viewport height on mobile */
    .v-rail-nav { padding-bottom: 8px; }
  }

  @media (max-width: 640px) {
    .v-hometiles { grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 10px; }
    .v-card { border-radius: var(--r-lg) !important; }
  }

  @media (max-width: 400px) {
    .v-hometiles { grid-template-columns: 1fr 1fr; gap: 8px; }
  }

  /* Wide screens: let dense pages breathe instead of a narrow ribbon */
  @media (min-width: 1600px) {
    .v-container--wide { max-width: 1360px; }
    .v-container--xwide { max-width: 1480px; }
  }

  /* ---- Reduced motion ---- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .v-card:hover, .v-btn:hover, .v-hometile:hover { transform: none !important; }
  }

  /* ---- Print ---- */
  @media print {
    .v-rail, .v-topbar, .v-scrim { display: none !important; }
    .v-main { margin-left: 0 !important; padding-top: 0 !important; }
    .v-card { box-shadow: none !important; break-inside: avoid; }
  }
</style>

<!-- Golf scorecard photos: browsers (aside from patchy Safari support) can't
     render .heic/.heif files in an <img> tag at all, and iPhones shoot HEIC
     by default — so HEIC uploads get converted to JPEG client-side before
     they're stored, entirely in the browser. heic-to (not the older/more
     common heic2any) is used because it tracks current libheif releases —
     heic2any's bundled decoder rejected real iPhone HEIC files in testing. -->
